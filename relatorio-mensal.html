<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Lote Mensal · Relatório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS · identidade Grupo Leh ============
   Paleta oficial (Pantone → hex):
   2965 C #00263d · 2955 C #003865 · 330 C #00524c · 341 C #007A53
   321 C #008c95 · 468 C #ddcba3 · Warm Gray 1 C #d7d2cc
   Tipografia da marca: Goldplay; Figtree é a substituta quando ela não
   estiver instalada. Vermelho de erro não está na paleta: existe só para
   sinalizar bloqueio, e é usado apenas nisso.
   ====================================================== */
:root{
  --marca:#00263d; --marca-2:#003865;
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEE; --line:#D7DCDE; --line-2:#B6C1C6;
  --ink:#00263d; --ink-2:#3D586B; --ink-3:#6C818F;
  --accent:#00727A; --accent-soft:#DCEFF1; --accent-ink:#FFFFFF;
  --ok:#007A53; --ok-soft:#DCEFE6; --warn:#7A5A18; --warn-soft:#F3E9D5; --crit:#A82A1F; --crit-soft:#F8E2DF;
  --shadow:0 1px 2px rgba(0,38,61,.07),0 4px 14px rgba(0,38,61,.07);
  --overlay:rgba(0,38,61,.55);
  --f-display:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --marca:#08192a; --marca-2:#0d2a45;
    --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D; --line-2:#3A607A;
    --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
    --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
    --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    --overlay:rgba(0,10,18,.65);
  }
}
:root[data-theme="dark"]{
  --marca:#08192a; --marca-2:#0d2a45;
  --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D; --line-2:#3A607A;
  --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
  --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
  --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  --overlay:rgba(0,10,18,.65);
}


/* ============ BASE ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1300px;margin:0 auto;padding:20px 16px 120px}
@media (max-width:600px){.wrap{padding:14px 16px 150px}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.sample{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:16px}
.sample b{color:var(--warn)}

/* ============ CONTROLES ============ */
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);font-weight:500}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.big{min-height:44px;padding:10px 18px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ============ TOPO ============ */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.who{display:flex;flex-direction:column;gap:3px}
.who label{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ============ FILA ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .c{font-size:12px;background:var(--surface-2);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.tab.alert .c{background:var(--crit-soft);color:var(--crit)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input{min-width:260px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px;flex-wrap:wrap}
.sgb{border:0;background:transparent;color:var(--ink-2);border-radius:6px;padding:7px 12px;min-height:36px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.sgb:hover:not(:disabled){background:var(--surface)}
.sgb[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sgb:disabled,.sgb.off{color:var(--ink-3)}
.sgb.off .soon{color:var(--ink-3)}
.sgb .c{font-size:12px;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--ink-3)}
.sgb[aria-pressed="true"] .c{background:var(--accent-soft);color:var(--accent)}
/* Botões de tipo no mesmo desenho do funil (02/10): número colorido por tipo quando há pedido. */
.sgb[data-tipo] .c{font-size:12px;line-height:18px;min-width:20px;text-align:center;padding:0 6px;border:1px solid var(--line);margin-left:1px}
.sgb[data-tipo="normal"] .c.tem{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.sgb[data-tipo="urgente"] .c.tem{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.sgb[data-tipo="mensal"] .c.tem{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.sgb .soon{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:600px){.tools input{min-width:0;flex:1}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
.fila{min-width:860px}
.fila thead th{text-align:center}
.fila td.tipo{white-space:nowrap}
.fila tbody tr{cursor:pointer}
.fila tbody tr:hover{background:var(--surface-2)}
.fila tbody tr:last-child td{border-bottom:0}
.fila .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.fila .s{font-size:12px;color:var(--ink-2)}
.fila .pill{max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
td.r,th.r{text-align:right}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:32px 18px;text-align:center;color:var(--ink-2)}
.state h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.state p{max-width:60ch;margin:0 auto 12px}
.banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.banner.ok{background:var(--ok-soft)}
.banner.warn{background:var(--warn-soft)}
.banner.crit{background:var(--crit-soft)}
.banner.info{background:var(--accent-soft)}
.banner .grow{flex:1 1 240px}
.just-inline{display:inline-block;margin-top:4px;font-size:13px;color:var(--ink-2)}
.skel{height:44px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;margin:8px 12px}
@media (prefers-reduced-motion:no-preference){.skel{animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}}


/* ============ BARRA DA MARCA (a mesma do funil) ============ */
.brandbar{background:var(--marca);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brandbar img{height:30px;width:auto;display:block;flex:none}
.brandbar .titulo{border-left:1px solid rgba(255,255,255,.28);padding-left:16px;min-width:0}
.brandbar .marca{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;font-weight:600}
.brandbar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0;color:#fff}
/* Navegação entre as telas da diretoria (29/09): Funil ⇄ Indicadores, levando o mesmo link de acesso */
.brandbar .nav-telas{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bb-link{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;min-height:34px}
.bb-link:hover{background:rgba(255,255,255,.12)}
.bb-link[aria-current="page"]{background:#fff;color:var(--marca);border-color:#fff}
@media (max-width:480px){.brandbar{padding:12px 16px;gap:12px}.brandbar img{height:24px}.brandbar .titulo{padding-left:12px}.brandbar .nav-telas{margin-left:0;width:100%}}
.bb-link{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;min-height:34px}
.bb-link:hover{background:rgba(255,255,255,.12)}
.bb-link[aria-current="page"]{background:#fff;color:var(--marca);border-color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;box-shadow:var(--shadow)}
/* ============ RELATÓRIO DO LOTE ============ */
.wrap{max-width:none;margin:0;padding:20px 24px 60px}
@media (max-width:600px){.wrap{padding:14px 16px 60px}}
.top-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top-acoes label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.estado-lote{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.estado-lote .pacs{display:flex;flex-wrap:wrap;gap:6px}
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:900px){.resumo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card .v{font-family:var(--f-mono);font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.card.corte .v{color:var(--crit)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filtros select.ctl{max-width:260px}
@media (max-width:600px){.filtros select.ctl{max-width:none;flex:1 1 100%}}
table.rel{min-width:760px}
table.rel td.r,table.rel th.r{text-align:right}
table.rel td.mono{white-space:nowrap}
table.rel tr.tot td{font-weight:700;background:var(--surface-2)}
table.rel tbody tr:last-child td{border-bottom:1px solid var(--line)}
.barra-v{display:block;height:4px;border-radius:2px;background:var(--accent);margin-top:4px;opacity:.55}
.tipo-corte{white-space:nowrap}
.nota{font-size:12.5px;color:var(--ink-2);margin:0 0 10px;max-width:90ch}
</style>
</head><body>

<script>
/* RELATÓRIO DO LOTE MENSAL (fase 4, 02/10)
   relatorio-mensal.html?t=<token>. Quanto cada um pediu (por gerência, unidade de
   negócio, centro de custo e família) e o que foi cortado, com o motivo.
   Diretoria, Compras e financeiro veem tudo; cada gerência vê só o que é dela.
   Uma chamada: relatorio_lote_mensal(p_token, p_competencia). */
const SUPABASE_URL = 'https://mbwaqnlmscxbacmxdopr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AR4D1JlHB-Z12--QbzwYWQ_URZzmVwl';
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const brl = v => v === null || v === undefined || isNaN(v) ? '—' : BRL.format(v);
const qtd = v => Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits:3 });
const dt = iso => { if (!iso) return '—'; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR'); };
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome = c => { const d = new Date(String(c).slice(0,10) + 'T12:00:00'); return MESES[d.getMonth()] + '/' + d.getFullYear(); };
const FAMILIAS = { MM:'Peças e materiais de máquinas', MG:'Ferramentas e material geral', SE:'Sementes e tratamento de sementes', DA:'Defensivos agrícolas',
  FE:'Fertilizantes', ST:'Segurança do trabalho', CC:'Cozinha e copa', SP:'Material de aplicação veterinária', MV:'Medicamentos veterinários',
  IA:'Insumos da fábrica de ração', AA:'Alimentação animal', HL:'Higiene e limpeza', CL:'Combustíveis e lubrificantes', ME:'Escritório e expediente',
  MO:'Equipamentos e veículos', AN:'Animais', GR:'Grãos e forragens', RR:'Recursos rurais', RC:'Recicláveis e embalagens vazias', LD:'Limpeza e desinfecção', FORA:'Fora do catálogo' };
const famNome = k => !k || k === 'FORA' ? 'Fora do catálogo' : (FAMILIAS[k] ? k + ' · ' + FAMILIAS[k] : k);
const ESTADO_LOTE = { aberto:['neutral','Ainda não fechou'], em_cotacao:['warn','Em cotação'], enviado:['accent','No financeiro'], encerrado:['ok','Encerrado'] };
const ESTADO_PAC = { aguardando:['accent','no financeiro'], aprovado:['ok','aprovado'], reprovado:['crit','reprovado'] };
const TIPO_CORTE = { item:'Item reprovado pela gerência', quantidade:'Quantidade reduzida', pedido:'Pedido reprovado' };
const ETAPA = { lider:'liderança', gerencial:'gerência', financeiro:'financeiro', cotacao:'cotação' };
const DIMS = [ { id:'gerencia', nome:'Gerência' }, { id:'unidade', nome:'Unidade de negócio' }, { id:'cc', nome:'Centro de custo' }, { id:'familia', nome:'Família' } ];

const S = { r:null, mes:null, aba:'quanto', dim:'gerencia', f:{ ger:'', un:'', cc:'', fam:'' }, carregando:false };

async function rpc(fn, corpo){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(corpo || {}) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
function estado(html){ $('view').innerHTML = '<div class="state">' + html + '</div>'; }

async function carregar(mes){
  if (!TOKEN){ estado('<h3>Este link está incompleto</h3><p>Abra o relatório pelo link da sua tela de compras: ele é pessoal e diz o que você pode ver.</p>'); return; }
  S.carregando = true;
  let r;
  try { r = await rpc('relatorio_lote_mensal', { p_token:TOKEN, p_competencia:mes || null }); }
  catch (e){ S.carregando = false; estado('<h3>Não consegui abrir o relatório agora</h3><p>O banco de compras não respondeu. Confira a internet e tente de novo.</p><button class="btn primary" type="button" id="bt-tentar">Tentar de novo</button>'); $('bt-tentar').onclick = () => carregar(mes); return; }
  S.carregando = false;
  if (!r || r.ok !== true){
    estado('<h3>' + (r && r.erro === 'sem_acesso' ? 'Este relatório não está no seu acesso' : 'Este link não vale mais') + '</h3><p>' + esc((r && r.mensagem) || '') + '</p>');
    return;
  }
  S.r = r; S.mes = r.competencia;
  const quem = r.quem || {};
  $('quem').textContent = (quem.nome || '') + (r.ve_tudo ? '' : ' · só a sua gerência');
  if (quem.tipo === 'diretoria'){
    $('nav-telas').hidden = false; $('bb-marca').textContent = 'Compras · Visão da diretoria';
    $('lnk-funil').href = 'painel.html?t=' + encodeURIComponent(TOKEN);
    $('lnk-indicadores').href = 'indicadores.html?t=' + encodeURIComponent(TOKEN);
  }
  $('f-mes').innerHTML = (r.competencias || []).map(c => `<option value="${esc(c.competencia)}" ${c.competencia === r.competencia ? 'selected' : ''}>${esc(mesNome(c.competencia))}${c.estado === 'aberto' ? ' (ainda não fechou)' : ''}</option>`).join('');
  /* um filtro que não existe no mês novo some */
  const op = opcoes();
  Object.keys(S.f).forEach(k => { if (S.f[k] && !op[k].some(([v]) => v === S.f[k])) S.f[k] = ''; });
  desenhar();
}

/* ---------- dados filtrados ---------- */
const chaveUn = x => x.unidade_negocio || '—';
const passa = x => (!S.f.ger || x.gerencia_id === S.f.ger) && (!S.f.un || chaveUn(x) === S.f.un) && (!S.f.cc || x.centro_custo === S.f.cc) && (!S.f.fam || (x.familia || 'FORA') === S.f.fam);
const itens = () => (S.r ? S.r.itens : []).filter(passa);
const cortes = () => (S.r ? S.r.cortes : []).filter(passa);
function opcoes(){
  const todos = (S.r ? S.r.itens.concat(S.r.cortes) : []);
  const g = new Map(), u = new Set(), c = new Map(), f = new Set();
  todos.forEach(x => { g.set(x.gerencia_id, x.gerencia); u.add(chaveUn(x)); if (x.centro_custo) c.set(x.centro_custo, x.centro_custo_nome || ''); f.add(x.familia || 'FORA'); });
  const alfa = (a, b) => String(a[1]).localeCompare(String(b[1]), 'pt-BR');
  return { ger:[...g].sort(alfa), un:[...u].sort((a,b) => a.localeCompare(b, 'pt-BR')).map(x => [x, x]),
           cc:[...c].sort((a,b) => String(a[0]).localeCompare(String(b[0]), 'pt-BR', { numeric:true })).map(([k,n]) => [k, k + (n ? ' · ' + n : '')]),
           fam:[...f].sort().map(k => [k, famNome(k)]) };
}
const filtroAtivo = () => Object.values(S.f).some(Boolean);

/* ---------- agrupamento ---------- */
function chaveDim(x, dim){
  if (dim === 'gerencia') return [x.gerencia_id, x.gerencia || 'Sem gerência'];
  if (dim === 'unidade') return [chaveUn(x), chaveUn(x)];
  if (dim === 'cc') return [x.centro_custo || '—', (x.centro_custo || '—') + (x.centro_custo_nome ? ' · ' + x.centro_custo_nome : '')];
  const k = x.familia || 'FORA'; return [k, famNome(k)];
}
function agrupar(dim){
  const g = new Map();
  const novo = (k, n) => ({ k, nome:n, pedidos:new Set(), linhas:0, aprovadas:0, comprado:0, cortadoValor:0, cortes:0, temValor:false });
  itens().forEach(x => {
    const [k, n] = chaveDim(x, dim); if (!g.has(k)) g.set(k, novo(k, n)); const G = g.get(k);
    G.pedidos.add(x.pedido_id); G.linhas++;
    if (Number(x.qtd_aprovada) > 0) G.aprovadas++;
    if (x.valor !== null && x.valor !== undefined){ G.comprado += Number(x.valor); G.temValor = true; }
    if (x.valor_cortado !== null && x.valor_cortado !== undefined) G.cortadoValor += Number(x.valor_cortado);
  });
  cortes().forEach(x => { const [k, n] = chaveDim(x, dim); if (!g.has(k)) g.set(k, novo(k, n)); g.get(k).cortes++; });
  return [...g.values()].sort((a, b) => b.comprado - a.comprado || a.nome.localeCompare(b.nome, 'pt-BR'));
}

/* ---------- desenho ---------- */
function desenhar(){
  const r = S.r, L = r.lote || {}, est = ESTADO_LOTE[L.estado] || ['neutral', L.estado || '—'];
  $('titulo').textContent = 'Lote mensal de ' + mesNome(r.competencia);
  const I = itens(), C = cortes();
  const pedidos = new Set(I.map(x => x.pedido_id));
  const comprado = I.reduce((t, x) => t + (x.valor != null ? Number(x.valor) : 0), 0);
  const cortadoV = I.reduce((t, x) => t + (x.valor_cortado != null ? Number(x.valor_cortado) : 0), 0);
  const semValor = !I.some(x => x.valor != null);
  const pacs = (L.pacotes || []).filter(p => !S.f.ger || p.gerencia_id === S.f.ger);
  const ops = opcoes();
  const sel = (k, rot, todos) => `<select class="ctl" id="f-${k}" aria-label="${rot}"><option value="">${todos}</option>${ops[k].map(([v, n]) => `<option value="${esc(v)}" ${S.f[k] === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const tab = (id, nome, n) => `<button class="tab" role="tab" type="button" data-aba="${id}" aria-selected="${S.aba === id}">${nome}${n !== undefined ? `<span class="c num">${n}</span>` : ''}</button>`;
  let corpo;
  if (!r.itens.length && !r.cortes.length){
    corpo = `<div class="state"><h3>Nenhuma compra mensal em ${esc(mesNome(r.competencia))}</h3><p>${L.estado === 'aberto' ? 'Quando as gerências aprovarem compras mensais, elas aparecem aqui até Compras fechar o mês.' : 'Este lote não tem pedidos no seu acesso.'}</p></div>`;
  } else if (!I.length && !C.length){
    corpo = `<div class="state"><h3>Nada com esses filtros</h3><p>Tire os filtros para ver o mês inteiro.</p><button class="btn primary" type="button" id="bt-limpa">Tirar os filtros</button></div>`;
  } else if (S.aba === 'quanto') corpo = tabelaQuanto(semValor);
  else if (S.aba === 'itens') corpo = tabelaItens(I);
  else corpo = tabelaCortes(C);

  $('view').innerHTML = `
    <div class="estado-lote"><span class="pill ${est[0]}">${est[1]}</span>
      <span>${L.estado === 'aberto' ? 'Ainda não fechado: os pedidos entram na cotação quando Compras fechar o mês' : `Fechado por Compras em <strong>${dt(L.corte_em)}</strong>`}</span>
      ${pacs.length ? `<span class="pacs" aria-label="Pacotes por gerência">${pacs.map(p => { const e = ESTADO_PAC[p.estado] || ['neutral', p.estado]; return `<span class="pill ${e[0]}" title="${esc(p.motivo || '')}">${esc(p.gerencia)} · ${e[1]} · ${brl(Number(p.total))}</span>`; }).join('')}</span>` : ''}
    </div>
    ${L.estado === 'aberto' ? `<p class="nota">O lote de ${esc(mesNome(r.competencia))} ainda não fechou. Aparecem os pedidos que já aguardam o fechamento; o valor só existe depois da cotação.</p>` : ''}
    <div class="resumo">
      <div class="card"><div class="k">Pedidos</div><div class="v">${pedidos.size}</div><div class="s">${plural(new Set(I.map(x => x.gerencia_id)).size, 'gerência', 'gerências')} · ${plural(new Set(I.map(x => x.centro_custo)).size, 'centro de custo', 'centros de custo')}</div></div>
      <div class="card"><div class="k">Itens pedidos</div><div class="v">${I.length}</div><div class="s">${plural(I.filter(x => Number(x.qtd_aprovada) > 0).length, 'aprovado', 'aprovados')} pela gerência</div></div>
      <div class="card"><div class="k">Valor comprado</div><div class="v">${semValor ? '—' : brl(comprado)}</div><div class="s">${semValor ? 'sai da cotação do lote' : 'preço do lote, com desconto e frete divididos'}</div></div>
      <div class="card corte"><div class="k">O que foi cortado</div><div class="v">${C.length}</div><div class="s">${plural(C.length, 'corte', 'cortes')}${cortadoV ? ' · ' + brl(cortadoV) + ' reprovados no financeiro' : ''}</div></div>
    </div>
    <div class="filtros" role="group" aria-label="Filtros">${sel('ger','Gerência','Todas as gerências')}${sel('un','Unidade de negócio','Todas as unidades')}${sel('cc','Centro de custo','Todos os centros de custo')}${sel('fam','Família','Todas as famílias')}${filtroAtivo() ? '<button class="btn ghost" type="button" id="bt-limpa-f">Tirar filtros</button>' : ''}</div>
    <div class="tabs" role="tablist">${tab('quanto','Quanto cada um pediu')}${tab('itens','Item a item', I.length)}${tab('cortes','O que foi cortado', C.length)}</div>
    ${corpo}`;

  ['ger','un','cc','fam'].forEach(k => { const el = $('f-' + k); el.onchange = () => { S.f[k] = el.value; desenhar(); $('f-' + k).focus(); }; });
  if ($('bt-limpa-f')) $('bt-limpa-f').onclick = () => { S.f = { ger:'', un:'', cc:'', fam:'' }; desenhar(); };
  if ($('bt-limpa')) $('bt-limpa').onclick = () => { S.f = { ger:'', un:'', cc:'', fam:'' }; desenhar(); };
  document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { S.aba = b.dataset.aba; desenhar(); const n = document.querySelector(`[data-aba="${S.aba}"]`); if (n) n.focus(); });
  document.querySelectorAll('[data-dim]').forEach(b => b.onclick = () => { S.dim = b.dataset.dim; desenhar(); const n = document.querySelector(`[data-dim="${S.dim}"]`); if (n) n.focus(); });
}

function tabelaQuanto(semValor){
  const G = agrupar(S.dim), max = Math.max(1, ...G.map(g => g.comprado));
  const dimNome = DIMS.find(d => d.id === S.dim).nome;
  const tot = G.reduce((t, g) => ({ linhas:t.linhas + g.linhas, aprovadas:t.aprovadas + g.aprovadas, comprado:t.comprado + g.comprado, cortadoValor:t.cortadoValor + g.cortadoValor, cortes:t.cortes + g.cortes }), { linhas:0, aprovadas:0, comprado:0, cortadoValor:0, cortes:0 });
  const pedTot = new Set(itens().map(x => x.pedido_id)).size;
  return `<div class="tools"><div class="seg" role="group" aria-label="Agrupar por">${DIMS.map(d => `<button class="sgb" type="button" data-dim="${d.id}" aria-pressed="${S.dim === d.id}">Por ${d.nome.toLowerCase()}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><table class="rel" id="tb-quanto"><thead><tr><th>${dimNome}</th><th class="r">Pedidos</th><th class="r">Itens pedidos</th><th class="r">Itens aprovados</th><th class="r">Cortes</th><th class="r">Valor comprado</th><th class="r">Reprovado no financeiro</th></tr></thead><tbody>
    ${G.map(g => `<tr><td>${esc(g.nome)}${g.temValor ? `<span class="barra-v" style="width:${Math.max(2, Math.round(g.comprado / max * 100))}%"></span>` : ''}</td><td class="r num">${g.pedidos.size}</td><td class="r num">${g.linhas}</td><td class="r num">${g.aprovadas}</td><td class="r num">${g.cortes}</td><td class="r num">${g.temValor ? brl(g.comprado) : '—'}</td><td class="r num">${g.cortadoValor ? brl(g.cortadoValor) : '—'}</td></tr>`).join('')}
    </tbody><tfoot><tr class="tot"><td>Total${filtroAtivo() ? ' com os filtros' : ''}</td><td class="r num">${pedTot}</td><td class="r num">${tot.linhas}</td><td class="r num">${tot.aprovadas}</td><td class="r num">${tot.cortes}</td><td class="r num">${semValor ? '—' : brl(tot.comprado)}</td><td class="r num">${tot.cortadoValor ? brl(tot.cortadoValor) : '—'}</td></tr></tfoot></table></div>`;
}
function situacaoItem(x){
  if (x.cortado) return ['crit', 'Cortado pela gerência'];
  if (x.status === 'reprovado') return ['crit', 'Reprovado'];
  if (x.status === 'cancelado') return ['neutral', 'Cancelado'];
  if (x.incluido) return ['accent', 'Incluído pela gerência'];
  if (Number(x.qtd_pedida) > Number(x.qtd_aprovada)) return ['warn', 'Quantidade reduzida'];
  const t = String(x.situacao || 'aprovado'); return ['ok', t.charAt(0).toUpperCase() + t.slice(1)];
}
function tabelaItens(I){
  return `<div class="tbl-wrap"><table class="rel" id="tb-itens"><thead><tr><th>Pedido</th><th>Gerência</th><th>Unidade</th><th>Centro de custo</th><th>Família</th><th>Item</th><th class="r">Pedido</th><th class="r">Aprovado</th><th>Fornecedor</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>
    ${I.map(x => { const s = situacaoItem(x); return `<tr><td class="mono">${esc(x.numero)}</td><td>${esc(x.gerencia)}</td><td>${esc(chaveUn(x))}</td><td><span class="mono">${esc(x.centro_custo || '')}</span> ${esc(x.centro_custo_nome || '')}</td><td>${esc(famNome(x.familia))}</td><td>${esc(x.descricao)}${x.codigo ? ` <span class="muted mono">${esc(x.codigo)}</span>` : ''}</td><td class="r num">${qtd(x.qtd_pedida)} ${esc(x.unidade || '')}</td><td class="r num">${qtd(x.qtd_aprovada)} ${esc(x.unidade || '')}</td><td>${esc(x.fornecedor || '—')}</td><td class="r num">${x.valor != null ? brl(Number(x.valor)) : (x.valor_cortado != null ? `<s>${brl(Number(x.valor_cortado))}</s>` : '—')}</td><td><span class="pill ${s[0]}">${esc(s[1])}</span></td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function tabelaCortes(C){
  if (!C.length) return '<div class="state"><h3>Nada foi cortado</h3><p>Nenhum item reprovado, nenhuma quantidade reduzida e nenhum pedido reprovado neste mês.</p></div>';
  return `<div class="tbl-wrap"><table class="rel" id="tb-cortes"><thead><tr><th>Quando</th><th>O quê</th><th>Pedido</th><th>Gerência</th><th>Centro de custo</th><th>Item</th><th class="r">Qtd. cortada</th><th class="r">Valor</th><th>Motivo</th><th>Quem cortou</th></tr></thead><tbody>
    ${C.map(x => `<tr><td class="num">${dt(x.em)}</td><td class="tipo-corte">${esc(TIPO_CORTE[x.tipo] || x.tipo)}${x.tipo === 'pedido' && x.etapa ? ' (' + esc(ETAPA[x.etapa] || x.etapa) + ')' : ''}</td><td class="mono">${esc(x.numero)}</td><td>${esc(x.gerencia)}</td><td><span class="mono">${esc(x.centro_custo || '')}</span> ${esc(x.centro_custo_nome || '')}</td><td>${esc(x.descricao)}</td><td class="r num">${qtd(x.quantidade)} ${esc(x.unidade || '')}</td><td class="r num">${x.valor != null ? brl(Number(x.valor)) : '—'}</td><td>${esc(x.motivo || '—')}</td><td>${esc(x.por || '—')}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ---------- planilha (CSV para o Excel: ; e vírgula decimal) ---------- */
function csv(nome, cab, linhas){
  const cel = v => { const s = v === null || v === undefined ? '' : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = v => v === null || v === undefined || v === '' ? '' : String(Number(v)).replace('.', ',');
  const txt = '﻿' + [cab].concat(linhas.map(l => l.map((v, i) => typeof v === 'number' ? num(v) : v))).map(l => l.map(cel).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const nomeArq = t => 'lote-mensal-' + String(S.mes || '').slice(0,7) + '-' + t + '.csv';
$('bt-csv-itens').onclick = () => {
  if (!S.r) return;
  const I = itens(); if (!I.length){ toast('Nada para baixar com esses filtros'); return; }
  csv(nomeArq('itens'), ['Pedido','Gerência','Unidade de negócio','Centro de custo','Nome do centro de custo','Família','Código','Item','Unidade','Qtd. pedida','Qtd. aprovada','Fornecedor','Valor comprado','Valor reprovado','Situação'],
    I.map(x => [x.numero, x.gerencia, chaveUn(x), x.centro_custo, x.centro_custo_nome, famNome(x.familia), x.codigo, x.descricao, x.unidade,
                Number(x.qtd_pedida), Number(x.qtd_aprovada), x.fornecedor, x.valor != null ? Number(x.valor) : null, x.valor_cortado != null ? Number(x.valor_cortado) : null, situacaoItem(x)[1]]));
  toast('Planilha de itens baixada');
};
$('bt-csv-cortes').onclick = () => {
  if (!S.r) return;
  const C = cortes(); if (!C.length){ toast('Nada cortado com esses filtros'); return; }
  csv(nomeArq('cortes'), ['Quando','O quê','Etapa','Pedido','Gerência','Unidade de negócio','Centro de custo','Família','Item','Unidade','Qtd. cortada','Valor','Motivo','Quem cortou'],
    C.map(x => [dt(x.em), TIPO_CORTE[x.tipo] || x.tipo, ETAPA[x.etapa] || x.etapa, x.numero, x.gerencia, chaveUn(x), x.centro_custo, famNome(x.familia), x.descricao, x.unidade,
                Number(x.quantidade), x.valor != null ? Number(x.valor) : null, x.motivo, x.por]));
  toast('Planilha de cortes baixada');
};
$('f-mes').onchange = () => carregar($('f-mes').value);

carregar(null);
</script>

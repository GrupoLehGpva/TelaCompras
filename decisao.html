<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decisão registrada · Grupo Leh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  ============================================================================
  TELA DA DECISÃO — Grupo Leh · Compras
  Para onde o aprovador cai depois de clicar em Aprovar ou Reprovar no Slack.
  Antes ele caía na página do n8n; esta é nossa.

  O n8n redireciona para cá com:
    ?d=aprovado|reprovado|ja|erro   o que aconteceu
    &e=lider|gerencial|financeiro   qual das três aprovações
    &sc=SC-AAAA-NNNN                número da solicitação (para o resumo)
    &id=<uuid>                      id da solicitação, quando existir
    &card=<url do ClickUp>

  A página não decide nada e não grava nada: quem move o card é o n8n. Aqui
  só se conta o que aconteceu e se mostra o pedido para conferência. Por isso
  ela pode ser aberta de novo sem efeito colateral.
  ============================================================================
-->
<style>
  :root{
    /* Identidade Grupo Leh — livro da marca, maio 2024
       2965 C #00263d · 2955 C #003865 · 341 C #007A53 · 330 C #00524c
       321 C #008c95 · 468 C #ddcba3 · Warm Gray 1 C #d7d2cc */
    color-scheme:light;   /* faz o navegador desenhar rádio, seleção e data no tema certo */
    --marca:#00263d;      --sobre-marca:#FFFFFF;      --azul:#003865;
    --verde:#008c95;      --acento-fundo:#00727a;     --sobre-acento:#FFFFFF;
    --verde-claro:#E2F1F2; --verde-folha:#007A53;     --verde-mata:#00524c;
    --areia:#ddcba3;      --cinza-quente:#d7d2cc;
    --bg:#F2F5F8;         --card:#FFFFFF;           --realce:#F7F9FB;
    --texto:#0F2233;      --muted:#5F7284;
    --borda:#DBE3EA;      --linha-forte:#B4C2CE;
    --erro:#B3261E;       --erro-bg:#FDF2F1;        --erro-borda:#E8B4B0;
    --demo:#8A5A00;       --demo-bg:#FFF8E8;        --demo-borda:#EFDDB4;
    --ok-bg:#E1F0E9;      --ok-txt:#007A53;
    --codigo-bg:#00263d;  --codigo-txt:#CFE3E5;
    --raio:12px;          --pilula:100px;
    /* O livro da marca adota GoldPlay e autoriza Arial para meios eletrônicos.
       Figtree entra entre as duas como equivalente aberto mais próximo. */
    --sans:"Goldplay","Goldplay Alt","Figtree",Arial,Helvetica,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --marca:#001725;      --sobre-marca:#FFFFFF;      --azul:#0A4472;
      --verde:#2FB3BC;      --acento-fundo:#56C8CF;   --sobre-acento:#04161F;
      --verde-claro:#0D2A2D; --verde-folha:#3FA37E;   --verde-mata:#0B3B37;
      --areia:#7A6E55;      --cinza-quente:#6E6A65;
      --bg:#08131C;         --card:#0F1D28;           --realce:#152431;
      --texto:#E6EDF3;      --muted:#9CABB9;
      --borda:#22323F;      --linha-forte:#36485B;
      --erro:#F0A0A0;       --erro-bg:#2A1616;        --erro-borda:#5B2A2A;
      --demo:#E0B860;       --demo-bg:#241D0E;        --demo-borda:#3B3218;
      --ok-bg:#0F2C21;      --ok-txt:#5FC79A;
      --codigo-bg:#04121B;  --codigo-txt:#CFE3E5;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --marca:#001725;    --sobre-marca:#FFFFFF;    --azul:#0A4472;
    --verde:#2FB3BC;    --acento-fundo:#56C8CF;   --sobre-acento:#04161F;
    --verde-claro:#0D2A2D; --verde-folha:#3FA37E;   --verde-mata:#0B3B37;
    --areia:#7A6E55;    --cinza-quente:#6E6A65;
    --bg:#08131C;       --card:#0F1D28;         --realce:#152431;
    --texto:#E6EDF3;    --muted:#9CABB9;
    --borda:#22323F;    --linha-forte:#36485B;
    --erro:#F0A0A0;     --erro-bg:#2A1616;      --erro-borda:#5B2A2A;
    --demo:#E0B860;     --demo-bg:#241D0E;      --demo-borda:#3B3218;
    --ok-bg:#0F2C21;    --ok-txt:#5FC79A;
    --codigo-bg:#04121B;  --codigo-txt:#CFE3E5;
  }
  .marca-bloco{display:flex;align-items:center;gap:16px;min-width:0}
  .marca-bloco .titulo-tela{border-left:1px solid rgba(255,255,255,.28);padding-left:16px;min-width:0}
  .logo-leh{display:block;height:34px;width:auto;flex:none}
  .logo-leh.impressao{display:none}
  @media (max-width:420px){ .logo-leh{height:28px} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--texto);
    font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .topo{background:var(--marca);color:var(--sobre-marca);padding:14px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .topo .marca{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.72}
  .topo h1{margin:2px 0 0;font-size:19px;font-weight:650;line-height:1.2}
  .topo .direita{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .selo{border-radius:var(--pilula);padding:5px 12px;font-size:12px;font-weight:700;
    background:rgba(255,255,255,.12);color:var(--sobre-marca);white-space:nowrap}
  .selo.status{background:var(--verde);color:var(--sobre-acento)}
  .envelope{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
  .cartao{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);
    padding:18px 20px;margin-bottom:16px}
  .cartao h2{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;color:var(--muted)}
  .ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px;margin:0}
  .ficha dt{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  .ficha dd{margin:3px 0 0;font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
  .ficha dd.solto{font-weight:400}
  .barra-ferramentas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .busca-tabela{flex:1 1 240px;min-width:0}
  .busca-tabela input{width:100%;padding:11px 12px;font-size:15px;font-family:inherit;color:inherit;
    background:var(--card);border:1px solid var(--borda);border-radius:10px;appearance:none}
  .busca-tabela input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro)}
  .btn{border-radius:var(--pilula);border:1px solid var(--borda);background:var(--card);
    color:var(--texto);font:inherit;font-size:14px;font-weight:600;padding:10px 18px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--linha-forte)}
  .rolagem{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--raio);background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:560px}
  thead th{position:sticky;top:0;background:var(--realce);border-bottom:1px solid var(--borda);
    text-align:left;padding:11px 14px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
  thead th:hover{color:var(--texto)}
  thead th .seta{opacity:.35;margin-left:6px;font-size:10px}
  thead th[aria-sort] .seta{opacity:1;color:var(--verde)}
  tbody td{border-bottom:1px solid var(--borda);padding:11px 14px;vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even){background:var(--realce)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.cod{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
  td.desc{font-weight:600;min-width:220px}
  .vazio-tabela{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
  .rodape-tabela{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:12px;font-size:13px;color:var(--muted)}
  .rodape-tabela b{color:var(--texto);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .escopo{white-space:pre-wrap;font-size:15px;line-height:1.6;margin:0}
  .aviso{border:1px dashed var(--demo-borda);background:var(--demo-bg);color:var(--demo);
    border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.5;margin-bottom:16px}
  .erro{border:1px solid var(--erro-borda);background:var(--erro-bg);color:var(--erro);
    border-radius:10px;padding:16px;font-size:14px;line-height:1.5}
  .carregando{color:var(--muted);padding:30px 4px;font-size:14px}
  .marca-dagua{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
  @media (max-width:560px){
    .envelope{padding:14px 10px 48px}
    .cartao{padding:15px 14px}
  }
  @media print{
    .topo{background:none;color:#000;border-bottom:2px solid var(--marca)}
    .logo-leh{display:none}
    .logo-leh.impressao{display:block}
    .marca-bloco .titulo-tela{border-left-color:var(--linha-forte)}
    .barra-ferramentas,.btn{display:none}
    .rolagem{overflow:visible;border:0}
    body{background:#fff}
  }

  /* ---- página da decisão ---- */
  .envelope{max-width:760px}
  .veredito{border-radius:var(--raio);padding:26px 24px;margin-bottom:18px;
    border:1px solid var(--borda);background:var(--card)}
  .veredito .faixa{display:flex;align-items:center;gap:14px}
  .veredito .marcador{width:44px;height:44px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
  .veredito h2{margin:0;font-size:22px;line-height:1.2;border:0;padding:0}
  .veredito .passo{margin:14px 0 0;color:var(--muted);line-height:1.6;font-size:15px}
  .v-ok .marcador{background:var(--ok-bg);color:var(--ok-txt)}
  .v-ok h2{color:var(--ok-txt)}
  .v-nao .marcador{background:var(--erro-bg);color:var(--erro)}
  .v-nao h2{color:var(--erro)}
  .v-ja .marcador{background:var(--demo-bg);color:var(--demo)}
  .v-ja h2{color:var(--demo)}
  .v-erro .marcador{background:var(--erro-bg);color:var(--erro)}
  .v-erro h2{color:var(--erro)}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .acoes a{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;
    padding:11px 18px;border-radius:var(--pilula);border:1px solid var(--linha-forte);
    color:var(--texto);background:var(--card)}
  .acoes a.principal{background:var(--acento-fundo);color:var(--sobre-acento);
    border-color:var(--acento-fundo)}
  .acoes a:hover{border-color:var(--verde)}
  /* A tabela rola dentro dela mesma: no celular, item longo não pode empurrar
     a página inteira para o lado. */
  .rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .itens-resumo{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
  .itens-resumo th,.itens-resumo td{text-align:left;padding:8px 10px;
    border-bottom:1px solid var(--borda)}
  .itens-resumo th{color:var(--muted);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:.04em}
  .itens-resumo td.qtd{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .topo .direita{min-width:0}
  .selo{max-width:100%;overflow-wrap:anywhere}
  .rodape-nota{color:var(--muted);font-size:13px;margin-top:22px;line-height:1.6}

</style>
</head>

    <div class="titulo-tela">
      <div class="marca">Compras</div>
      <h1 id="tituloTopo">Decisão registrada</h1>
    </div>
  </div>
  <div class="direita">
    <span class="selo" id="seloNumero" hidden></span>
  </div>
</header>

<div class="envelope">

  <section class="veredito" id="veredito">
    <div class="faixa">
      <div class="marcador" id="marcador">·</div>
      <h2 id="titulo">Registrando…</h2>
    </div>
    <p class="passo" id="passo"></p>
  </section>

  <section class="cartao" id="cartaoPedido" hidden>
    <h2>O que foi decidido</h2>
    <dl class="ficha" id="fichaPedido"></dl>
    <div id="blocoItens"></div>
  </section>

  <div class="acoes" id="acoes"></div>

  <p class="rodape-nota">
    Pode fechar esta janela. A decisão já está registrada no card —
    esta página apenas mostra o que aconteceu.
  </p>
</div>

<script>
/* ============================================================================
   1) PARÂMETROS
   ========================================================================== */
const q   = new URLSearchParams(location.search);
const dec = (q.get('d') || '').toLowerCase();
const eta = (q.get('e') || '').toLowerCase();
const sc  = (q.get('sc') || '').trim();
const sid = (q.get('id') || '').trim();
const card = (q.get('card') || '').trim();

const $ = id => document.getElementById(id);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Só aceita link do ClickUp. Sem isso, quem montar a URL na mão consegue
   pendurar um endereço qualquer num botão que parece nosso. */
function linkSeguro(u){
  try{
    const p = new URL(u);
    if(p.protocol !== 'https:') return '';
    if(!/(^|\.)clickup\.com$/.test(p.hostname)) return '';
    return p.href;
  }catch(e){ return ''; }
}

/* ============================================================================
   2) O TEXTO DE CADA DESFECHO
   Uma linha para o que aconteceu, outra para o que acontece a seguir. O
   aprovador clicou e foi embora — ele precisa saber se acabou ali ou não.
   ========================================================================== */
const ETAPA_NOME = {
  lider:      '1ª aprovação · liderança imediata',
  gerencial:  '2ª aprovação · gerencial',
  financeiro: '3ª aprovação · financeira'
};
const SEGUE = {
  lider:      'A solicitação segue para o setor de compras cotar com os fornecedores.',
  gerencial:  'A solicitação segue para a 3ª aprovação, com o financeiro.',
  financeiro: 'A compra está liberada. O card foi para <b>efetuar compra</b>.'
};

function desfecho(){
  const etapa = ETAPA_NOME[eta] || 'Aprovação';
  if(dec === 'aprovado') return {
    classe:'v-ok', icone:'✓', titulo:'Aprovado',
    passo: etapa + '. ' + (SEGUE[eta] || 'A solicitação segue no fluxo.')
  };
  if(dec === 'reprovado') return {
    classe:'v-nao', icone:'✕', titulo:'Reprovado',
    passo: etapa + '. A solicitação foi encerrada e o card foi para <b>reprovado</b>. ' +
           'Se quiser registrar o motivo, comente no card — é o que o solicitante vai ler.'
  };
  if(dec === 'ja') return {
    classe:'v-ja', icone:'!', titulo:'Esta solicitação já tinha sido decidida',
    passo: 'Nada mudou agora. Alguém já respondeu esta etapa antes — pode ter sido você, ' +
           'num clique anterior. Abra o card para ver em que ponto a solicitação está.'
  };
  return {
    classe:'v-erro', icone:'!', titulo:'Não consegui registrar a decisão',
    passo: 'O link pode ter expirado ou estar incompleto. Abra o card no ClickUp e ' +
           'mova a coluna manualmente, ou fale com o setor de compras.'
  };
}

/* ============================================================================
   3) DESENHO
   ========================================================================== */
function desenharVeredito(){
  const d = desfecho();
  $('veredito').classList.add(d.classe);
  $('marcador').textContent = d.icone;
  $('titulo').textContent   = d.titulo;
  $('passo').innerHTML      = d.passo;
  document.title = d.titulo + ' · Grupo Leh';
  $('tituloTopo').textContent = d.titulo;
  // Número vem da URL: cortado no tamanho de um SC real, senão um parâmetro
  // gigante estica o cabeçalho e a página inteira ganha rolagem lateral.
  if(sc){ $('seloNumero').textContent = sc.slice(0, 24); $('seloNumero').hidden = false; }
}

function desenharAcoes(){
  const box = $('acoes');
  const url = linkSeguro(card);
  if(url){
    const a = document.createElement('a');
    a.className = 'principal'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Abrir o card no ClickUp';
    box.appendChild(a);
  }
  if(sid || sc){
    const b = document.createElement('a');
    b.href = 'pedido.html?' + (sid ? 'id=' + encodeURIComponent(sid) : 'sc=' + encodeURIComponent(sc));
    b.textContent = 'Ver o pedido completo';
    box.appendChild(b);
  }
}

const campo = (r, v) => '<dt>' + esc(r) + '</dt><dd>' + esc(v || '—') + '</dd>';
const dataBR = iso => {
  if(!iso) return '—';
  const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso);
  return isNaN(d) ? String(iso) : d.toLocaleDateString('pt-BR');
};
const numBR = n => Number(n||0).toLocaleString('pt-BR', {maximumFractionDigits:3});

/* ============================================================================
   4) RESUMO DO PEDIDO — mesma leitura da tela do pedido
   Vale a pena mesmo depois do clique: é a conferência do que a pessoa acabou
   de aprovar, sem precisar abrir outra aba. Se o banco não responder, a
   página continua de pé sem o resumo — o que importa é o veredito.
   ========================================================================== */
const SUPABASE_URL = 'https://mbwaqnlmscxbacmxdopr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AR4D1JlHB-Z12--QbzwYWQ_URZzmVwl';

async function apiGet(caminho){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + caminho, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function nomeDoCentro(codigo){
  if(!codigo) return '';
  try{
    const r = await apiGet('centros_custo?select=nome,unidade&codigo=eq.' +
      encodeURIComponent(codigo) + '&limit=1');
    if(r.length) return r[0].nome + (r[0].unidade ? ' · ' + r[0].unidade : '');
  }catch(e){ /* sem banco: mostra o código puro */ }
  return '';
}

async function carregarResumo(){
  if(!sid && !sc) return;
  if(dec === 'erro') return;   // sem decisão registrada, resumo só confunde
  try{
    const filtro = sid ? 'id=eq.' + encodeURIComponent(sid)
                       : 'numero=eq.' + encodeURIComponent(sc);
    const achadas = await apiGet('solicitacoes?select=*&' + filtro + '&limit=1');
    if(!achadas.length) return;
    const s = achadas[0];

    const [itens, centro] = await Promise.all([
      apiGet('solicitacao_itens?select=*&solicitacao_id=eq.' +
        encodeURIComponent(s.id) + '&order=descricao'),
      nomeDoCentro(s.centro_custo)
    ]);

    $('fichaPedido').innerHTML =
      campo('Solicitação', s.numero) +
      campo('Solicitante', s.solicitante) +
      campo('Centro de custo', s.centro_custo_nome || centro || s.centro_custo) +
      campo('Entrega até', dataBR(s.data_necessidade));

    const ehServico = itens.length === 1 &&
      String(itens[0].unidade||'').toLowerCase() === 'serviço';

    if(ehServico){
      $('blocoItens').innerHTML =
        '<p class="escopo">' + esc(itens[0].descricao) + '</p>';
    } else if(itens.length){
      const linhas = itens.map(i =>
        '<tr><td>' + esc(i.descricao) + '</td>' +
        '<td class="qtd">' + numBR(i.quantidade) + ' ' + esc(i.unidade || '') + '</td></tr>'
      ).join('');
      $('blocoItens').innerHTML =
        '<div class="rolagem"><table class="itens-resumo">' +
        '<thead><tr><th>Item</th><th class="qtd">Qtd.</th></tr></thead>' +
        '<tbody>' + linhas + '</tbody></table></div>';
    }
    $('cartaoPedido').hidden = false;
  }catch(e){ /* o veredito já está na tela; o resumo é bônus */ }
}

desenharVeredito();
desenharAcoes();
carregarResumo();
</script>
</body>
</html>

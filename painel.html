<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Funil de Compras LEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS · identidade Grupo Leh ============
   Paleta oficial (Pantone -> hex), marca/paleta-de-cores.pdf:
   2965 C #00263d · 2955 C #003865 · 330 C #00524c · 341 C #007A53
   321 C #008c95 · 468 C #ddcba3 · Warm Gray 1 C #d7d2cc
   Turquesa em texto pequeno sobre branco usa #00727A, que tem contraste melhor.
   Tipografia: Goldplay, com Figtree como substituta; dinheiro e códigos em IBM Plex Mono.
   O vermelho de erro (#A82A1F) não está na paleta: existe só para bloqueio.
   ======================================================== */
:root{
  color-scheme:light;
  --marca:#00263d; --marca-2:#003865;
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEE; --line:#D7DCDE;
  --ink:#00263d; --ink-2:#3D586B; --ink-3:#6C818F;
  --accent:#00727A; --accent-soft:#DCEFF1; --accent-ink:#FFFFFF;
  --ok:#007A53; --ok-soft:#DCEFE6; --warn:#7A5A18; --warn-soft:#F3E9D5; --crit:#A82A1F; --crit-soft:#F8E2DF;
  --shadow:0 1px 2px rgba(0,38,61,.07),0 4px 14px rgba(0,38,61,.07);
  --overlay:rgba(0,38,61,.55);
  --f-display:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --marca:#08192a; --marca-2:#0d2a45;
    --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D;
    --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
    --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
    --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    --overlay:rgba(0,10,18,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --marca:#08192a; --marca-2:#0d2a45;
  --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D;
  --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
  --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
  --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  --overlay:rgba(0,10,18,.65);
}

/* ============ BARRA DA MARCA ============ */
.brandbar{background:var(--marca);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brandbar img{height:30px;width:auto;display:block;flex:none}
.brandbar .titulo{border-left:1px solid rgba(255,255,255,.28);padding-left:16px;min-width:0}
.brandbar .marca{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;font-weight:600}
.brandbar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0;color:#fff}
/* Navegação entre as telas da diretoria (29/09): Funil ⇄ Indicadores, levando o mesmo link de acesso */
.brandbar .nav-telas{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bb-link{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;min-height:34px}
.bb-link:hover{background:rgba(255,255,255,.12)}
.bb-link[aria-current="page"]{background:#fff;color:var(--marca);border-color:#fff}
@media (max-width:480px){.brandbar{padding:12px 16px;gap:12px}.brandbar img{height:24px}.brandbar .titulo{padding-left:12px}.brandbar .nav-telas{margin-left:0;width:100%}}

/* ============ BASE ============ */
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:none;margin:0;padding:20px 24px 48px}
body{margin:0}
@media (max-width:600px){.wrap{padding:14px 16px 40px}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ HEADER ============ */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.sample{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:16px}
.sample b{color:var(--warn)}

/* ============ FILTERS ============ */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:3px;min-width:160px}
.field label{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
input.ctl{min-width:220px}
@media (max-width:600px){.field{flex:1 1 45%}.field.grow{flex-basis:100%}input.ctl{min-width:0;width:100%}.ctl{width:100%}}
.check{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;min-height:36px;align-self:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);font-weight:500}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.align-end{align-self:flex-end}
/* Quadro | Lista (30/09) */
.sec-dir{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.vista{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.vista button{border:0;background:transparent;color:var(--ink-2);padding:6px 14px;min-height:34px;cursor:pointer;font:inherit;font-weight:500}
.vista button+button{border-left:1px solid var(--line)}
.vista button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Lista: tabela com rolagem própria e cabeçalho parado no topo */
.lista-scroll{max-height:clamp(480px,calc(100vh - 200px),1200px);overflow:auto;margin-bottom:28px;overscroll-behavior:contain}
.lista-scroll table{min-width:1080px}
.lista-scroll thead th{position:sticky;top:0;z-index:2}
.lista-scroll th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.lista-scroll th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lista-scroll th[aria-sort] button::after{content:'↕';opacity:.35;font-size:11px}
.lista-scroll th[aria-sort="ascending"] button::after{content:'↑';opacity:1}
.lista-scroll th[aria-sort="descending"] button::after{content:'↓';opacity:1}
.lista-scroll tr.grupo td{background:var(--surface-2);font-weight:600;font-size:12.5px;cursor:default;position:sticky;top:37px;z-index:1}
.lista-scroll tr.grupo:hover{background:none}
.lista-scroll tr.grupo .g-sub{font-weight:500;color:var(--ink-3);margin-left:8px}
.lista-scroll td .sub{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
/* uma linha por pedido: texto longo corta com reticências (inteiro no título do mouse e no detalhe) */
.lista-scroll td{vertical-align:middle;padding-top:8px;padding-bottom:8px}
.lista-scroll .corta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-scroll td.ttl .corta{max-width:270px}
.lista-scroll td.quem .corta{max-width:170px}
.lista-scroll td.forn .corta{max-width:150px}
.lista-scroll td.nowrap,.lista-scroll th.nowrap{white-space:nowrap}
.ord-aviso{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:8px;padding:6px 8px 6px 14px;margin-bottom:10px;font-size:13px}
.ord-aviso .btn{min-height:32px;padding:5px 12px}
.lista-scroll tfoot td{background:var(--surface-2);font-weight:600;position:sticky;bottom:0}
/* Tipo de compra: botões acima de "Solicitações por etapa" (30/09) */
.tipos{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:4px;margin:0 0 14px}
.tipo-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);border-radius:7px;padding:7px 14px;min-height:36px;cursor:pointer;font:inherit;font-weight:500}
.tipo-btn:hover{background:var(--surface)}
.tipo-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tipo-btn .c{font-size:12px;line-height:18px;min-width:20px;text-align:center;border-radius:999px;padding:0 6px;background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.tipo-btn[data-tipo="normal"] .c.tem{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.tipo-btn[data-tipo="urgente"] .c.tem{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.tipo-btn[data-tipo="mensal"] .c.tem{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}

/* ============ KPIs ============ */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--accent)}
.kpi .lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .sub{font-size:12.5px;color:var(--ink-3)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl .lbl,.kpi.hl .sub{color:inherit;opacity:.85}
.kpi .val.crit{color:var(--crit)}

/* ============ FUNNEL ============ */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:18px;font-weight:600}
.sec-h .hint{font-size:12.5px;color:var(--ink-3)}
/* ============ BOARD ============ */
.board-scroll{overflow-x:auto;padding-bottom:8px;margin-bottom:28px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;min-width:100%}
.col{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 4px}
.col-h h3{font-size:14px;font-weight:600}
.col-h .c{font-size:12px;color:var(--ink-3)}
.col-sub{font-size:12px;color:var(--ink-2);padding:0 4px 4px;border-bottom:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--accent)}
.card .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .id{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.card .ttl{font-weight:600;font-size:14px;line-height:1.3}
.card .meta{font-size:12px;color:var(--ink-2)}
.card .r3{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:6px}
.card .v{font-weight:600;font-variant-numeric:tabular-nums}
.card .who{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.empty-col{font-size:12.5px;color:var(--ink-3);text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:8px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ============ CLOSED TABLE ============ */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

.big-empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:36px 16px;text-align:center;color:var(--ink-2);margin-bottom:28px}
.big-empty h3{font-size:18px;margin-bottom:6px;color:var(--ink)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.m-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.m-head h2{font-size:22px;font-weight:700;margin-top:4px}
.m-head .sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;border-radius:6px;width:36px;height:36px;flex:none;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.m-body{padding:18px 22px;display:flex;flex-direction:column;gap:20px}
.holder{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14px}
.holder.crit{background:var(--crit-soft)}
.holder.warn{background:var(--warn-soft)}
.holder.ok{background:var(--ok-soft)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink-3)}
.step .ln{height:6px;border-radius:3px;background:var(--surface-2)}
.step.done .ln{background:var(--accent);opacity:.45}
.step.done{color:var(--ink-2)}
.step.cur .ln{background:var(--accent)}
.step.cur{color:var(--ink);font-weight:600}
.step.stop .ln{background:var(--crit)}
.step.stop{color:var(--crit);font-weight:600}
@media (max-width:600px){.steps{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:10px}}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
@media (max-width:700px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv .v{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.kv .v.big{font-family:var(--f-display);font-size:20px;font-weight:700}
.m-sec h3{font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:.02em}
.just{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;max-width:70ch}
.items{min-width:520px}
.budget{display:flex;flex-direction:column;gap:6px}
.bbar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.bbar i{display:block;height:100%}
.bleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.anexos{display:flex;flex-direction:column;gap:8px}
.anexo-item{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.anexo-cab{display:flex;align-items:center;gap:10px;padding:10px 12px;background:none;border:0;cursor:pointer;text-align:left;width:100%;color:inherit}
.anexo-cab:hover{background:var(--surface-2)}
.anexo-cab .nome{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.anexo-cab .meta{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.anexo-ver{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.anexo-ver img{max-width:100%;max-height:70vh;border-radius:6px;display:block;margin:0 auto;background:#fff}
.anexo-ver iframe{width:100%;height:min(70vh,560px);border:1px solid var(--line);border-radius:6px;background:#fff}
.tl li{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:8px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .b{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:4px;margin-left:3px;position:relative;z-index:1}
.tl li.now .b{background:var(--surface);border:3px solid var(--accent)}
.tl li.bad .b{background:var(--crit)}
.tl .t{font-weight:600;font-size:13.5px}
.tl .d{font-size:12.5px;color:var(--ink-2)}
.tl .n{font-size:12.5px;color:var(--ink-2);font-style:italic;margin-top:2px}
.m-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.m-foot .pos{font-size:12.5px;color:var(--ink-3)}
.m-foot .nav{display:flex;gap:8px}
@media (max-width:600px){.m-head,.m-body,.m-foot{padding-left:16px;padding-right:16px}.overlay{padding:12px 10px}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.kpi{transition:background .12s,border-color .12s}}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px;color:var(--ink-2)}
.live .dot{color:var(--ok)}
.live.err .dot{color:var(--crit)}
.live.load .dot{color:var(--warn)}
.live .btn{margin-left:auto;min-height:32px;padding:5px 12px}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--ink-2);margin-bottom:28px}
.state h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.state p{max-width:60ch;margin:0 auto 12px}
.muted{color:var(--ink-3)}
.m-head>div{min-width:0}
.m-head h2,.card .ttl,.card .meta,td,.just,.kv .v{overflow-wrap:anywhere}
.items td:nth-child(2){min-width:220px}
.items td.r,.items th.r{white-space:nowrap}
.card .ttl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.aviso-vazio{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
/* Quadro com tamanho fixo e rolagem própria (29/09): com muitos pedidos a página não
   cresce sem fim — rola só o quadro, e o nome de cada coluna fica parado no topo. */
.board-scroll{height:clamp(480px,calc(100vh - 200px),1200px);overflow:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);padding:10px;margin-bottom:28px;overscroll-behavior:contain}
.board{min-height:100%;align-items:stretch}
.col{min-height:100%}
.col-h,.col-sub{position:sticky;background:var(--surface-2);z-index:2}
.col-h{top:-10px;padding-top:12px;margin-top:-10px}
.col-sub{top:22px}
@media (max-width:600px){ .board-scroll{height:70vh} }

<script>
/* =====================================================================
   FONTE DE DADOS — banco de compras (Supabase), mesmo padrão das telas de aprovação:
   chave publicável + função painel_diretoria(token). Quem entra é a tabela painel_acesso.
   ===================================================================== */
const SUPABASE_URL = 'https://mbwaqnlmscxbacmxdopr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AR4D1JlHB-Z12--QbzwYWQ_URZzmVwl';
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
/* Vindo dos Indicadores com ?q=<nº do pedido>: abre o funil já buscando por ele, em todo o período. */
const BUSCA_INICIAL = (new URLSearchParams(location.search).get('q') || '').trim();
async function rpc(nome, corpo){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nome, {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(corpo)
  });
  if (!r.ok){ let msg = ''; try { msg = (await r.json()).message || ''; } catch(_){} throw { code:'http_' + r.status, message: msg || ('HTTP ' + r.status) }; }
  return r.json();
}

/* =====================================================================
   ETAPAS — espelham a lista "Compras (Kanban)" do ClickUp
   sla = prazo da etapa em dias (SUPOSIÇÃO, a validar)
   ===================================================================== */
const ETAPAS = [
  { id:'lid', nome:'Liderança imediata',   curto:'Liderança',  sla:2 },
  { id:'cot', nome:'Compras · cotação',    curto:'Cotação',    sla:5 },
  { id:'ger', nome:'Aprovação gerencial',  curto:'Gerencial',  sla:2 },
  { id:'fin', nome:'Aprovação financeiro', curto:'Financeiro', sla:2 },
  { id:'oc',  nome:'Ordem de compra',      curto:'OC',         sla:1 },
];
/* "Efetuar compra" e "Complete" saíram do quadro a pedido da diretoria: o que
   está em ordem de compra já saiu do fluxo de aprovação. Pedido que o banco
   marca como no GR ou concluído continua aparecendo em Ordem de compra — some
   da tela nenhum. */
/* Compra mensal (29/09): a gerência aprova a necessidade do mês ANTES da cotação.
   Com o filtro Tipo = Mensal o quadro mostra as colunas nessa ordem; o modal
   mostra a trilha pelo fluxo do próprio pedido. A regra dos dois fluxos mora no
   banco (passo_da_compra); aqui é só a ordem das colunas. */
const ETAPAS_MENSAL = ['lid','ger','cot','fin','oc'].map(id => ETAPAS.find(e => e.id === id));
const fluxoDe = s => s && s.tipoCompra === 'mensal' ? ETAPAS_MENSAL : ETAPAS;
const colunasDoQuadro = () => state.tipo === 'mensal' ? ETAPAS_MENSAL : ETAPAS;
const TIPOS_COMPRA = { normal:'Normal', programada:'Programada', urgente:'Urgente', mensal:'Mensal' };
const NOME_ETAPA_DECISAO = { lider:'liderança imediata', compras:'compras', gerencial:'aprovação gerencial', financeiro:'aprovação financeiro' };
const ETAPA_DB = { lider:'lid', cotacao:'cot', compras:'cot', gerencial:'ger', financeiro:'fin' };

/* =====================================================================
   NORMALIZAÇÃO — linha do banco → solicitação da tela
   ===================================================================== */
const D = v => v ? new Date(String(v).replace(' ', 'T').replace(/\+00$/, '+00:00')) : null;
const num = v => v === null || v === undefined || v === '' ? null : Number(v);

function etapaDaLinha(r){
  if (r.status === 'reprovado' || r.decisoes.some(d => d.resp === 'reprovado')) return 'rep';
  if (r.status === 'cancelado') return 'can';   /* caminho das telas (29/09): o solicitante cancelou */
  if (r.etapa_atual && ETAPA_DB[r.etapa_atual]) return ETAPA_DB[r.etapa_atual];
  const oc = r.ordens.filter(o => o.situacao !== 'cancelada').slice(-1)[0];
  if (oc) return 'oc';
  if (r.status === 'aprovado') return 'oc';
  if (r.status === 'em cotacao') return 'cot';
  return 'lid';
}
function valorDaLinha(r){
  const dec = r.decisoes.filter(d => num(d.valor) !== null).slice(-1)[0];
  if (dec) return { v:num(dec.valor), fonte:'valor aprovado' };
  const oc = r.ordens.filter(o => num(o.total) !== null).slice(-1)[0];
  if (oc) return { v:num(oc.total), fonte:'ordem de compra' };
  const cots = r.cotacoes.filter(c => num(c.total) !== null).map(c => num(c.total));
  if (cots.length) return { v:Math.min(...cots), fonte:'menor cotação' };
  if (num(r.valor_cotado) !== null) return { v:num(r.valor_cotado), fonte:'valor cotado' };   /* Mesa de cotação */
  const itens = r.itens.map(i => { const ps = [i.p1,i.p2,i.p3].map(num).filter(x => x !== null); return ps.length ? Math.min(...ps) * num(i.qtd) : null; });
  if (itens.length && itens.every(x => x !== null)) return { v:itens.reduce((a,b)=>a+b,0), fonte:'preços informados' };
  return { v:null, fonte:null };
}
function normalizar(r){
  r.itens = r.itens || []; r.decisoes = r.decisoes || []; r.cotacoes = r.cotacoes || []; r.ordens = r.ordens || []; r.movimentos = r.movimentos || [];
  const status = etapaDaLinha(r);
  const criada = D(r.aberto_em);
  // histórico
  const eventos = [{ data:criada, titulo:'Solicitação aberta', pessoa:r.facilitador }];
  r.decisoes.forEach(d => eventos.push({ data:D(d.em), titulo:(d.resp === 'reprovado' ? 'Reprovado em ' : 'Aprovado em ') + (NOME_ETAPA_DECISAO[d.etapa] || d.etapa), pessoa:d.por, nota:d.motivo, bad:d.resp === 'reprovado' }));
  r.cotacoes.forEach(c => {
    eventos.push({ data:D(c.enviada), titulo:'Cotação enviada a ' + c.forn, pessoa:null });
    if (c.respondida) eventos.push({ data:D(c.respondida), titulo:'Cotação respondida por ' + c.forn, pessoa:null });
  });
  /* caminho das telas: o que não vira decisão também aparece no histórico */
  r.movimentos.forEach(m => {
    const t = { cotacao_enviada:'Cotação enviada pelo comprador', devolvido:'Devolvido ao comprador em ' + (NOME_ETAPA_DECISAO[m.etapa] || m.etapa || ''),
                cancelado:'Cancelado pelo solicitante', edicao_salva:'Pedido editado pelo solicitante' }[m.acao];
    if (t) eventos.push({ data:D(m.em), titulo:t, pessoa:m.por, nota:m.motivo, rot:m.acao === 'cotacao_enviada' ? 'Observação' : 'Motivo', bad:m.acao === 'cancelado' });
  });
  r.ordens.forEach(o => {
    eventos.push({ data:D(o.criada), titulo:'Ordem de compra criada', pessoa:null });
    if (o.lancada) eventos.push({ data:D(o.lancada), titulo:'Ordem lançada no GR' + (o.numero_gr ? ' (nº ' + o.numero_gr + ')' : ''), pessoa:null });
  });
  eventos.sort((a,b) => a.data - b.data);
  const val = valorDaLinha(r);
  const primeiro = r.itens[0];
  const titulo = primeiro ? (primeiro.desc.length > 90 ? primeiro.desc.slice(0, 88) + '…' : primeiro.desc) + (r.itens.length > 1 ? ` + ${r.itens.length - 1} ${r.itens.length === 2 ? 'item' : 'itens'}` : '') : 'Sem itens';
  const familias = [...new Set(r.itens.map(i => i.fam || (i.fora ? 'Fora do catálogo' : null)).filter(Boolean))];
  const ultimaOC = r.ordens.slice(-1)[0];
  return {
    id: r.numero, titulo, status, raw:r,
    empresa: r.empresa || '—', cc: r.centro_custo ? `${r.centro_custo} · ${r.cc_nome || ''}` : '—', ccNome: r.cc_nome || r.centro_custo || '—',
    setor: r.setor, unidade: r.unidade, gerencia: r.gerencia,
    solicitante: r.solicitante_nome || r.facilitador || '—', facilitador: r.facilitador,
    comprador: r.comprador_nome, aprovador: r.aprovador_atual_nome,
    urgencia: (r.tipo_compra === 'urgente' || r.prioridade === 'urgente') ? 'Urgente' : 'Normal',
    tipoCompra: String(r.tipo_compra || '').toLowerCase(),
    tipoCompraNome: TIPOS_COMPRA[String(r.tipo_compra || '').toLowerCase()] || (r.tipo_compra || '—'),
    unidadeNegocio: r.cc_unidade || r.unidade || '—',
    familias, itens: r.itens, anexos: r.anexos || [],
    valor: val.v, valorFonte: val.fonte,
    fornecedor: ultimaOC?.forn || r.fornecedor_cotado || null,
    canal: r.canal || null,
    cotacoes: r.cotacoes, motivo: r.motivo, observacao: r.observacao,
    necessidade: r.data_necessidade ? new Date(r.data_necessidade + 'T12:00:00') : null,
    local: r.local_entrega, defForn: r.definicao_fornecedor, justForn: r.justificativa_fornecedor,
    motivoRep: status === 'can' ? ((r.movimentos.find(m => m.acao === 'cancelado') || {}).motivo || null)
                                : (r.decisoes.find(d => d.resp === 'reprovado') || {}).motivo || null,
    etapaRep: status === 'can' ? 'cancelado' : (r.decisoes.find(d => d.resp === 'reprovado') || {}).etapa || null,
    criada, eventos,
    /* o banco sabe quando o pedido entrou na etapa atual (caminho das telas); sem isso, o último evento */
    entradaEtapa: status !== 'rep' && status !== 'can' && r.entrou_na_etapa_em ? D(r.entrou_na_etapa_em)
                : status === 'can' && r.cancelado_em ? D(r.cancelado_em) : eventos[eventos.length - 1].data,
  };
}

/* =====================================================================
   ANEXOS — foto ou PDF que o solicitante mandou
   O bucket é privado: o arquivo só abre por link assinado, pedido na hora
   do clique e válido por 1 hora. Nada de link fixo circulando por aí.
   ===================================================================== */
async function linkDoAnexo(caminho){
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/sign/anexos/' + encodeURI(caminho), {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ expiresIn: 3600 })
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(!j || !j.signedURL) throw new Error('resposta sem link');
  return SUPABASE_URL + '/storage/v1' + j.signedURL;
}
const ehImagem = mime => String(mime || '').startsWith('image/');
function tamanhoLegivel(b){
  b = Number(b) || 0;
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return Math.round(b/1024) + ' KB';
  return (b/1024/1024).toFixed(1).replace('.', ',') + ' MB';
}
function anexosHTML(lista){
  if(!lista.length) return '<div class="muted">Nenhum arquivo anexado.</div>';
  return '<div class="anexos">' + lista.map((a,i) => `
    <div class="anexo-item">
      <button class="anexo-cab" type="button" data-anexo="${i}" aria-expanded="false">
        <span>${ehImagem(a.mime) ? '🖼️' : '📄'}</span>
        <span class="nome">${esc(a.nome)}</span>
        <span class="meta">${tamanhoLegivel(a.tamanho)} · ver</span>
      </button>
      <div class="anexo-ver" hidden></div>
    </div>`).join('') + '</div>';
}
function ligarAnexos(lista){
  document.querySelectorAll('#modal .anexo-cab').forEach(bt => bt.addEventListener('click', async () => {
    const a = lista[+bt.dataset.anexo];
    const caixa = bt.parentElement.querySelector('.anexo-ver');
    if(!caixa.hidden){ caixa.hidden = true; bt.setAttribute('aria-expanded','false'); bt.querySelector('.meta').textContent = tamanhoLegivel(a.tamanho) + ' · ver'; return; }
    caixa.hidden = false; bt.setAttribute('aria-expanded','true');
    bt.querySelector('.meta').textContent = tamanhoLegivel(a.tamanho) + ' · fechar';
    if(caixa.dataset.pronto) return;
    caixa.innerHTML = '<div class="muted">Abrindo o arquivo…</div>';
    try{
      const url = await linkDoAnexo(a.caminho);
      caixa.innerHTML = (ehImagem(a.mime)
        ? `<img src="${url}" alt="${esc(a.nome)}">`
        : `<iframe src="${url}" title="${esc(a.nome)}"></iframe>`) +
        `<a class="btn ghost" style="align-self:flex-start" href="${url}" target="_blank" rel="noopener">Abrir em nova aba</a>`;
      caixa.dataset.pronto = '1';
    }catch(e){
      caixa.innerHTML = '<div class="muted">Não consegui abrir este arquivo agora (' + esc(String(e.message).slice(0,40)) +
        '). Feche e clique de novo.</div>';
    }
  }));
}

/* =====================================================================
   REGRAS DERIVADAS
   ===================================================================== */
let SOLICITACOES = [];
let AGORA = new Date();
const etapa = id => ETAPAS.find(e => e.id === id);
const diasNaEtapa = s => (AGORA - s.entradaEtapa) / 864e5;
const fechada = s => s.status === 'rep' || s.status === 'can';
const aberta = s => !fechada(s);
function prazo(s){
  if (!aberta(s)) return null;
  const sla = etapa(s.status).sla, d = diasNaEtapa(s);
  if (d > sla) return { cls:'crit', txt:'Atrasada', d, sla };
  if (d > sla*.75) return { cls:'warn', txt:'Vence logo', d, sla };
  return { cls:'ok', txt:'No prazo', d, sla };
}
function comQuem(s){
  switch (s.status){
    case 'lid': return s.aprovador ? s.aprovador + ' (liderança imediata)' : 'Liderança imediata';
    case 'cot': return s.comprador ? 'Comprador ' + s.comprador : 'Compras';
    case 'ger': return s.aprovador ? s.aprovador + ' (aprovação gerencial)' : 'Aprovação gerencial';
    case 'fin': return s.aprovador ? s.aprovador + ' (financeiro)' : 'Financeiro';
    case 'oc':  return 'Lançamento da ordem no GR';
    default: return '—';
  }
}

/* =====================================================================
   FORMATOS
   ===================================================================== */
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => v === null || v === undefined ? '—' : BRL.format(v);
function brlC(v){ if (v >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi'; if (v >= 1e3) return 'R$ ' + (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil'; return BRL.format(v); }
const dt = d => d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const dth = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function dias(d){ if (d < 1/24) { const m = Math.max(1, Math.round(d*1440)); return m + ' min'; }
  if (d < 1) { const h = Math.round(d*24); return h + (h === 1 ? ' hora' : ' horas'); } const n = Math.floor(d); return n + (n === 1 ? ' dia' : ' dias'); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const chaveMes = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const nomeMes = k => MESES[+k.slice(5)-1] + '/' + k.slice(0,4);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* =====================================================================
   ESTADO + FILTROS
   ===================================================================== */
const state = { q:'', per:'all', emp:'', und:'', cc:'', cat:'', tipo:'', modalList:[], modalIdx:-1, carregou:false,
                vista:'quadro', ord:null };   // vista: 'quadro' | 'lista'; ord: { col, dir } na lista
/* A escolha Quadro/Lista fica guardada neste navegador (só conveniência). */
try { const v = localStorage.getItem('funil.vista'); if (v === 'lista' || v === 'quadro') state.vista = v; } catch (e) {}
const $ = id => document.getElementById(id);

function initFiltros(){
  $('f-q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $('f-per').addEventListener('change', e => { state.per = e.target.value; render(); });
  $('f-emp').addEventListener('change', e => { state.emp = e.target.value; render(); });
  $('f-cat').addEventListener('change', e => { state.cat = e.target.value; render(); });
  $('f-und').addEventListener('change', e => { state.und = e.target.value; render(); });
  $('f-cc').addEventListener('change', e => { state.cc = e.target.value; render(); });
  $('f-tipo').addEventListener('click', e => {
    const b = e.target.closest('[data-tipo]'); if (!b) return;
    state.tipo = state.tipo === b.dataset.tipo ? '' : b.dataset.tipo;   // "Todos os tipos", ou clicar no marcado, mostra todos
    render();
  });
  $('f-clear').addEventListener('click', limparFiltros);
  $('f-vista').addEventListener('click', e => {
    const b = e.target.closest('[data-vista]'); if (!b || b.dataset.vista === state.vista) return;
    state.vista = b.dataset.vista;
    try { localStorage.setItem('funil.vista', state.vista); } catch (err) {}
    render();
  });
  $('btn-refresh').addEventListener('click', () => carregar(true));
}
function opcoes(sel, valores, rotulo, todos){
  const atual = sel.value;
  sel.innerHTML = `<option value="${todos.v}">${todos.t}</option>` + valores.map(v => `<option value="${esc(v)}">${esc(rotulo(v))}</option>`).join('');
  if ([...sel.options].some(o => o.value === atual)) sel.value = atual;
}
function montarOpcoes(){
  const meses = [...new Set(SOLICITACOES.map(s => chaveMes(s.criada)))].sort().reverse();
  opcoes($('f-per'), meses, nomeMes, { v:'all', t:'Todo o período' });
  if (!state.carregou){ const atual = chaveMes(AGORA); if (meses.includes(atual)) $('f-per').value = atual; }
  state.per = $('f-per').value;
  opcoes($('f-emp'), [...new Set(SOLICITACOES.map(s => s.empresa))].sort(), x => x, { v:'', t:'Todas' });
  state.emp = $('f-emp').value;
  opcoes($('f-und'), [...new Set(SOLICITACOES.map(s => s.unidadeNegocio))].filter(x => x && x !== '—').sort(), x => x, { v:'', t:'Todas' });
  state.und = $('f-und').value;
  opcoes($('f-cc'), [...new Set(SOLICITACOES.map(s => s.ccNome))].filter(x => x && x !== '—').sort(), x => x, { v:'', t:'Todos' });
  state.cc = $('f-cc').value;
  opcoes($('f-cat'), [...new Set(SOLICITACOES.flatMap(s => s.familias))].sort(), x => x, { v:'', t:'Todas' });
  state.cat = $('f-cat').value;
}
function limparFiltros(){
  Object.assign(state, { q:'', per:'all', emp:'', und:'', cc:'', cat:'', tipo:'' });
  $('f-q').value=''; $('f-per').value='all'; $('f-emp').value=''; $('f-und').value='';
  $('f-cc').value=''; $('f-cat').value='';
  render(); toast('Filtros limpos');
}
/* Botões de tipo: marca o escolhido e mostra quantos pedidos no quadro há de cada
   tipo com os outros filtros aplicados (reprovadas e canceladas não contam). */
function pintarTipos(){
  const semTipo = state.tipo; state.tipo = '';
  const base = filtradas().filter(s => s.status !== 'rep' && s.status !== 'can');
  state.tipo = semTipo;
  document.querySelectorAll('#f-tipo [data-tipo]').forEach(b => {
    const t = b.dataset.tipo;
    b.setAttribute('aria-pressed', String(state.tipo === t));
    b.title = !t ? 'Mostrar todos os tipos de compra' : state.tipo === t ? 'Clique de novo para ver todos os tipos' : 'Mostrar só compra ' + b.textContent.trim().split(' ')[0].toLowerCase();
    const c = b.querySelector('[data-conta]');
    if (c){ const n = base.filter(s => s.tipoCompra === t).length; c.textContent = n; c.classList.toggle('tem', n > 0); }
  });
}
function filtradas(){
  return SOLICITACOES.filter(s => {
    if (state.per !== 'all' && chaveMes(s.criada) !== state.per) return false;
    if (state.emp && s.empresa !== state.emp) return false;
    if (state.cat && !s.familias.includes(state.cat)) return false;
    if (state.und && s.unidadeNegocio !== state.und) return false;
    if (state.cc && s.ccNome !== state.cc) return false;
    if (state.tipo && s.tipoCompra !== state.tipo) return false;
    if (state.q){
      const hay = [s.id, s.titulo, s.solicitante, s.facilitador, s.comprador, s.cc, s.empresa, s.motivo, s.fornecedor, ...s.itens.map(i => i.desc + ' ' + (i.cod || ''))].join(' ').toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
}

/* =====================================================================
   CARREGAMENTO
   ===================================================================== */
function estadoLive(tipo, html){ $('live').className = 'live ' + tipo; $('live-txt').innerHTML = html; }
const MSG_ERRO = {
  sem_token:  'Este endereço precisa do seu link de acesso. Abra o link que você recebeu.',
  sem_acesso: 'Este link não dá acesso ao painel. Peça um link novo para quem administra as compras.',
  rede:       'Não foi possível falar com o banco agora. Verifique a internet e tente de novo.',
  http_404:   'A função do painel ainda não existe no banco (painel_diretoria).',
  formato:    'A resposta do banco veio em formato inesperado.',
};
let carregando = false;
async function carregar(manual){
  if (carregando) return;
  if (!TOKEN){ mostrarErroGeral('sem_token'); return; }
  carregando = true; $('btn-refresh').disabled = true;
  estadoLive('load', manual ? 'Atualizando…' : 'Carregando solicitações do banco de compras…');
  try {
    let res;
    try { res = await rpc('painel_diretoria', { p_token: TOKEN }); }
    catch (e) { if (!e || !e.code) throw { code:'rede', message:String(e && e.message || e) }; throw e; }
    if (!res || res.ok === false) throw { code: (res && res.erro) || 'formato', message: res && res.mensagem };
    if (!Array.isArray(res.solicitacoes)) throw { code:'formato' };
    AGORA = new Date();
    SOLICITACOES = res.solicitacoes.map(normalizar);
    montarOpcoes();
    if (!state.carregou && BUSCA_INICIAL){
      $('f-q').value = BUSCA_INICIAL; state.q = BUSCA_INICIAL.toLowerCase();
      $('f-per').value = 'all'; state.per = 'all';
    }
    state.carregou = true;
    estadoLive('', `${res.quem ? esc(res.quem) + ' · ' : ''}${SOLICITACOES.length} ${SOLICITACOES.length === 1 ? 'solicitação' : 'solicitações'} · atualizado às ${AGORA.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`);
    render();
    if (manual) toast('Dados atualizados');
  } catch (e) {
    const code = (e && e.code) || 'rede';
    if (state.carregou && code !== 'sem_acesso'){
      estadoLive('err', `Não foi possível atualizar agora. Mostrando os dados de ${AGORA.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`);
    } else { SOLICITACOES = []; state.carregou = false; mostrarErroGeral(code, e); }
  } finally { carregando = false; $('btn-refresh').disabled = false; }
}
function mostrarErroGeral(code, e){
  const msg = MSG_ERRO[code] || ('Erro ao ler o banco: ' + esc(e?.message || code));
  estadoLive('err', code === 'sem_acesso' || code === 'sem_token' ? 'Sem acesso.' : 'Sem conexão com o banco de compras.');
  $('board-area').innerHTML = `<div class="state"><h3>Não consegui abrir o painel</h3><p>${msg}</p>${code === 'sem_token' || code === 'sem_acesso' ? '' : '<button class="btn primary" type="button" id="err-retry">Tentar de novo</button>'}</div>`;
  $('err-retry')?.addEventListener('click', () => carregar(true));
  $('closed-area').innerHTML = ''; $('closed-hint').textContent = '';
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  if (!state.carregou) return;
  const base = filtradas();
  renderQuadro(base);
  renderReprovadas(base);
}
function ordenar(lst){
  const rank = { crit:0, warn:1, ok:2 };
  return lst.slice().sort((a,b) => {
    const pa = prazo(a), pb = prazo(b);
    if (pa && pb && rank[pa.cls] !== rank[pb.cls]) return rank[pa.cls] - rank[pb.cls];
    return diasNaEtapa(b) - diasNaEtapa(a);
  });
}
function somaValor(lst){
  const com = lst.filter(s => s.valor !== null);
  if (!lst.length) return 'nenhuma';
  if (!com.length) return 'sem valor ainda';
  return brlC(com.reduce((t,s) => t + s.valor, 0)) + (com.length < lst.length ? ` · ${lst.length - com.length} sem valor` : '');
}
function cardHTML(s){
  const p = prazo(s);
  const urg = (s.urgencia === 'Urgente' ? '<span class="pill warn">Urgente</span>' : '') +
              (s.tipoCompra === 'mensal' && state.tipo !== 'mensal' ? ' <span class="pill neutral">Mensal</span>' : '');
  const tempo = p ? `<span class="pill ${p.cls}" title="Há ${dias(p.d)} nesta etapa · prazo ${p.sla} dias"><span class="dot"></span>${dias(p.d)}</span>`
                  : '';
  return `<button class="card" type="button" data-id="${esc(s.id)}" aria-label="Abrir ${esc(s.id)}">
    <span class="r1"><span class="id">${esc(s.id)}</span>${urg}</span>
    <span class="ttl">${esc(s.titulo)}</span>
    <span class="meta">${esc(s.ccNome)} · ${esc(s.empresa)}</span>
    <span class="r3"><span class="v">${s.valor !== null ? brl(s.valor) : '<span class="muted" style="font-weight:500">Sem valor ainda</span>'}</span>${tempo}</span>
    ${aberta(s) ? `<span class="who">Com ${esc(comQuem(s))}</span>` : ''}
  </button>`;
}
function renderQuadro(base){
  const COLS = colunasDoQuadro();
  const mensal = state.tipo === 'mensal';
  $('quadro-titulo').textContent = 'Solicitações por etapa' + (mensal ? ' · compra mensal' : '');
  pintarTipos();
  const peca = state.vista === 'lista' ? 'numa linha' : 'num card';
  $('quadro-dica').textContent = mensal ? 'Fluxo da compra mensal: a gerência aprova antes da cotação · clique ' + peca + ' para ver o detalhe'
                                        : 'Clique ' + peca + ' para ver o detalhe';
  document.querySelectorAll('#f-vista [data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === state.vista)));
  const visiveis = COLS.flatMap(e => ordenar(base.filter(s => s.status === e.id)));
  if (!SOLICITACOES.length){
    $('board-area').innerHTML = `<div class="state"><h3>Nenhuma solicitação no banco ainda</h3><p>Quando alguém abrir um pedido pelo /compras, ele aparece aqui na coluna Liderança imediata.</p></div>`;
    return;
  }
  /* Sem resultado: o quadro aparece do mesmo jeito, com as colunas vazias (29/09 —
     o funil da mensal precisa estar à vista antes do primeiro pedido mensal). */
  let aviso = '';
  if (!visiveis.length && !base.some(fechada)){
    const txt = mensal && !SOLICITACOES.some(s => s.tipoCompra === 'mensal')
      ? '<strong>Ainda não há compra mensal.</strong> O quadro já está pronto: o primeiro pedido mensal aparece aqui, na coluna Liderança imediata.'
      : '<strong>Nenhuma solicitação com esses filtros.</strong> Tente outro período, outra empresa ou limpe os filtros.';
    aviso = `<div class="aviso-vazio" role="status"><span>${txt}</span><button class="btn ghost" type="button" id="empty-clear">Limpar filtros</button></div>`;
  }
  if (state.vista === 'lista'){ renderLista(base, COLS, aviso); return; }
  $('board-area').innerHTML = aviso + `<div class="board-scroll"><div class="board">` + COLS.map(e => {
    const lst = ordenar(base.filter(s => s.status === e.id));
    return `<section class="col" aria-label="${e.nome}">
      <div class="col-h"><h3>${e.nome}</h3><span class="c num">${lst.length}</span></div>
      <div class="col-sub num">${somaValor(lst)}${e.sla ? ' · prazo ' + e.sla + (e.sla === 1 ? ' dia' : ' dias') : ''}</div>
      ${lst.length ? lst.map(cardHTML).join('') : '<div class="empty-col">Nenhuma solicitação nesta etapa</div>'}
    </section>`;
  }).join('') + `</div></div>`;
  $('board-area').querySelectorAll('.card').forEach(c => c.addEventListener('click', () => abrirModal(c.dataset.id, visiveis)));
  if ($('empty-clear')) $('empty-clear').addEventListener('click', limparFiltros);
}
/* =====================================================================
   LISTA (30/09) — o mesmo funil em linhas, para ver mais de uma vez.
   Sem ordenação escolhida: agrupada por etapa, na ordem do fluxo, com o
   subtotal de cada etapa (como as colunas do quadro). Clicando no título de
   uma coluna: ordena por ela, sem grupos. Clicar de novo inverte; a terceira
   vez volta ao agrupamento.
   ===================================================================== */
const COLS_LISTA = [
  { id:'num',   nome:'Nº',            chave:s => s.id },
  { id:'sol',   nome:'Solicitação',   chave:s => s.titulo.toLowerCase() },
  { id:'tipo',  nome:'Tipo',          chave:s => s.tipoCompraNome },
  { id:'etapa', nome:'Etapa',         chave:s => ETAPAS.findIndex(e => e.id === s.status) },
  { id:'quem',  nome:'Com quem',      chave:s => quemNaLista(s).toLowerCase() },
  { id:'na',    nome:'Na etapa',      chave:s => diasNaEtapa(s) },
  { id:'valor', nome:'Valor',         chave:s => s.valor === null ? -1 : s.valor, r:true },
  { id:'forn',  nome:'Fornecedor',    chave:s => (s.fornecedor || '').toLowerCase() },
  { id:'prec',  nome:'Precisa até',   chave:s => s.necessidade ? +s.necessidade : Infinity },
  { id:'aber',  nome:'Aberta em',     chave:s => +s.criada },
];
/* Na lista a etapa já tem coluna própria: "com quem" mostra só a pessoa. */
function quemNaLista(s){
  switch (s.status){
    case 'lid': case 'ger': return s.aprovador || '—';
    case 'cot': return s.comprador || 'Compras';
    case 'fin': return s.aprovador || 'Financeiro';
    case 'oc':  return 'Lançamento no GR';
    default: return '—';
  }
}
function linhaDaLista(s){
  const p = prazo(s);
  const tipo = s.tipoCompra === 'urgente' ? '<span class="pill warn">Urgente</span>'
             : s.tipoCompra === 'mensal' ? '<span class="pill neutral">Mensal</span>' : esc(s.tipoCompraNome);
  const et = etapa(s.status);
  return `<tr data-id="${esc(s.id)}" tabindex="0">
    <td class="mono nowrap">${esc(s.id)}</td>
    <td class="ttl"><span class="corta" title="${esc(s.titulo)}">${esc(s.titulo)}</span><span class="sub corta" title="Pedido de ${esc(s.solicitante)} · ${esc(s.ccNome)} · ${esc(s.empresa)}">${esc(s.solicitante)} · ${esc(s.ccNome)}</span></td>
    <td class="nowrap">${tipo}</td>
    <td class="nowrap">${et ? esc(et.curto) : '—'}</td>
    <td class="quem"><span class="corta" title="${esc(comQuem(s))}">${esc(quemNaLista(s))}</span></td>
    <td class="nowrap">${p ? `<span class="pill ${p.cls}" title="Prazo da etapa: ${p.sla} ${p.sla === 1 ? 'dia' : 'dias'}"><span class="dot"></span>${dias(p.d)}</span>` : '—'}</td>
    <td class="r num nowrap">${s.valor !== null ? brl(s.valor) : '<span class="muted">sem valor</span>'}</td>
    <td class="forn"><span class="corta" title="${esc(s.fornecedor || '')}">${esc(s.fornecedor || '—')}</span></td>
    <td class="num nowrap">${s.necessidade ? dt(s.necessidade) : '—'}</td>
    <td class="num nowrap">${dt(s.criada)}</td>
  </tr>`;
}
function renderLista(base, COLS, aviso){
  const abertos = base.filter(s => COLS.some(e => e.id === s.status));
  let corpo, ordem;
  if (state.ord){
    const c = COLS_LISTA.find(x => x.id === state.ord.col), sinal = state.ord.dir === 'asc' ? 1 : -1;
    ordem = abertos.slice().sort((a,b) => { const va = c.chave(a), vb = c.chave(b); return (va < vb ? -1 : va > vb ? 1 : 0) * sinal; });
    corpo = ordem.map(linhaDaLista).join('');
  } else {
    ordem = [];
    corpo = COLS.map(e => {
      const lst = ordenar(abertos.filter(s => s.status === e.id)); ordem.push(...lst);
      const cab = `<tr class="grupo"><td colspan="${COLS_LISTA.length}">${esc(e.nome)} · ${lst.length}<span class="g-sub num">${somaValor(lst)}${e.sla ? ' · prazo ' + e.sla + (e.sla === 1 ? ' dia' : ' dias') : ''}</span></td></tr>`;
      return cab + (lst.length ? lst.map(linhaDaLista).join('') : '');
    }).join('');
  }
  const th = c => {
    const sort = state.ord && state.ord.col === c.id ? (state.ord.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    return `<th class="${c.r ? 'r ' : ''}nowrap" aria-sort="${sort}"><button type="button" data-ord="${c.id}" title="Ordenar por ${c.nome.toLowerCase()}">${c.nome}</button></th>`;
  };
  const comValor = abertos.filter(s => s.valor !== null);
  /* Ordenado por uma coluna: aviso com o caminho de volta à lista por etapa (30/09 —
     o terceiro clique no título também volta, mas ninguém adivinha isso). */
  let avisoOrd = '';
  if (state.ord){
    const c = COLS_LISTA.find(x => x.id === state.ord.col);
    avisoOrd = `<div class="ord-aviso" role="status"><span>Ordenado por <strong>${esc(c.nome)}</strong> ${state.ord.dir === 'asc' ? '↑ crescente' : '↓ decrescente'} · sem separar por etapa</span>
      <button class="btn" type="button" id="ord-volta">↺ Voltar à lista por etapa</button></div>`;
  }
  $('board-area').innerHTML = aviso + avisoOrd + `<div class="tbl-wrap lista-scroll"><table class="lista">
    <thead><tr>${COLS_LISTA.map(th).join('')}</tr></thead>
    <tbody>${corpo}</tbody>
    <tfoot><tr><td colspan="6">${abertos.length} ${abertos.length === 1 ? 'solicitação em andamento' : 'solicitações em andamento'}</td>
      <td class="r num nowrap">${comValor.length ? brl(comValor.reduce((t,s) => t + s.valor, 0)) : '—'}</td>
      <td colspan="3" class="muted" style="font-weight:500">${abertos.length - comValor.length ? (abertos.length - comValor.length) + ' sem valor ainda' : ''}</td></tr></tfoot>
  </table></div>`;
  $('board-area').querySelectorAll('tbody tr[data-id]').forEach(tr => {
    const open = () => abrirModal(tr.dataset.id, ordem);
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
  $('board-area').querySelectorAll('[data-ord]').forEach(b => b.addEventListener('click', () => {
    const col = b.dataset.ord, o = state.ord;
    state.ord = !o || o.col !== col ? { col, dir:'asc' } : o.dir === 'asc' ? { col, dir:'desc' } : null;   // 3º clique: volta aos grupos
    render();
    const nb = document.querySelector(`[data-ord="${col}"]`); if (nb) nb.focus();
  }));
  if ($('empty-clear')) $('empty-clear').addEventListener('click', limparFiltros);
  if ($('ord-volta')) $('ord-volta').addEventListener('click', () => { state.ord = null; render(); const t = document.querySelector('.lista-scroll'); if (t) t.scrollTop = 0; });
}
function renderReprovadas(base){
  const lst = base.filter(fechada).sort((a,b) => b.entradaEtapa - a.entradaEtapa);
  const nc = lst.filter(s => s.status === 'can').length, nr = lst.length - nc;
  $('closed-hint').textContent = lst.length ? [nr ? `${nr} ${nr === 1 ? 'reprovada' : 'reprovadas'}` : '', nc ? `${nc} ${nc === 1 ? 'cancelada' : 'canceladas'}` : ''].filter(Boolean).join(' · ') + ' no filtro atual' : '';
  if (!lst.length){ $('closed-area').innerHTML = '<div class="state" style="padding:18px">Nenhuma solicitação reprovada ou cancelada com esses filtros.</div>'; return; }
  $('closed-area').innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Nº</th><th>Solicitação</th><th>Encerrada em</th><th>Motivo</th><th>Data</th><th class="r">Valor</th></tr></thead>
    <tbody>${lst.map(s => `<tr data-id="${esc(s.id)}" tabindex="0">
      <td class="mono">${esc(s.id)}</td><td>${esc(s.titulo)}<br><span class="muted" style="font-size:12px">${esc(s.ccNome)}</span></td>
      <td>${s.status === 'can' ? 'Cancelada pelo solicitante' : esc(cap(NOME_ETAPA_DECISAO[s.etapaRep] || s.etapaRep || '—'))}</td>
      <td>${esc(s.motivoRep || '—')}</td><td>${dt(s.entradaEtapa)}</td><td class="r num">${brl(s.valor)}</td></tr>`).join('')}</tbody></table></div>`;
  $('closed-area').querySelectorAll('tbody tr').forEach(tr => {
    const open = () => abrirModal(tr.dataset.id, lst);
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
}

/* =====================================================================
   MODAL DE DETALHE
   ===================================================================== */
let ultimoFoco = null;
function abrirModal(id, lista){
  ultimoFoco = document.activeElement;
  state.modalList = lista.map(s => s.id);
  state.modalIdx = state.modalList.indexOf(id);
  pintarModal();
  $('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  $('m-close').focus();
}
function fecharModal(){
  $('overlay').hidden = true;
  document.body.style.overflow = '';
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
}
function navegar(delta){
  const n = state.modalIdx + delta;
  if (n < 0 || n >= state.modalList.length) return;
  state.modalIdx = n; pintarModal(); $('m-close').focus();
}
const kv = (k, v, extra='') => `<div class="kv"><div class="k">${k}</div><div class="v ${extra}">${v}</div></div>`;
function pintarModal(){
  const s = SOLICITACOES.find(x => x.id === state.modalList[state.modalIdx]);
  if (!s){ fecharModal(); return; }
  const p = prazo(s);
  const rep = s.status === 'rep', can = s.status === 'can';
  const FLUXO = fluxoDe(s);
  const idxAtual = rep ? FLUXO.findIndex(e => e.id === (ETAPA_DB[s.etapaRep] || 'lid')) : can ? -1 : FLUXO.findIndex(e => e.id === s.status);

  let holder;
  if (can) holder = `<div class="holder crit"><strong>Cancelada</strong><span>pelo solicitante · ${dt(s.entradaEtapa)}</span>${s.motivoRep ? `<span>Motivo: ${esc(s.motivoRep)}</span>` : ''}</div>`;
  else if (rep) holder = `<div class="holder crit"><strong>Reprovada</strong><span>em ${esc(NOME_ETAPA_DECISAO[s.etapaRep] || s.etapaRep || '—')} · ${dt(s.entradaEtapa)}</span>${s.motivoRep ? `<span>Motivo: ${esc(s.motivoRep)}</span>` : ''}</div>`;
  else holder = `<div class="holder ${p.cls}"><strong>${etapa(s.status).nome}</strong><span>com ${esc(comQuem(s))}</span><span>há <strong>${dias(p.d)}</strong> (prazo da etapa: ${p.sla} ${p.sla === 1 ? 'dia' : 'dias'})</span><span class="pill ${p.cls}"><span class="dot"></span>${p.txt}</span></div>`;

  const steps = FLUXO.map((e,i) => {
    let cls = '';
    if (i < idxAtual) cls = 'done';
    if (i === idxAtual && !rep) cls = 'cur';
    if (i === idxAtual && rep) cls = 'stop';
    return `<div class="step ${cls}"><span class="ln"></span>${e.curto}</div>`;
  }).join('');

  const atrasoNec = s.necessidade && aberta(s) && s.necessidade < AGORA;
  const respondidas = s.cotacoes.filter(c => c.status === 'respondida').length;
  const itensRows = s.itens.map(i => {
    const ps = [i.p1,i.p2,i.p3].map(num).filter(x => x !== null);
    const unit = ps.length ? Math.min(...ps) : null;
    return `<tr><td class="mono">${esc(i.cod || '—')}</td><td>${esc(i.desc)}${i.fora ? ' <span class="pill neutral">fora do catálogo</span>' : ''}</td><td>${esc(i.fam || '—')}</td><td class="r num">${num(i.qtd).toLocaleString('pt-BR')} ${esc(i.un || '')}</td><td class="r num">${brl(unit)}</td><td class="r num">${unit !== null ? brl(unit*num(i.qtd)) : '—'}</td></tr>`;
  }).join('');

  const tl = s.eventos.map((e,i) => {
    const last = i === s.eventos.length - 1;
    const cls = e.bad ? 'bad' : (last && aberta(s) ? 'now' : '');
    return `<li class="${cls}"><span class="b"></span><div><div class="t">${esc(e.titulo)}</div><div class="d">${dth(e.data)}${e.pessoa ? ' · ' + esc(e.pessoa) : ''}</div>${e.nota ? `<div class="n">${e.rot || 'Motivo'}: ${esc(e.nota)}</div>` : ''}</div></li>`;
  }).join('') + (aberta(s) ? `<li class="now"><span class="b" style="background:var(--surface-2);border:2px dashed var(--line)"></span><div><div class="t muted">Agora: ${etapa(s.status).nome}</div><div class="d">aguardando ${esc(comQuem(s))}</div></div></li>` : '');

  $('modal').innerHTML = `
    <div class="m-head">
      <div>
        <div class="eyebrow"><span class="mono">${esc(s.id)}</span> · aberta em ${dt(s.criada)}</div>
        <h2 id="m-title">${esc(s.titulo)}</h2>
        <div class="sub">${esc(s.empresa)} · ${esc(s.cc)}${s.urgencia === 'Urgente' ? ' · <span class="pill warn">Urgente</span>' : ''}</div>
      </div>
      <button class="x" id="m-close" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="m-body">
      ${holder}
      <div class="steps" aria-label="Etapas">${steps}</div>

      <div class="grid2">
        ${kv('Valor', s.valor !== null ? brl(s.valor) : '—', 'big num')}
        ${kv('Origem do valor', s.valorFonte ? cap(s.valorFonte) : '<span class="muted">Ainda sem preço — sai da cotação</span>')}
        ${kv('Precisa até', dt(s.necessidade) + (atrasoNec ? ' <span class="pill crit">passou da data</span>' : ''))}
        ${kv('Solicitante', esc(s.solicitante))}
        ${kv('Comprador', esc(s.comprador || '—'))}
        ${kv('Setor / unidade', esc([s.setor, s.unidade].filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(' · ') || '—'))}
        ${kv('Fornecedor', s.defForn === 'unico' ? 'Fornecedor único' : s.defForn === 'cotacao' ? 'Por cotação' : esc(s.defForn || '—'))}
        ${kv('Cotações', !s.cotacoes.length && s.canal === 'telas' ? (s.raw.cotacao_em ? 'Mesa de cotação' + (s.fornecedor ? ' · ' + esc(s.fornecedor) : '') : '<span class="muted">ainda na cotação</span>') : s.cotacoes.length ? `${s.cotacoes.length} enviada${s.cotacoes.length > 1 ? 's' : ''} · ${respondidas} respondida${respondidas === 1 ? '' : 's'}` : '<span class="muted">nenhuma enviada ainda</span>')}
        ${kv('Local de entrega', esc(s.local || '—'))}
      </div>

      ${s.justForn ? `<div class="m-sec"><h3>Justificativa do fornecedor</h3><div class="just">${esc(s.justForn)}</div></div>` : ''}
      <div class="m-sec"><h3>Motivo</h3><div class="just">${esc(s.motivo || '—')}${s.observacao ? '<br><span class="muted">Obs.: ' + esc(s.observacao) + '</span>' : ''}</div></div>

      <div class="m-sec"><h3>Itens</h3>
        <div class="tbl-wrap"><table class="items"><thead><tr><th>Código</th><th>Item</th><th>Família</th><th class="r">Qtd.</th><th class="r">Unitário</th><th class="r">Total</th></tr></thead>
        <tbody>${itensRows || '<tr><td colspan="6" class="muted">Sem itens</td></tr>'}</tbody></table></div>
      </div>

      <div class="m-sec"><h3>Anexos do solicitante${s.anexos.length ? ' <span class="pill neutral">' + s.anexos.length + '</span>' : ''}</h3>${anexosHTML(s.anexos)}</div>

      <div class="m-sec"><h3>Histórico</h3><ol class="tl">${tl}</ol></div>
    </div>
    <div class="m-foot">
      <span class="pos">${state.modalIdx + 1} de ${state.modalList.length} na lista atual · use ← →</span>
      <div class="nav">
        <button class="btn" type="button" id="m-prev" ${state.modalIdx <= 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn" type="button" id="m-next" ${state.modalIdx >= state.modalList.length - 1 ? 'disabled' : ''}>Próxima →</button>
        <button class="btn primary" type="button" id="m-ok">Fechar</button>
      </div>
    </div>`;
  ligarAnexos(s.anexos);
  $('m-close').addEventListener('click', fecharModal);
  $('m-ok').addEventListener('click', fecharModal);
  $('m-prev').addEventListener('click', () => navegar(-1));
  $('m-next').addEventListener('click', () => navegar(1));
}
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) fecharModal(); });
document.addEventListener('keydown', e => {
  if ($('overlay').hidden) return;
  if (e.key === 'Escape') fecharModal();
  if (e.key === 'ArrowLeft') navegar(-1);
  if (e.key === 'ArrowRight') navegar(1);
  if (e.key === 'Tab'){
    const f = [...$('modal').querySelectorAll('button:not([disabled])')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

/* =====================================================================
   INÍCIO
   ===================================================================== */
initFiltros();
$('lnk-indicadores').href = 'indicadores.html?t=' + encodeURIComponent(TOKEN);
$('board-area').innerHTML = '<div class="state"><h3>Carregando…</h3><p>Lendo as solicitações no banco de compras.</p></div>';
carregar(false);
// atualiza sozinho a cada 5 min enquanto a página estiver visível
setInterval(() => { if (!document.hidden && state.carregou) carregar(false); }, 5*60*1000);
</script>
</body></html>

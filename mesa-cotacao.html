<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Mesa de Cotação · Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS · identidade Grupo Leh ============
   Paleta oficial (Pantone → hex):
   2965 C #00263d · 2955 C #003865 · 330 C #00524c · 341 C #007A53
   321 C #008c95 · 468 C #ddcba3 · Warm Gray 1 C #d7d2cc
   Tipografia da marca: Goldplay; Figtree é a substituta quando ela não
   estiver instalada. Vermelho de erro não está na paleta: existe só para
   sinalizar bloqueio, e é usado apenas nisso.
   ====================================================== */
:root{
  --marca:#00263d; --marca-2:#003865;
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEE; --line:#D7DCDE; --line-2:#B6C1C6;
  --ink:#00263d; --ink-2:#3D586B; --ink-3:#6C818F;
  --accent:#00727A; --accent-soft:#DCEFF1; --accent-ink:#FFFFFF;
  --ok:#007A53; --ok-soft:#DCEFE6; --warn:#7A5A18; --warn-soft:#F3E9D5; --crit:#A82A1F; --crit-soft:#F8E2DF;
  --shadow:0 1px 2px rgba(0,38,61,.07),0 4px 14px rgba(0,38,61,.07);
  --overlay:rgba(0,38,61,.55);
  --f-display:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Goldplay","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --marca:#08192a; --marca-2:#0d2a45;
    --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D; --line-2:#3A607A;
    --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
    --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
    --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    --overlay:rgba(0,10,18,.65);
  }
}
:root[data-theme="dark"]{
  --marca:#08192a; --marca-2:#0d2a45;
  --bg:#08192a; --surface:#0E2438; --surface-2:#143047; --line:#23455D; --line-2:#3A607A;
  --ink:#E7EEF2; --ink-2:#AFC2CF; --ink-3:#8296A4;
  --accent:#4FC0C8; --accent-soft:#0C3138; --accent-ink:#052028;
  --ok:#4FB98A; --ok-soft:#0D2E24; --warn:#DDCBA3; --warn-soft:#332B1A; --crit:#F0938A; --crit-soft:#3B1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  --overlay:rgba(0,10,18,.65);
}


/* ============ BARRA DA MARCA ============ */
.brandbar{background:var(--marca);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandbar img{height:26px;width:auto;display:block}
.brandbar .sep{width:1px;height:20px;background:rgba(255,255,255,.28)}
.brandbar .txt{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.88)}
@media (max-width:480px){.brandbar{padding:10px 16px;gap:10px}.brandbar img{height:22px}}

/* ============ BASE ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1300px;margin:0 auto;padding:20px 16px 120px}
@media (max-width:600px){.wrap{padding:14px 16px 150px}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.sample{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:16px}
.sample b{color:var(--warn)}

/* ============ CONTROLES ============ */
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);font-weight:500}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.big{min-height:44px;padding:10px 18px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ============ TOPO ============ */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.who{display:flex;flex-direction:column;gap:3px}
.who label{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ============ FILA ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .c{font-size:12px;background:var(--surface-2);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.tab.alert .c{background:var(--crit-soft);color:var(--crit)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input{min-width:260px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px;flex-wrap:wrap}
.sgb{border:0;background:transparent;color:var(--ink-2);border-radius:6px;padding:7px 12px;min-height:36px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.sgb:hover:not(:disabled){background:var(--surface)}
.sgb[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sgb:disabled,.sgb.off{color:var(--ink-3)}
.sgb.off .soon{color:var(--ink-3)}
.sgb .c{font-size:12px;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--ink-3)}
.sgb[aria-pressed="true"] .c{background:var(--accent-soft);color:var(--accent)}
.sgb .soon{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:600px){.tools input{min-width:0;flex:1}}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
.fila{min-width:860px}
.fila thead th{text-align:center}
.fila td.tipo{white-space:nowrap}
.fila tbody tr{cursor:pointer}
.fila tbody tr:hover{background:var(--surface-2)}
.fila tbody tr:last-child td{border-bottom:0}
.fila .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.fila .s{font-size:12px;color:var(--ink-2)}
.fila .pill{max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
td.r,th.r{text-align:right}
.state{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:32px 18px;text-align:center;color:var(--ink-2)}
.state h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.state p{max-width:60ch;margin:0 auto 12px}
.banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.banner.ok{background:var(--ok-soft)}
.banner.warn{background:var(--warn-soft)}
.banner.crit{background:var(--crit-soft)}
.banner.info{background:var(--accent-soft)}
.banner .grow{flex:1 1 240px}
.just-inline{display:inline-block;margin-top:4px;font-size:13px;color:var(--ink-2)}
.skel{height:44px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;margin:8px 12px}
@media (prefers-reduced-motion:no-preference){.skel{animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}}

/* ============ MAPA ============ */
.back{margin-bottom:10px}
.m-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;align-items:flex-start;margin-bottom:14px}
.m-top h1{font-size:24px;max-width:70ch;overflow-wrap:anywhere}
.m-top .sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.fact .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fact .v{font-size:14px;margin-top:1px}
.fact.wide{flex:1 1 280px}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ftab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:150px;text-align:left}
.ftab .n{font-family:var(--f-display);font-weight:700;font-size:15px}
.ftab .st{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.ftab .st.exemplo{color:var(--ink-3);font-size:11.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ftab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);background:var(--surface)}
.ftab.done .st{color:var(--ok)}
.ftab.bad{border-color:var(--crit)}
.map-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}
.map-h h2{font-size:18px;font-weight:600}
.fam-nota{font-family:var(--f-body);font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}

/* ---------- planilha de cotação ---------- */
.map-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;margin-bottom:18px;position:relative}
.map col.c-item{width:280px}
.map col.c-qtd{width:86px}
.map{min-width:1040px;border-collapse:separate;border-spacing:0;width:100%;font-size:13px;line-height:1.35}
.map th,.map td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;height:34px;vertical-align:middle;text-align:left;font-weight:400;color:var(--ink)}
.map th:last-child,.map td:last-child{border-right:0}
.map tr:last-child td,.map tr:last-child th{border-bottom:0}
/* cabeçalhos */
.map thead th{background:var(--surface-2);position:sticky;top:0;z-index:3;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.map thead tr:first-child th{height:auto;padding:8px;vertical-align:bottom}
.map thead tr:nth-child(2) th{height:26px;z-index:2}
.map thead tr:nth-child(2) th.u,.map thead tr:nth-child(2) th.t{text-align:right}
.map thead tr:nth-child(2) th.k{text-align:center;padding:0 4px}
.map th.sticky,.map td.sticky{position:sticky;left:0;background:var(--surface);z-index:2}
.map thead th.sticky{background:var(--surface-2);z-index:5}
.map tfoot th.sticky{background:var(--surface-2)}
.map colgroup .cf-alt{background:color-mix(in srgb,var(--surface-2) 38%,transparent)}
/* cabeçalho do fornecedor */
.fh{display:flex;flex-direction:column;gap:5px;min-width:0}
.fh-top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.fh-rot{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;background:none;border:0;padding:0;cursor:pointer}
.fh-rot:hover{color:var(--accent);text-decoration:underline}
.fh-tot{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);text-transform:none;letter-spacing:0}
.fh-tot.win{color:var(--accent)}
.fh-st{font-size:11px;font-weight:600;min-height:14px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.fh-st.ok{color:var(--ok)} .fh-st.falta{color:var(--warn)} .fh-st.venc{color:var(--accent)}
.fh .inp{font-size:13px}
/* células */
.map td.sticky .it-d{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.map td.sticky .it-d.open{-webkit-line-clamp:unset;display:block}
.it-m{font-size:11px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:11px}
td.it{padding:6px 8px;height:auto}
td.qt{text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
td.u{padding:3px 5px;background:color-mix(in srgb,var(--accent-soft) 22%,transparent)}
td.u input{width:100%;height:28px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:0 8px;text-align:right;font-family:var(--f-mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
td.u input:hover:not(:disabled){border-color:var(--accent)}
td.u input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
td.u input:disabled{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
td.u input::placeholder{color:color-mix(in srgb,var(--ink-2) 65%,transparent);font-family:var(--f-mono);font-size:13px}
/* célula de leitura não tem caixa: o olho acha onde digitar */
td.t,td.qt{background:transparent}
td.t{text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
td.t .menor{font-family:var(--f-body);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);font-weight:700;margin-right:5px;vertical-align:1px}
td.k{text-align:center;padding:0 4px;cursor:pointer}
.pick{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent)}
.pick[aria-pressed="true"]::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(42deg) translate(-1px,-1px)}
.pick:disabled{opacity:.3;cursor:not-allowed}
td.ganha{background:var(--accent-soft)}
td.u.ganha input{border-color:var(--accent)}
td.ganha.t{color:var(--accent);font-weight:600}
td.t.temmenor{color:var(--ok)}
tr.bad-row td.sticky{box-shadow:inset 3px 0 0 var(--crit)}
tr.item-row:hover td:not(.sticky){background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
/* rodapé de condições */
.map tfoot th{background:var(--surface-2);font-size:12px;color:var(--ink);font-weight:600;text-transform:none;letter-spacing:0}
.map tfoot th .hint{display:block;font-weight:400;font-size:11px;color:var(--ink-2)}
.map tfoot td{padding:0 6px}
.map tfoot tr.cond-h th,.map tfoot tr.cond-h td{height:28px;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.map tfoot .campo{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.map tfoot .campo .un{font-size:11.5px;color:var(--ink-2);white-space:nowrap;min-width:26px}
.map tfoot .campo .un.pre{text-align:right;min-width:18px}
.map tfoot input.cond{text-align:left;max-width:170px}
.map tfoot input,.map tfoot select{height:26px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:12.5px;padding:0 6px;max-width:150px;width:100%}
.map tfoot input.money{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.map tfoot input:focus,.map tfoot select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.map tfoot tr.tr-total th,.map tfoot tr.tr-total td{height:40px;border-top:2px solid var(--line-2);background:var(--surface)}
.map tfoot tr.tr-total th{font-size:12.5px;color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0}
.tot{display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:4px 2px}
.tot .big{font-family:var(--f-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tot .big.win{color:var(--accent)}
.tot .sm{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.err{color:var(--crit);font-size:11px;font-weight:500;padding:0 8px 4px;text-transform:none;letter-spacing:0}
.inp.bad,input.bad,select.bad{border-color:var(--crit)!important;background:var(--crit-soft)!important}
/* modo foco */
.map.foco tbody td:not(.col-on):not(.sticky),.map.foco tfoot td:not(.col-on),.map.foco thead th:not(.col-on):not(.sticky){opacity:.35}
.map.foco td.col-on.u input{background:var(--surface)}
/* passos do preenchimento */
/* busca de fornecedor no cadastro */
.busca-cx{position:relative}
.sug{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 2px);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);max-height:260px;overflow:auto;min-width:280px}
.sug button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;cursor:pointer;font-size:13px;line-height:1.3;color:var(--ink);text-transform:none;letter-spacing:0}
.sug button:hover,.sug button[aria-selected="true"]{background:var(--accent-soft)}
.sug .cid{display:block;font-size:11px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.sug .aviso{padding:8px 10px;font-size:12px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.fonte-forn{font-size:11px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.passos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.passo{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.passo b{font-weight:600;color:var(--ink)}
.passo .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.passo.feito{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft);color:var(--ok)}
.passo.feito .n{background:var(--ok);color:var(--surface)}
.passo.feito b{color:var(--ok)}

.bar .kv.main .v{font-size:21px;color:var(--accent)}

.m-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

.m-top-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<script>
/* =====================================================================
   REGRAS DA MESA — ajuste aqui quando o processo for validado
   ===================================================================== */
const REGRAS = {
  fornecedoresPorFamilia: 3,   // colunas Fornecedor 1, 2 e 3 em toda família
  minPrecosPorItem: 3,         // menos que isso vira aviso e pede observação ao aprovador
  avisarSeNaoForMenor: true,   // escolher um preço que não é o menor pede observação
};
// Famílias do catálogo do GR. O banco guarda só a sigla; os nomes abaixo foram
// DEDUZIDOS pelos itens de cada família e precisam do aval do pessoal do GR.
// Quando vierem os nomes oficiais, é só trocar aqui.
const FAMILIAS = {
  MM:'Peças e materiais de máquinas',
  MG:'Ferramentas e material geral',
  SE:'Sementes e tratamento de sementes',
  DA:'Defensivos agrícolas',
  FE:'Fertilizantes',
  ST:'Segurança do trabalho',
  CC:'Cozinha e copa',
  SP:'Material de aplicação veterinária',
  MV:'Medicamentos veterinários',
  IA:'Insumos da fábrica de ração',
  AA:'Alimentação animal',
  HL:'Higiene e limpeza',
  CL:'Combustíveis e lubrificantes',
  ME:'Escritório e expediente',
  MO:'Equipamentos e veículos',
  AN:'Animais',
  GR:'Grãos e forragens',
  RR:'Recursos rurais',
  RC:'Recicláveis e embalagens vazias',
  LD:'Limpeza e desinfecção',
  LIM:'Limpeza', SEM:'Sementes', CON:'Construção', DEF:'Defensivos',
  PEC:'Peças', PNE:'Pneus', ALI:'Alimentos',
  ELE:'Elétrica', HID:'Hidráulica', CONS:'Construção',
  FORA:'Fora do catálogo',
};
const COND_PAG = ['À vista','PIX à vista','7 dias','14 dias','21 dias','28 dias','30 dias','30/60','30/60/90','Entrada + 30 dias'];
// Fornecedores do cadastro do GR (nome fantasia). Amostra de 120 da região,
// só para o campo de busca do protótipo. Em produção a lista inteira (3.568
// cadastros ativos) vem da tabela `fornecedores` do banco.
// Tipos de compra. A mensal segue outro fluxo e ainda não passa por esta tela.
// A mensal segue o mesmo caminho das outras: muda só o tamanho (muitos itens,
// de várias famílias) e a periodicidade.
const TIPOS = [ {id:'normal', nome:'Normal', ativo:true}, {id:'urgente', nome:'Urgente', ativo:true},
                {id:'mensal', nome:'Mensal', ativo:true} ];

const ETAPAS = [
  { id:'lid', nome:'Liderança imediata',   curto:'Liderança',  sla:2 },
  { id:'cot', nome:'Compras · cotação',    curto:'Cotação',    sla:5 },
  { id:'ger', nome:'Aprovação gerencial',  curto:'Gerencial',  sla:2 },
  { id:'fin', nome:'Aprovação financeiro', curto:'Financeiro', sla:2 },
  { id:'oc',  nome:'Ordem de compra',      curto:'OC',         sla:1 },
];
/* Compra mensal: a gerência aprova a necessidade ANTES da cotação. */
const fluxoDe = s => s && s.tipo === 'mensal' ? ['lid','ger','cot','fin','oc'].map(id => ETAPAS.find(e => e.id === id)) : ETAPAS;

/* =====================================================================
   DADOS — vêm do banco (fila_do_comprador e pedido_telas), pelo token do comprador
   ===================================================================== */
let SOLS = [];
/* ---------- cotação (rascunho) ---------- */
const famKey = it => it.fam || 'FORA';
// Fornecedor único ocupa uma coluna só; por cotação, as três do card.
const colunas = s => s.defForn === 'unico' ? [0] : [0,1,2];
const minPrecos = s => s.defForn === 'unico' ? 1 : REGRAS.minPrecosPorItem;
const famNome = k => k === 'FORA' ? FAMILIAS.FORA : (FAMILIAS[k] ? k + ' · ' + FAMILIAS[k] : k);
function familiasDe(s){ const o = []; s.itens.forEach(it => { const k = famKey(it); if (!o.includes(k)) o.push(k); }); return o; }
function novaCot(s){
  const fams = {};
  familiasDe(s).forEach(k => {
    fams[k] = { forn:[0,1,2].map(() => ({ nome:'', fid:null, desc:'', frete:'', prazo:'', cond:'', condLivre:'' })), precos:{}, escolha:{} };
    s.itens.filter(it => famKey(it) === k).forEach(it => fams[k].precos[it.id] = ['','','']);
  });
  return { fams, obs:'', salvoEm:null, iniciada:false };
}
function cotDe(s){ if (!s.cot) s.cot = novaCot(s); return s.cot; }

/* =====================================================================
   CONTAS — tudo num lugar só, para conferir
   ===================================================================== */
function parseBR(v){
  if (v === null || v === undefined) return null;
  let s = String(v).trim().replace(/R\$|\s|%/g,'');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
function ok(n){ return n !== null && !Number.isNaN(n); }
function calcFam(s, k){
  const F = cotDe(s).fams[k];
  const itens = s.itens.filter(it => famKey(it) === k);
  const desc = F.forn.map(f => { const d = parseBR(f.desc); return ok(d) && d >= 0 && d <= 100 ? d : 0; });
  const frete = F.forn.map(f => { const v = parseBR(f.frete); return ok(v) && v >= 0 ? v : 0; });
  const linhas = itens.map(it => {
    const p = F.precos[it.id].map(parseBR);
    const valido = p.map(x => ok(x) && x > 0);
    const efet = p.map((x,j) => valido[j] ? x * (1 - desc[j]/100) : null);
    const vals = efet.filter(x => x !== null);
    const min = vals.length ? Math.min(...vals) : null;
    const menor = efet.map(x => x !== null && vals.length > 1 && Math.abs(x - min) < 1e-9);
    const esc = F.escolha[it.id];
    return { it, p, valido, efet, menor, nPrecos:vals.length, esc: esc === undefined ? null : esc };
  });
  const forn = [0,1,2].map(j => {
    const ganhos = linhas.filter(l => l.esc === j && l.valido[j]);
    const sub = ganhos.reduce((t,l) => t + l.p[j] * l.it.qtd, 0);
    const total = ganhos.length ? sub * (1 - desc[j]/100) + frete[j] : 0;
    const cobre = linhas.length && linhas.every(l => l.valido[j]);
    const tudo = cobre ? linhas.reduce((t,l) => t + l.p[j] * l.it.qtd, 0) * (1 - desc[j]/100) + frete[j] : null;
    return { j, ganhos, n:ganhos.length, sub, desc:desc[j], frete:frete[j], total, tudo };
  });
  const escolhidos = linhas.filter(l => l.esc !== null && l.valido[l.esc]).length;
  return { k, itens, linhas, forn, total:forn.reduce((t,f) => t + f.total, 0), escolhidos, F };
}
function calcTudo(s){
  const fams = familiasDe(s).map(k => calcFam(s,k));
  const nomes = new Set();
  fams.forEach(f => f.forn.forEach(x => { if (x.n) nomes.add((f.F.forn[x.j].nome || ('F' + (x.j+1) + '·' + f.k)).trim().toLowerCase()); }));
  return { fams, total:fams.reduce((t,f) => t + f.total, 0), escolhidos:fams.reduce((t,f) => t + f.escolhidos, 0), nItens:s.itens.length, nForn:nomes.size };
}

/* ---------- validação ---------- */
function validar(s){
  const erros = [], avisos = [];
  const C = calcTudo(s);
  C.fams.forEach(fc => {
    const k = fc.k, F = fc.F;
    const vencedores = new Set(fc.linhas.filter(l => l.esc !== null).map(l => l.esc));
    const nomesVistos = {};
    colunas(s).forEach(j => {
      const f = F.forn[j];
      const temPreco = fc.linhas.some(l => String(F.precos[l.it.id][j]).trim() !== '');
      const nome = f.nome.trim();
      if ((temPreco || vencedores.has(j)) && !nome) erros.push({ k, id:`n-${k}-${j}`, msg:`Informe o nome do Fornecedor ${j+1}` });
      if (nome){
        const key = nome.toLowerCase();
        if (nomesVistos[key] !== undefined) erros.push({ k, id:`n-${k}-${j}`, msg:`Mesmo fornecedor do Fornecedor ${nomesVistos[key]+1}` });
        else nomesVistos[key] = j;
      }
      const d = parseBR(f.desc);
      if (d !== null && (Number.isNaN(d) || d < 0 || d > 100)) erros.push({ k, id:`d-${k}-${j}`, msg:'Desconto entre 0 e 100%' });
      if (vencedores.has(j) && nome && !f.fid) erros.push({ k, id:`n-${k}-${j}`, msg:`Escolha o Fornecedor ${j+1} pela busca do cadastro` });
      if (vencedores.has(j)){
        const fr = parseBR(f.frete);
        if (fr === null) erros.push({ k, id:`f-${k}-${j}`, msg:'Informe o frete (0 se incluso)' });
        else if (Number.isNaN(fr) || fr < 0) erros.push({ k, id:`f-${k}-${j}`, msg:'Frete inválido' });
        const pz = parseBR(f.prazo);
        if (pz === null) erros.push({ k, id:`z-${k}-${j}`, msg:'Informe o prazo de entrega' });
        else if (Number.isNaN(pz) || pz < 0 || !Number.isInteger(pz)) erros.push({ k, id:`z-${k}-${j}`, msg:'Prazo em dias inteiros' });
        if (!f.cond.trim()) erros.push({ k, id:`c-${k}-${j}`, msg:'Informe a condição de pagamento' });
      }
    });
    fc.linhas.forEach(l => {
      const nomeItem = l.it.desc.length > 40 ? l.it.desc.slice(0,38) + '…' : l.it.desc;
      l.p.forEach((x,j) => { if (x !== null && (Number.isNaN(x) || x <= 0)) erros.push({ k, id:`p-${k}-${l.it.id}-${j}`, msg:`Preço inválido · ${nomeItem}` }); });
      if (l.esc === null) erros.push({ k, id:`row-${k}-${l.it.id}`, foco:`p-${k}-${l.it.id}-0`, msg:`Escolha o fornecedor · ${nomeItem}` });
      else if (!l.valido[l.esc]) erros.push({ k, id:`row-${k}-${l.it.id}`, foco:`p-${k}-${l.it.id}-${l.esc}`, msg:`O fornecedor escolhido está sem preço · ${nomeItem}` });
      if (l.nPrecos < minPrecos(s)) avisos.push({ k, tipo:'poucos_precos', msg:`${nomeItem}: ${l.nPrecos} de ${minPrecos(s)} ${minPrecos(s) === 1 ? 'preço' : 'cotações'}` });
      if (REGRAS.avisarSeNaoForMenor && s.defForn !== 'unico' && l.esc !== null && l.valido[l.esc] && l.nPrecos > 1 && !l.menor[l.esc])
        avisos.push({ k, tipo:'nao_menor', msg:`${nomeItem}: escolhido Fornecedor ${l.esc+1}, que não tem o menor preço` });
    });
  });
  return { erros, avisos, C };
}
</script>
<script>
/* =====================================================================
   FORMATOS
   ===================================================================== */
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => v === null || v === undefined || Number.isNaN(v) ? '—' : BRL.format(v);
const n2 = v => Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const qtd = v => Number(v).toLocaleString('pt-BR',{maximumFractionDigits:3});
const dt = d => d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
const dth = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const hm = d => d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
/* Menos de 1 hora mostra minutos (piloto 29/09: pedido de minutos aparecia "1 hora"). */
function dias(d){ if (d < 1/24){ const m = Math.max(1, Math.round(d*1440)); return m + ' min'; }
  if (d < 1){ const h = Math.round(d*24); return h + (h === 1 ? ' hora' : ' horas'); } const n = Math.floor(d); return n + (n === 1 ? ' dia' : ' dias'); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

/* =====================================================================
   ESTADO DA TELA
   ===================================================================== */
const S = { view:'fila', tab:'cotar', q:'', tipo:'', foco:null, soFalta:false, comprador:'', carregado:false, erro:null, solId:null, fam:null, mostrarErros:false,
            modalList:[], modalIdx:-1, flash:null };
const sol = id => SOLS.find(s => s.id === id);
const etapa = id => ETAPAS.find(e => e.id === id);
function entradaEtapa(s){ return s.eventos[s.eventos.length - 1].data; }
function prazoEtapa(s){
  const e = etapa(s.status); if (!e || !e.sla) return null;
  const d = (Date.now() - entradaEtapa(s)) / 864e5;
  if (d > e.sla) return { cls:'crit', txt:'Atrasada', d, sla:e.sla };
  if (d > e.sla * .75) return { cls:'warn', txt:'Vence logo', d, sla:e.sla };
  return { cls:'ok', txt:'No prazo', d, sla:e.sla };
}
function necessidadePill(s){
  if (!s.necessidade) return '';
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const d = Math.round((s.necessidade - hoje) / 864e5);
  if (d < 0) return `<span class="pill crit">passou há ${plural(-d,'dia','dias')}</span>`;
  if (d === 0) return '<span class="pill crit">hoje</span>';
  if (d <= 2) return `<span class="pill warn">em ${plural(d,'dia','dias')}</span>`;
  return `<span class="pill neutral">em ${d} dias</span>`;
}
/* Que tipo de cotação é: item único, lista de itens ou serviço — o mesmo rótulo
   da "Natureza" na tela do pedido. Serviço é o pedido de uma linha em "Serviço". */
function tipoSolicitacao(s){
  const n = (s.itens || []).length;
  if (n === 1 && /servi/i.test(s.itens[0].un || '')) return 'Serviço';
  if (n === 1) return 'Item único';
  return 'Lista · ' + n + ' itens';
}
function tituloSol(s){
  const p = s.itens[0]; if (!p) return 'Sem itens';
  const t = p.desc.length > 90 ? p.desc.slice(0,88).trim() + '…' : p.desc;
  return t + (s.itens.length > 1 ? ` + ${s.itens.length - 1} ${s.itens.length === 2 ? 'item' : 'itens'}` : '');
}
function comQuem(s){
  if (s.status === 'cot') return 'Comprador ' + (s.comprador || S.comprador);
  const nome = s.comQuemNome ? ' (' + s.comQuemNome + ')' : '';
  return ({ ger:'Aprovação gerencial', fin:'Aprovação financeira' }[s.status] || '—') + nome;
}
function estadoCot(s){
  if (s.status === 'ger') return { cls:'accent', txt:'Enviada · gerencial · ' + brl(s.valor) };
  if (s.status === 'fin') return { cls:'accent', txt:'Enviada · financeiro · ' + brl(s.valor) };
  if (s.devolucao) return { cls:'crit', txt:'Devolvida pelo aprovador' };
  if (!s.cot && s.mapaEstado) return { cls:'warn', txt:'Rascunho salvo' };
  if (!s.cot || !s.cot.iniciada) return { cls:'neutral', txt:'Não iniciada' };
  const C = calcTudo(s);
  return { cls:'warn', txt:`Rascunho · ${C.escolhidos} de ${C.nItens} ${C.nItens === 1 ? 'item' : 'itens'}` };
}
const grupoTab = s => s.status !== 'cot' ? 'env' : (s.devolucao ? 'dev' : 'cotar');

/* =====================================================================
   RENDER GERAL
   ===================================================================== */
function render(){
  $('bar').hidden = true; $('pend').hidden = true;
  document.querySelector('.top').hidden = S.view !== 'fila';
  if (S.view === 'fila') renderFila(); else renderMapa();
}

/* =====================================================================
   TELA 1 · FILA DO COMPRADOR
   ===================================================================== */
function renderFila(){
  const v = $('view');
  if (!S.carregado){
    v.innerHTML = '<div class="tbl-wrap" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    return;
  }
  if (S.erro){
    const e = S.erro;
    v.innerHTML = `<div class="state"><h3>${esc(e.titulo)}</h3><p>${esc(e.texto)}</p>${e.tentar ? '<button class="btn primary" type="button" id="bt-tentar">Tentar de novo</button>' : ''}</div>`;
    if ($('bt-tentar')) $('bt-tentar').onclick = () => carregarFila(true);
    return;
  }
  const minhas = SOLS;
  const grupos = { cotar:[], dev:[], env:[] };
  minhas.forEach(s => grupos[grupoTab(s)].push(s));
  const ordenar = l => l.slice().sort((a,b) => (b.urgente?1:0) - (a.urgente?1:0) || a.necessidade - b.necessidade || a.criada - b.criada);
  const q = S.q.toLowerCase();
  const lista = ordenar(grupos[S.tab]).filter(s => (!S.tipo || s.tipo === S.tipo)).filter(s => !q || [s.id, tituloSol(s), s.solicitante, s.ccNome, s.motivo, ...s.itens.map(i => i.desc + ' ' + (i.cod || ''))].join(' ').toLowerCase().includes(q));

  let flash = '';
  if (S.flash){
    const f = S.flash;
    flash = `<div class="banner ${f.cls || 'ok'}" role="status"><span class="grow">${f.html}</span><button class="btn ghost" type="button" id="bt-flash-x">Ok</button></div>`;
  }
  const tabBtn = (id, nome, n, alert) => `<button class="tab ${alert && n ? 'alert' : ''}" role="tab" type="button" data-tab="${id}" aria-selected="${S.tab === id}">${nome}<span class="c num">${n}</span></button>`;
  let corpo;
  if (!minhas.length){
    corpo = `<div class="state"><h3>Nenhuma solicitação com você</h3><p>Quando a liderança aprovar um pedido que cai na sua carteira, ele aparece aqui para cotar. Pedidos que ainda andam pelo ClickUp continuam lá até a virada.</p></div>`;
  } else if (!lista.length){
    const vazio = { cotar:['Tudo cotado','Nenhuma solicitação esperando cotação agora.'], dev:['Nada devolvido','Quando um aprovador devolver uma cotação, ela aparece aqui com o motivo.'], env:['Nada enviado ainda','As cotações que você enviar para aprovação ficam aqui até virarem ordem de compra.'] }[S.tab];
    const rotuloTipo = (TIPOS.find(t => t.id === S.tipo) || {}).nome;
    corpo = S.tipo && !q ? `<div class="state"><h3>Nenhuma compra ${esc((rotuloTipo || '').toLowerCase())} nesta aba</h3><p>Tire o filtro para ver as outras.</p><button class="btn primary" type="button" id="bt-limpa-tipo">Ver todas</button></div>`
      : q ? `<div class="state"><h3>Nada encontrado para “${esc(S.q)}”</h3><p>Busque por número, item, solicitante ou centro de custo.</p><button class="btn primary" type="button" id="bt-limpa">Limpar busca</button></div>`
              : `<div class="state"><h3>${vazio[0]}</h3><p>${vazio[1]}</p></div>`;
  } else {
    corpo = `<div class="tbl-wrap"><table class="fila"><thead><tr>
      <th>Nº</th><th>Solicitação</th><th>Tipo</th><th>Famílias</th><th>Precisa até</th><th>Na etapa</th><th>Cotação</th><th class="r"><span class="sr-only">Ação</span></th></tr></thead><tbody>
      ${lista.map(s => {
        const p = prazoEtapa(s), e = estadoCot(s);
        const acao = s.status === 'cot' ? ((s.cot && s.cot.iniciada) || s.mapaEstado ? 'Continuar' : 'Cotar') : 'Ver';
        return `<tr data-id="${s.id}" tabindex="0">
          <td class="mono">${esc(s.id)}</td>
          <td><span class="t">${esc(tituloSol(s))}</span><span class="s">${esc(s.ccNome)} · ${esc(s.solicitante)}</span>${s.urgente ? ' <span class="pill warn">Urgente</span>' : ''}${s.tipo === 'mensal' ? ' <span class="pill neutral">Mensal</span>' : ''}${s.defForn === 'unico' ? ' <span class="pill accent">Fornecedor único</span>' : ''}</td>
          <td class="tipo">${tipoSolicitacao(s)}</td>
          <td>${familiasDe(s).map(k => `<span class="pill neutral" title="${esc(famNome(k))}">${esc(famNome(k))}</span>`).join(' ')}</td>
          <td class="num">${dt(s.necessidade)}</td>
          <td>${p ? `<span class="pill ${p.cls}" title="Prazo da etapa: ${p.sla} dias">${dias(p.d)}</span>` : '—'}</td>
          <td><span class="pill ${e.cls}">${esc(e.txt)}</span></td>
          <td class="r"><button class="btn ${s.status === 'cot' ? 'primary' : ''}" type="button" data-open="${s.id}">${acao}</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  v.innerHTML = `${flash}
    <div class="tabs" role="tablist">${tabBtn('cotar','Para cotar',grupos.cotar.length)}${tabBtn('dev','Devolvidas',grupos.dev.length,true)}${tabBtn('env','Enviadas',grupos.env.length)}</div>
    <div class="tools">
      <input id="f-q" class="ctl" type="search" placeholder="Buscar nº, item, solicitante…" value="${esc(S.q)}" aria-label="Buscar">
      <div class="seg" role="group" aria-label="Tipo de compra">
        <button class="sgb" type="button" data-tipo="" aria-pressed="${S.tipo === ''}">Todas</button>
        ${TIPOS.map(t => t.ativo
          ? `<button class="sgb" type="button" data-tipo="${t.id}" aria-pressed="${S.tipo === t.id}">${t.nome}<span class="c num">${minhas.filter(x => grupoTab(x) === S.tab && x.tipo === t.id).length}</span></button>`
          : `<button class="sgb off" type="button" data-tipo="${t.id}" aria-disabled="true">${t.nome} <span class="soon">em breve</span></button>`).join('')}
      </div>
    </div>
    ${S.tipo === 'mensal' ? '' : ''}
    ${corpo}`;

  if (S.flash) $('bt-flash-x').onclick = () => { S.flash = null; render(); };
  v.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  v.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => {
    const t = TIPOS.find(x => x.id === b.dataset.tipo);
    if (t && !t.ativo){ toast(t.nota); return; }
    S.tipo = b.dataset.tipo; render();
  });
  const fq = $('f-q'); fq.oninput = () => { S.q = fq.value; const pos = fq.selectionStart; render(); const n = $('f-q'); n.focus(); n.setSelectionRange(pos,pos); };
  if ($('bt-limpa')) $('bt-limpa').onclick = () => { S.q = ''; render(); };
  if ($('bt-limpa-tipo')) $('bt-limpa-tipo').onclick = () => { S.tipo = ''; render(); };
  v.querySelectorAll('tr[data-id]').forEach(tr => {
    const abrir = () => abrirDetalhe(tr.dataset.id, lista.map(s => s.id));
    tr.onclick = abrir;
    tr.onkeydown = e => { if (e.target === tr && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); abrir(); } };
  });
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.stopPropagation(); abrirMapa(b.dataset.open); });
}

/* =====================================================================
   DETALHE DA SOLICITAÇÃO (formato do Funil)
   ===================================================================== */
let ultimoFoco = null;
function abrirModal(html, tamanho){
  if ($('overlay').hidden) ultimoFoco = document.activeElement;
  $('modal').className = 'modal' + (tamanho ? ' ' + tamanho : '');
  $('modal').innerHTML = html;
  $('overlay').hidden = false; document.body.style.overflow = 'hidden';
}
function fecharModal(){
  $('overlay').hidden = true; document.body.style.overflow = '';
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
}
function abrirDetalhe(id, lista){
  S.modalList = lista || [id]; S.modalIdx = S.modalList.indexOf(id);
  mostrarDetalhe();
}
/* O detalhe precisa do histórico e dos anexos, que vêm de pedido_telas. */
async function mostrarDetalhe(){
  const s = sol(S.modalList[S.modalIdx]); if (!s){ fecharModal(); return; }
  if (!s.carregado){
    abrirModal(`<div class="m-head"><div><div class="eyebrow"><span class="mono">${esc(s.id)}</span></div><h2 id="m-title">Abrindo a solicitação…</h2></div><button class="x" id="m-close" type="button" aria-label="Fechar">✕</button></div><div class="m-body"><div class="skel"></div><div class="skel"></div></div>`);
    $('m-close').onclick = fecharModal; S.modalTipo = 'detalhe';
    try { await carregarPedido(s); }
    catch (e){
      if ($('overlay').hidden) return;
      $('modal').querySelector('.m-body').innerHTML = `<div class="state" style="padding:18px"><h3>Não consegui abrir agora</h3><p>${esc(e.message || 'A rede falhou.')}</p></div>`;
      return;
    }
    if ($('overlay').hidden || sol(S.modalList[S.modalIdx]) !== s) return;
  }
  pintarDetalhe();
}
const kv = (k, v, extra='') => `<div class="kv"><div class="k">${k}</div><div class="v ${extra}">${v}</div></div>`;
function pintarDetalhe(){
  const s = sol(S.modalList[S.modalIdx]); if (!s){ fecharModal(); return; }
  const p = prazoEtapa(s), FL = fluxoDe(s), idx = FL.findIndex(e => e.id === s.status);
  const holder = p ? `<div class="holder ${p.cls}"><strong>${etapa(s.status).nome}</strong><span>com ${esc(comQuem(s))}</span><span>há <strong>${dias(p.d)}</strong> (prazo da etapa: ${p.sla} dias)</span><span class="pill ${p.cls}">${p.txt}</span></div>` : '';
  const steps = FL.map((e,i) => `<div class="step ${i < idx ? 'done' : i === idx ? 'cur' : ''}"><span class="ln"></span>${e.curto}</div>`).join('');
  const C = s.cot && s.cot.iniciada ? calcTudo(s) : null;
  const linhaDe = it => { if (!C) return null; const fc = C.fams.find(f => f.k === famKey(it)); return fc.linhas.find(l => l.it.id === it.id); };
  const itens = s.itens.map(it => {
    const l = linhaDe(it), u = l && l.esc !== null && l.valido[l.esc] ? l.p[l.esc] : null;
    return `<tr><td class="mono">${esc(it.cod || '—')}</td><td>${esc(it.desc)}${it.fora ? ' <span class="pill neutral">fora do catálogo</span>' : ''}</td><td>${esc(it.fam || '—')}</td><td class="r num">${qtd(it.qtd)} ${esc(it.un)}</td><td class="r num">${brl(u)}</td><td class="r num">${u !== null ? brl(u * it.qtd) : '—'}</td></tr>`;
  }).join('');
  const valor = s.valor !== null ? s.valor : (C && C.escolhidos ? C.total : null);
  const origem = s.valor !== null ? 'Cotação enviada' : (C && C.escolhidos ? 'Rascunho da cotação' : '<span class="muted">Ainda sem preço — sai da cotação</span>');
  const anexos = (s.anexos || []).map(a => `<li><a href="${ANEXO_URL}?id=${encodeURIComponent(a.id)}" target="_blank" rel="noopener">${esc(a.nome)}</a> <span class="muted">· ${tamanho(a.tamanho)}</span></li>`).join('');
  const nCot = C ? C.fams.reduce((t,f) => t + f.F.forn.filter(x => x.nome.trim()).length, 0) : 0;
  const tl = s.eventos.map(e => `<li class="${e.bad ? 'bad' : ''}"><span class="b"></span><div><div class="t">${esc(e.titulo)}</div><div class="d">${dth(e.data)}${e.pessoa ? ' · ' + esc(e.pessoa) : ''}</div>${e.nota ? `<div class="n">${e.bad ? 'Motivo' : 'Obs.'}: ${esc(e.nota)}</div>` : ''}</div></li>`).join('')
    + `<li class="now"><span class="b"></span><div><div class="t muted">Agora: ${etapa(s.status).nome}</div><div class="d">aguardando ${esc(comQuem(s))}</div></div></li>`;
  const acao = s.status === 'cot' ? (s.cot && s.cot.iniciada ? 'Continuar cotação' : 'Cotar esta solicitação') : 'Ver orçamento enviado';
  abrirModal(`
    <div class="m-head"><div>
      <div class="eyebrow"><span class="mono">${esc(s.id)}</span> · aberta em ${dt(s.criada)}</div>
      <h2 id="m-title">${esc(tituloSol(s))}</h2>
      <div class="sub">${esc(s.empresa)} · ${esc(s.cc)} · ${esc(s.ccNome)}${s.urgente ? ' · <span class="pill warn">Urgente</span>' : ''}</div>
    </div><button class="x" id="m-close" type="button" aria-label="Fechar">✕</button></div>
    <div class="m-body">
      ${s.devolucao && s.status === 'cot' ? `<div class="holder crit"><strong>Devolvida por ${esc(s.devolucao.por)}</strong><span>${esc(s.devolucao.motivo)}</span></div>` : ''}
      ${holder}
      <div class="steps" aria-label="Etapas">${steps}</div>
      <div class="grid3">
        ${kv('Valor', brl(valor), 'big num')}${kv('Origem do valor', origem)}${kv('Precisa até', dt(s.necessidade) + ' ' + necessidadePill(s))}
        ${kv('Solicitante', esc(s.solicitante))}${kv('Comprador', esc(s.comprador))}${kv('Setor / unidade', esc(s.setor))}
        ${kv('Fornecedor', s.defForn === 'unico' ? 'Fornecedor único' : 'Por cotação')}${kv('Cotações', nCot ? plural(nCot,'fornecedor preenchido','fornecedores preenchidos') : '<span class="muted">nenhuma enviada ainda</span>')}${kv('Local de entrega', esc(s.local || '—'))}
      </div>
      ${s.justForn ? `<div class="m-sec"><h3>Justificativa do fornecedor único</h3><div class="just">${esc(s.justForn)}</div></div>` : ''}
      <div class="m-sec"><h3>Motivo</h3><div class="just">${esc(s.motivo)}</div></div>
      <div class="m-sec"><h3>Itens</h3><div class="tbl-wrap"><table class="items"><thead><tr><th>Código</th><th>Item</th><th>Família</th><th class="r">Qtd.</th><th class="r">Unitário</th><th class="r">Total</th></tr></thead><tbody>${itens}</tbody></table></div></div>
      ${anexos ? `<div class="m-sec"><h3>Anexos</h3><ul class="anexos-lista">${anexos}</ul></div>` : ''}
      <div class="m-sec"><h3>Histórico</h3><ol class="tl">${tl}</ol></div>
    </div>
    <div class="m-foot">
      <span class="pos">${S.modalIdx + 1} de ${S.modalList.length} na lista atual · use ← →</span>
      <div class="nav">
        <button class="btn" type="button" id="m-prev" ${S.modalIdx <= 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn" type="button" id="m-next" ${S.modalIdx >= S.modalList.length - 1 ? 'disabled' : ''}>Próxima →</button>
        ${s.status === 'cot' ? '<button class="btn danger-ghost" type="button" id="m-reprovar">Reprovar pedido</button>' : ''}
        <button class="btn primary" type="button" id="m-go">${acao}</button>
      </div>
    </div>`);
  $('m-close').onclick = fecharModal;
  $('m-prev').onclick = () => navegar(-1);
  $('m-next').onclick = () => navegar(1);
  $('m-go').onclick = () => { fecharModal(); if (S.view !== 'mapa' || S.solId !== s.id) abrirMapa(s.id); };
  if ($('m-reprovar')) $('m-reprovar').onclick = () => abrirReprovar(s);
  $('m-close').focus();
  S.modalTipo = 'detalhe';
}
function navegar(d){ const n = S.modalIdx + d; if (n < 0 || n >= S.modalList.length) return; S.modalIdx = n; mostrarDetalhe(); }
</script>
<script>
/* =====================================================================
   TELA 2 · MAPA DE COTAÇÃO
   ===================================================================== */
async function abrirMapa(id){
  const s = sol(id); if (!s) return;
  /* Sempre relê do banco ao abrir (outra aba, devolução, envio) — menos quando
     há mudança local ainda não gravada. */
  if (!s.sujo){
    toast('Abrindo o mapa…');
    try { await carregarPedido(s); }
    catch (e){ toast(e.message || 'Não consegui abrir o pedido agora.'); return; }
  }
  cotDe(s);
  S.view = 'mapa'; S.solId = id; S.mostrarErros = false; S.foco = null; S.soFalta = false;
  S.fam = familiasDe(s)[0];
  render(); window.scrollTo(0,0);
}
const soLeitura = s => s.status !== 'cot';

function renderMapa(){
  const s = sol(S.solId), c = cotDe(s), ro = soLeitura(s);
  const fams = familiasDe(s);
  if (!fams.includes(S.fam)) S.fam = fams[0];
  let banner = '';
  const bannerUnico = s.defForn === 'unico'
    ? `<div class="banner warn"><span class="grow"><strong>Fornecedor único — o solicitante dispensou a cotação.</strong> Preencha só a coluna desse fornecedor.${s.justForn ? ' <br><span class="just-inline">Justificativa: ' + esc(s.justForn) + '</span>' : ''}</span></div>`
    : '';
  if (s.status === 'cot' && s.devolucao) banner = `<div class="banner crit"><span class="grow"><strong>Devolvida por ${esc(s.devolucao.por)}</strong> em ${dth(s.devolucao.em)}: ${esc(s.devolucao.motivo)}</span></div>`;
  if (s.status === 'ger' || s.status === 'fin') banner = `<div class="banner info"><span class="grow"><strong>Enviada para ${s.status === 'ger' ? 'aprovação gerencial' : 'aprovação financeira'}</strong>${s.comQuemNome ? ' (' + esc(s.comQuemNome) + ')' : ''} · ${brl(s.valor)} · o mapa fica só para leitura enquanto está com o aprovador.</span></div>`;

  $('view').innerHTML = `
    <button class="btn ghost back" type="button" id="bt-back">← Fila de cotação</button>
    <div class="m-top"><div>
      <div class="eyebrow"><span class="mono">${esc(s.id)}</span> · Mapa de cotação</div>
      <h1>${esc(tituloSol(s))}</h1>
      <div class="sub">${esc(s.empresa)} · ${esc(s.cc)} · ${esc(s.ccNome)}${s.urgente ? ' · <span class="pill warn">Urgente</span>' : ''}${s.tipo === 'mensal' ? ' · <span class="pill neutral">Compra mensal</span>' : ''}</div>
    </div><div class="m-top-acts">${ro ? '' : '<button class="btn danger-ghost" type="button" id="bt-reprovar">Reprovar pedido</button>'}<button class="btn" type="button" id="bt-det">Ver solicitação completa</button></div></div>
    ${bannerUnico}${banner}
    <div class="facts">
      <div class="fact"><div class="k">Solicitante</div><div class="v">${esc(s.solicitante)}</div></div>
      <div class="fact"><div class="k">Precisa até</div><div class="v num">${dt(s.necessidade)} ${necessidadePill(s)}</div></div>
      <div class="fact"><div class="k">Itens</div><div class="v">${s.itens.length} em ${plural(fams.length,'família','famílias')}</div></div>
      <div class="fact wide"><div class="k">Motivo</div><div class="v">${esc(s.motivo)}</div></div>
    </div>
    <div class="ftabs" role="tablist" id="ftabs" aria-label="Famílias"></div>
    <div class="passos" id="passos" aria-label="Como preencher"></div>
    <div class="map-h"><h2 id="map-title"></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span id="bt-falta-cx"></span>
        ${ro ? '' : `<button class="btn" type="button" id="bt-menores">${s.defForn === 'unico' ? 'Marcar todos os itens' : 'Escolher os menores preços'}</button>`}
      </div></div>
    <p class="muted" style="margin:0 0 8px;font-size:12.5px"><span class="fonte-forn">${CADASTRO.online ? `Fornecedores: busca nos ${CADASTRO.total ? CADASTRO.total.toLocaleString('pt-BR') : ''} cadastros ativos do banco — escolha na lista para o fornecedor valer.` : 'Fornecedores: não consegui falar com o cadastro agora. Os preços continuam sendo salvos; o nome do fornecedor precisa ser escolhido na busca antes de enviar.'}</span><br>${ro ? '' : (s.defForn === 'unico' ? 'Digite o preço unitário do fornecedor único e marque ✓ em cada item. <kbd>Enter</kbd> desce para o próximo item.' : 'Digite o preço unitário de cada fornecedor e marque ✓ em quem vai fornecer o item. <kbd>Enter</kbd> desce para o próximo item do mesmo fornecedor.')}</p>
    <div class="map-wrap" id="map-wrap"></div>
    <section class="resumo" aria-labelledby="res-h"><h2 id="res-h">Resumo que vai para o aprovador</h2><div id="resumo"></div></section>
    <section class="resumo" aria-labelledby="orc-h"><h2 id="orc-h">Orçamentos dos fornecedores</h2><div id="orcamentos"></div></section>`;

  $('bt-back').onclick = voltarFila;
  $('bt-det').onclick = () => abrirDetalhe(s.id, [s.id]);
  if ($('bt-menores')) $('bt-menores').onclick = escolherMenores;
  if ($('bt-reprovar')) $('bt-reprovar').onclick = () => abrirReprovar(s);
  pintarOrcamentos(s);
  pintarTabela();
  $('bar').hidden = false;
  refresh();
}

function pintarTabela(){
  const s = sol(S.solId), k = S.fam, F = cotDe(s).fams[k], ro = soLeitura(s) ? 'disabled' : '';
  const todos = s.itens.filter(it => famKey(it) === k);
  const F0 = cotDe(s).fams[k];
  const pendentes = todos.filter(it => F0.escolha[it.id] === undefined || !String(F0.precos[it.id][F0.escolha[it.id]] || '').trim());
  const itens = S.soFalta && pendentes.length ? pendentes : todos;
  $('map-title').textContent = `${famNome(k)} · ${plural(todos.length,'item','itens')}`
    + (itens.length !== todos.length ? ` · mostrando ${itens.length} pendentes` : '');
  const J = colunas(s);
  const rotulo = j => s.defForn === 'unico' ? 'Fornecedor único' : 'Fornecedor ' + (j+1);
  const errDiv = id => `<div class="err" id="e-${id}" hidden></div>`;
  const f = j => F.forn[j];

  /* cabeçalho: nome do fornecedor + o que falta nele, por cima das colunas Unitário / Total / ✓ */
  const cab1 = J.map(j => `<th colspan="3" class="cj-${j}"><div class="fh">
      <span class="fh-top">
        <button type="button" class="fh-rot" data-foco="${j}" title="Preencher só este fornecedor">${rotulo(j)}</button>
        <span class="fh-tot" id="hd-${k}-${j}"></span>
      </span>
      <span class="busca-cx"><input class="inp" id="n-${k}-${j}" data-k="nome" data-j="${j}" data-busca="1" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" placeholder="Digite 2 letras do fornecedor" value="${esc(F.forn[j].nome)}" ${ro}></span>
      <span class="fh-st" id="st-${k}-${j}"></span>${errDiv(`n-${k}-${j}`)}</div></th>`).join('');
  const cab2 = J.map(j => `<th class="u cj-${j}">Unitário</th><th class="t cj-${j}">Total</th><th class="k cj-${j}" title="Quem vai fornecer este item">✓</th>`).join('');

  const linhas = itens.map(it => {
    const longo = it.desc.length > 110;
    return `<tr class="item-row" id="row-${k}-${it.id}">
      <td class="sticky it"><div class="it-d" id="dd-${it.id}" title="${esc(it.desc)}">${esc(it.desc)}</div>
        <div class="it-m">${it.cod ? `<span class="mono">${esc(it.cod)}</span>` : ''}${it.fora ? '<span>fora do catálogo</span>' : ''}${longo ? `<button class="more" type="button" data-more="${it.id}">ver tudo</button>` : ''}</div>
        ${errDiv(`row-${k}-${it.id}`)}</td>
      <td class="qt">${qtd(it.qtd)} ${esc(it.un)}</td>
      ${J.map(j => `<td class="u cj-${j}" id="td-${k}-${it.id}-${j}"><input class="money" id="p-${k}-${it.id}-${j}" data-k="preco" data-i="${it.id}" data-j="${j}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(F.precos[it.id][j])}" aria-label="Preço unitário — ${rotulo(j)} — ${esc(it.desc.slice(0,60))}" ${ro}>${errDiv(`p-${k}-${it.id}-${j}`)}</td>
        <td class="t cj-${j}" id="tl-${k}-${it.id}-${j}"></td>
        <td class="k cj-${j}"><button class="pick" type="button" id="k-${k}-${it.id}-${j}" data-pick data-i="${it.id}" data-j="${j}" aria-pressed="false" aria-label="Escolher ${rotulo(j)} para ${esc(it.desc.slice(0,40))}" ${ro}></button></td>`).join('')}
    </tr>`;
  }).join('');

  const linhaCond = (rot, dica, fn) => `<tr><th class="sticky" colspan="2">${rot}${dica ? `<span class="hint">${dica}</span>` : ''}</th>${J.map(j => `<td colspan="3" class="cj-${j}">${fn(j)}</td>`).join('')}</tr>`;
  const pe = [
    `<tr class="cond-h"><th class="sticky" colspan="2">Condições de cada fornecedor</th>${J.map(j => `<td colspan="3" class="cj-${j}"></td>`).join('')}</tr>`,
    linhaCond('Desconto', 'sobre os itens escolhidos', j => `<div class="campo"><span class="un pre"></span><input class="money" id="d-${k}-${j}" data-k="desc" data-j="${j}" inputmode="decimal" placeholder="0" value="${esc(f(j).desc)}" aria-label="Desconto de ${rotulo(j)} em %" ${ro}><span class="un">%</span></div>${errDiv(`d-${k}-${j}`)}`),
    linhaCond('Frete', '0 se incluso no preço', j => `<div class="campo"><span class="un pre">R$</span><input class="money" id="f-${k}-${j}" data-k="frete" data-j="${j}" inputmode="decimal" placeholder="0,00" value="${esc(f(j).frete)}" aria-label="Frete de ${rotulo(j)}" ${ro}><span class="un"></span></div>${errDiv(`f-${k}-${j}`)}`),
    linhaCond('Prazo de entrega', 'dias após o pedido', j => `<div class="campo"><span class="un pre"></span><input class="money" id="z-${k}-${j}" data-k="prazo" data-j="${j}" inputmode="numeric" placeholder="—" value="${esc(f(j).prazo)}" aria-label="Prazo de entrega de ${rotulo(j)} em dias" ${ro}><span class="un">dias</span></div>${errDiv(`z-${k}-${j}`)}`),
    linhaCond('Condição de pagamento', 'digite ou escolha', j => `<div class="campo"><input class="cond" id="c-${k}-${j}" data-k="cond" data-j="${j}" list="dl-cond" autocomplete="off" placeholder="ex.: 28 dias" value="${esc(f(j).cond)}" aria-label="Condição de pagamento de ${rotulo(j)}" ${ro}></div>${errDiv(`c-${k}-${j}`)}`),
    `<tr class="tr-total"><th class="sticky" colspan="2">Total do fornecedor<span class="hint">itens escolhidos − desconto + frete</span></th>${J.map(j => `<td colspan="3" class="cj-${j}"><div class="tot"><span class="big" id="tt-${k}-${j}">—</span><span class="sm" id="ts-${k}-${j}"></span><span class="sm" id="tu-${k}-${j}"></span></div></td>`).join('')}</tr>`,
  ].join('');

  $('map-wrap').innerHTML = `<table class="map ${s.defForn === 'unico' ? 'unico' : ''}">
    <colgroup><col class="c-item"><col class="c-qtd">${J.map((j,i) => `<col class="${i % 2 ? 'cf-alt' : ''}"><col class="${i % 2 ? 'cf-alt' : ''}"><col class="${i % 2 ? 'cf-alt' : ''}">`).join('')}</colgroup>
    <thead>
      <tr><th class="sticky" rowspan="2">Item</th><th rowspan="2" style="text-align:right">Qtd.</th>${cab1}</tr>
      <tr>${cab2}</tr>
    </thead>
    <tbody>${linhas}</tbody><tfoot>${pe}</tfoot></table>`;
}

/* ---------- atualização parcial (não perde o foco de quem digita) ---------- */
function refresh(){
  const s = sol(S.solId), ro = soLeitura(s);
  const V = validar(s), C = V.C, fc = C.fams.find(f => f.k === S.fam);
  // células: preço, total da linha, marca de menor preço e escolha
  fc.linhas.forEach(l => colunas(s).forEach(j => {
    const td = $(`td-${S.fam}-${l.it.id}-${j}`), tl = $(`tl-${S.fam}-${l.it.id}-${j}`), pick = $(`k-${S.fam}-${l.it.id}-${j}`);
    if (!td || !tl || !pick) return;
    const escolhido = l.esc === j;
    tl.innerHTML = l.valido[j]
      ? (l.menor[j] ? '<span class="menor">menor</span>' : '') + brl(l.p[j] * l.it.qtd)
      : '';
    tl.classList.toggle('temmenor', !!l.menor[j] && l.esc !== j);
    [td, tl, pick.parentElement].forEach(e => e.classList.toggle('ganha', escolhido));
    pick.setAttribute('aria-pressed', String(escolhido));
    pick.disabled = ro || (!l.valido[j] && !escolhido);
  }));
  // rodapé por fornecedor
  fc.forn.filter(x => colunas(s).includes(x.j)).forEach(x => {
    const n = fc.F.forn[x.j].nome.trim();

    tt.textContent = x.n ? brl(x.total) : '—';
    tt.classList.toggle('win', x.n > 0);
    $(`ts-${S.fam}-${x.j}`).textContent = x.n ? plural(x.n,'item escolhido','itens escolhidos') + (x.desc ? ` · −${n2(x.desc)}%` : '') + (x.frete ? ` · frete ${brl(x.frete)}` : '') : (n ? 'nenhum item escolhido' : '');
    $(`tu-${S.fam}-${x.j}`).textContent = x.tudo !== null && fc.linhas.length > 1 ? 'se levasse tudo: ' + brl(x.tudo) : '';
  });
  // cabeçalho de cada fornecedor: total corrente e o que falta nele
  colunas(s).forEach(j => {
    const x = fc.forn.find(y => y.j === j), nome = fc.F.forn[j].nome.trim();
    const temPreco = fc.linhas.some(l => l.valido[j]);
    const f = fc.F.forn[j];
    const faltaCond = x.n > 0 && [f.frete, f.prazo, f.cond].some(v => String(v).trim() === '');
    const hd = $(`hd-${S.fam}-${j}`), st = $(`st-${S.fam}-${j}`);
    if (hd){
      hd.textContent = x.n ? brl(x.total) : (temPreco ? brl(x.tudo === null ? 0 : x.tudo) : '');
      hd.classList.toggle('win', x.n > 0);
      hd.title = x.n ? 'Total dos itens escolhidos com este fornecedor' : 'Total se ele levasse todos os itens';
    }
    if (st){
      let cls = 'fh-st', txt = '';
      if (!nome && !temPreco){ txt = ''; }
      else if (!nome){ cls += ' falta'; txt = 'Falta o nome'; }
      else if (!f.fid){ cls += ' falta'; txt = 'Escolha na lista do cadastro'; }
      else if (!temPreco){ cls += ' falta'; txt = 'Falta digitar preços'; }
      else if (faltaCond){ cls += ' falta'; txt = 'Faltam as condições'; }
      else if (x.n){ cls += ' venc'; txt = `Leva ${plural(x.n,'item','itens')}`; }
      else { cls += ' ok'; txt = 'Cotado, sem item escolhido'; }
      st.className = cls; st.textContent = txt;
    }
  });
  // foco em uma coluna
  const tabela = document.querySelector('.map');
  if (tabela){
    tabela.classList.toggle('foco', S.foco !== null);

    if (S.foco !== null) tabela.querySelectorAll('.cj-' + S.foco).forEach(e => e.classList.add('col-on'));
  }
  // compras grandes (mensal): atalho para ver só o que ainda falta escolher
  const cx = $('bt-falta-cx');
  if (cx){
    const faltam = fc.linhas.filter(l => l.esc === null || !l.valido[l.esc]).length;
    if (fc.linhas.length >= 8 || S.soFalta){
      cx.innerHTML = `<button class="btn ${S.soFalta ? 'primary' : ''}" type="button" id="bt-falta">${S.soFalta ? 'Mostrar todos os itens' : `Só o que falta (${faltam})`}</button>`;
      $('bt-falta').onclick = () => { S.soFalta = !S.soFalta; pintarTabela(); refresh(); };

  }
  pintarPassos(s, C, V);
  // abas de família
  const errosPorFam = {}; V.erros.forEach(e => errosPorFam[e.k] = (errosPorFam[e.k] || 0) + 1);
  $('ftabs').innerHTML = C.fams.map(f => {
    const done = f.escolhidos === f.linhas.length, ne = S.mostrarErros ? (errosPorFam[f.k] || 0) : 0;
    const st = ne ? `<span class="pill crit">${plural(ne,'pendência','pendências')}</span>` : done ? '✓ todos escolhidos' : `${f.escolhidos} de ${f.linhas.length} escolhidos`;
    const exemplos = f.linhas.slice(0,2).map(l => l.it.desc.split(/[,(]/)[0].trim().slice(0,22)).join(', ');
    return `<button class="ftab ${done && !ne ? 'done' : ''} ${ne ? 'bad' : ''}" role="tab" type="button" data-fam="${f.k}" aria-selected="${f.k === S.fam}"
      title="Família ${esc(famNome(f.k))} do catálogo do GR · ${esc(exemplos)}">
      <span class="n">${esc(famNome(f.k))}</span>
      <span class="st exemplo">${esc(exemplos)}</span><span class="st">${st}</span><span class="st num">${f.total ? brl(f.total) : '<span class="muted">sem valor</span>'}</span></button>`;
  }).join('');
  $('ftabs').querySelectorAll('[data-fam]').forEach(b => b.onclick = () => trocarFam(b.dataset.fam));
  // erros
  document.querySelectorAll('#map-wrap .err').forEach(e => { e.hidden = true; e.textContent = ''; });
  document.querySelectorAll('#map-wrap .bad').forEach(e => e.classList.remove('bad'));
  document.querySelectorAll('#map-wrap .bad-row').forEach(e => e.classList.remove('bad-row'));
  if (S.mostrarErros) V.erros.filter(e => e.k === S.fam).forEach(e => {
    const alvo = $(e.id), msg = $('e-' + e.id);
    if (alvo){ if (alvo.tagName === 'TR') alvo.classList.add('bad-row'); else alvo.classList.add('bad'); }
    if (msg && msg.hidden){ msg.hidden = false; msg.textContent = e.msg; }

}
function pintarPassos(s, C, V){
  const alvo = $('passos'); if (!alvo) return;
  if (soLeitura(s)){ alvo.innerHTML = ''; return; }
  const cols = colunas(s);
  let nomes = 0, comPreco = 0, escolhidos = 0, condOk = 0, condPrec = 0;
  C.fams.forEach(f => cols.forEach(j => {
    if (f.F.forn[j].nome.trim()) nomes++;
    if (f.linhas.some(l => l.valido[j])) comPreco++;
    const x = f.forn.find(y => y.j === j), ff = f.F.forn[j];
    if (x.n){ condPrec++; if ([ff.frete, ff.prazo, ff.cond].every(v => String(v).trim() !== '')) condOk++; }
  }));
  escolhidos = C.escolhidos;
  const totalCols = C.fams.length * cols.length;
  const passos = [
    { n:1, txt:'Quem cotou', v:`${nomes} de ${totalCols}`, feito: nomes === totalCols },
    { n:2, txt:'Preços', v:`${comPreco} de ${totalCols} colunas`, feito: comPreco === totalCols },
    { n:3, txt:'Quem fornece cada item', v:`${escolhidos} de ${C.nItens}`, feito: escolhidos === C.nItens && C.nItens > 0 },
    { n:4, txt:'Condições de quem venceu', v: condPrec ? `${condOk} de ${condPrec}` : '—', feito: condPrec > 0 && condOk === condPrec },
  ];
  const agora = passos.findIndex(p => !p.feito);
  alvo.innerHTML = passos.map((p,i) => `<span class="passo ${p.feito ? 'feito' : ''} ${i === agora ? 'agora' : ''}">
      <span class="n">${p.feito ? '✓' : p.n}</span>${p.txt} <b>${p.v}</b></span>`).join('');
}

function trocarFam(k){ S.fam = k; pintarTabela(); refresh(); const b = document.querySelector(`[data-fam="${k}"]`); if (b) b.focus(); }

function pintarResumo(C){
  const s = sol(S.solId);
  const linhas = [];
  C.fams.forEach(f => f.forn.forEach(x => { if (!x.n) return; const fo = f.F.forn[x.j];
    linhas.push(`<tr><td>${esc(fo.nome || 'Fornecedor ' + (x.j+1) + ' (sem nome)')}</td><td>${esc(famNome(f.k))}</td><td class="r num">${x.n}</td><td class="r num">${brl(x.sub)}</td><td class="r num">${x.desc ? n2(x.desc) + '%' : '—'}</td><td class="r num">${brl(x.frete)}</td><td class="r num"><strong>${brl(x.total)}</strong></td><td>${fo.prazo ? esc(fo.prazo) + ' dias' : '—'}</td><td>${esc(fo.cond.trim() || '—')}</td></tr>`); }));
  $('resumo').innerHTML = linhas.length
    ? `<div class="tbl-wrap"><table><thead><tr><th>Fornecedor</th><th>Família</th><th class="r">Itens</th><th class="r">Subtotal</th><th class="r">Desconto</th><th class="r">Frete</th><th class="r">Total</th><th>Prazo</th><th>Pagamento</th></tr></thead>
       <tbody>${linhas.join('')}</tbody><tfoot><tr><td colspan="2">Orçamento da solicitação</td><td class="r num">${C.escolhidos} de ${C.nItens}</td><td colspan="3"></td><td class="r num">${brl(C.total)}</td><td colspan="2"></td></tr></tfoot></table></div>
       ${s.cot.obs && soLeitura(s) ? `<div class="obs-box"><label>Observação do comprador</label><div class="just">${esc(s.cot.obs)}</div></div>` : ''}`
    : '<div class="state" style="padding:18px">Nenhum item escolhido ainda. Marque ✓ no fornecedor de cada item e o resumo aparece aqui.</div>';
}

function pintarBarra(V){
  const s = sol(S.solId), C = V.C, ro = soLeitura(s), c = s.cot;
  const nErr = V.erros.length;
  $('bar').innerHTML = `<div class="bar-in">
    <div class="kv main"><span class="k">Orçamento</span><span class="v">${brl(ro ? s.valor : C.total)}</span></div>
    <div class="kv"><span class="k">Itens escolhidos</span><span class="v">${C.escolhidos} de ${C.nItens}</span></div>
    <div class="kv"><span class="k">Fornecedores</span><span class="v">${C.nForn}</span></div>
    ${!ro && S.mostrarErros && nErr ? `<button class="pend-btn" type="button" id="bt-pend" aria-expanded="${!$('pend').hidden}">${plural(nErr,'pendência','pendências')}</button>` : ''}
    <div class="acts">
      ${ro ? `<button class="btn" type="button" id="bt-voltar2">Voltar à fila</button>`
           : `<span class="saved" id="saved">${textoSalvo(s)}</span>
              <button class="btn" type="button" id="bt-salvar">Salvar e voltar à fila</button>
              <button class="btn primary big" type="button" id="bt-enviar">${s.devolucao ? 'Reenviar para aprovação' : 'Enviar para aprovação'}</button>`}
    </div></div>`;
  if ($('bt-voltar2')) $('bt-voltar2').onclick = voltarFila;
  if ($('bt-salvar')) $('bt-salvar').onclick = async () => {
    const b = $('bt-salvar'); b.disabled = true;
    const ok = await salvarAgora(s);
    b.disabled = false;
    if (ok){ toast(s.mapaEstado ? 'Rascunho salvo' : 'Nada para salvar ainda'); voltarFila(); }
  };
  if ($('bt-enviar')) $('bt-enviar').onclick = tentarEnviar;
  if ($('bt-pend')) $('bt-pend').onclick = () => { if ($('pend').hidden) abrirPend(V); else fecharPend(); };
  if (!$('pend').hidden){ if (!nErr || ro) fecharPend(); else abrirPend(V, true); }
}

function abrirPend(V, silencioso){
  const p = $('pend');
  p.innerHTML = `<h3>Falta resolver para enviar</h3>` + V.erros.map((e,i) => `<button type="button" data-p="${i}"><span class="fam">${esc(famNome(e.k))}</span><br>${esc(e.msg)}</button>`).join('');
  p.hidden = false;
  if ($('bt-pend')) $('bt-pend').setAttribute('aria-expanded','true');
  p.querySelectorAll('[data-p]').forEach(b => b.onclick = () => irPara(V.erros[+b.dataset.p]));
  if (!silencioso){ const b = p.querySelector('button'); if (b) b.focus(); }
}
function fecharPend(){ $('pend').hidden = true; if ($('bt-pend')) $('bt-pend').setAttribute('aria-expanded','false'); }
function irPara(e){
  fecharPend();
  if (e.k !== S.fam){ S.fam = e.k; pintarTabela(); refresh(); }
  const alvo = $(e.foco || e.id);
  if (alvo){ alvo.scrollIntoView({ block:'center', behavior:'smooth' }); setTimeout(() => alvo.focus({ preventScroll:true }), 250); }
}

<script>
/* =====================================================================
   BUSCA DE FORNECEDOR NO CADASTRO (tabela `fornecedores` do banco)
   Com conector do Supabase, procura nos 3.568 cadastros ativos.
   Sem conector (ex.: aberto pelo GitHub Pages), cai na amostra local.
   ===================================================================== */
// Mesma chave pública das outras telas do sistema (index.html, compras.html).
// Ela só dá acesso ao que o banco liberou: aqui, as funções buscar_fornecedor e
// fornecedores_ativos, que devolvem nome, razão social e cidade — nunca CNPJ,
// CPF, telefone ou e-mail, e no máximo 20 achados por busca.
const SUPABASE_URL = 'https://mbwaqnlmscxbacmxdopr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AR4D1JlHB-Z12--QbzwYWQ_URZzmVwl';
const CADASTRO = { modo:null, online:false, total:null, cache:new Map(), aberto:null, idx:-1, timer:null };

async function rpc(fn, corpo){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(corpo || {}) });
  if (!r.ok) throw { code:'http_' + r.status, message:'HTTP ' + r.status };
  return r.json();
}
async function ligarCadastro(){
  try {
    const n = await rpc('fornecedores_ativos');
    CADASTRO.total = typeof n === 'number' ? n : (n && n[0]) || null;
    CADASTRO.modo = 'rest'; CADASTRO.online = true;
  } catch (e) { CADASTRO.modo = null; CADASTRO.online = false; }
  atualizarFonte();
}
function atualizarFonte(){ if (S.view === 'mapa'){ pintarTabela(); refresh(); } }
async function buscarFornecedores(termo){
  const t = termo.trim().toLowerCase();
  if (CADASTRO.cache.has(t)) return CADASTRO.cache.get(t);
  let linhas;
  linhas = await rpc('buscar_fornecedor', { termo: t });
  linhas = Array.isArray(linhas) ? linhas : [];
  CADASTRO.cache.set(t, linhas);
  return linhas;
}
function fecharSug(){
  if (!CADASTRO.aberto) return;
  const cx = CADASTRO.aberto.closest('.busca-cx');
  if (cx){ const l = cx.querySelector('.sug'); if (l) l.remove(); }
  CADASTRO.aberto.setAttribute('aria-expanded','false');
  CADASTRO.aberto = null; CADASTRO.idx = -1;
}
function mostrarSug(input, html){
  const cx = input.closest('.busca-cx'); if (!cx) return;
  let l = cx.querySelector('.sug');
  if (!l){ l = document.createElement('div'); l.className = 'sug'; l.setAttribute('role','listbox'); cx.appendChild(l); }
  l.innerHTML = html;
  input.setAttribute('aria-expanded','true');
  CADASTRO.aberto = input; CADASTRO.idx = -1;
}
async function buscarNoCampo(input){
  const termo = input.value.trim();
  if (!CADASTRO.online || termo.length < 2){ fecharSug(); return; }
  mostrarSug(input, '<div class="aviso">Procurando no cadastro…</div>');
  try {
    const achados = await buscarFornecedores(termo);
    if (document.activeElement !== input) return;
    if (!achados.length){ mostrarSug(input, `<div class="aviso">Nenhum fornecedor com “${esc(termo)}” no cadastro. Só vale fornecedor cadastrado: peça o cadastro ao GR antes de enviar.</div>`); return; }
    mostrarSug(input, achados.map((a,i) => `<button type="button" role="option" aria-selected="false" data-sug="${i}" data-nome="${esc(a.nome)}" data-fid="${esc(a.id)}">${esc(a.nome)}
        <span class="cid">${esc(a.razao_social !== a.nome ? a.razao_social + ' · ' : '')}${esc([a.cidade, a.uf].filter(Boolean).join('/'))}</span></button>`).join(''));
  } catch (e) {
    mostrarSug(input, `<div class="aviso">Não consegui consultar o cadastro agora (${esc((e && e.code) || 'erro')}). Tente de novo em instantes.</div>`);
  }
}

/* =====================================================================
   INTERAÇÕES DO MAPA
   ===================================================================== */
function marcarSalvo(){ const s = sol(S.solId); s.cot.iniciada = true; agendarSalvar(s); }
function aoDigitar(e){
  const t = e.target, k = t.dataset && t.dataset.k;
  if (!k || S.view !== 'mapa') return;
  const s = sol(S.solId); if (soLeitura(s)) return;
  const F = s.cot.fams[S.fam], j = +t.dataset.j;
  if (k === 'preco') F.precos[t.dataset.i][j] = t.value; else F.forn[j][k] = t.value;
  if (k === 'nome') F.forn[j].fid = null;
  marcarSalvo(); refresh();
  if (k === 'nome'){ clearTimeout(CADASTRO.timer); CADASTRO.timer = setTimeout(() => buscarNoCampo(t), 280); }
}
$('view').addEventListener('input', aoDigitar);
$('view').addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.busca) buscarNoCampo(e.target); else if (!e.target.closest('.sug')) fecharSug(); });
document.addEventListener('click', e => { if (!e.target.closest('.busca-cx')) fecharSug(); });
$('view').addEventListener('focusout', e => {
  const t = e.target, k = t.dataset && t.dataset.k;
  if (S.view !== 'mapa' || !(k === 'preco' || k === 'frete')) return;
  const n = parseBR(t.value); if (!ok(n) || n < 0) return;
  const f = n2(n); if (f === t.value) return;
  t.value = f;
  const F = sol(S.solId).cot.fams[S.fam], j = +t.dataset.j;
  if (k === 'preco') F.precos[t.dataset.i][j] = f; else F.forn[j].frete = f;
});
$('view').addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.busca && CADASTRO.aberto === t){
    const itens = [...t.closest('.busca-cx').querySelectorAll('[data-sug]')];
    if (itens.length && ['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){
      if (e.key === 'Escape'){ fecharSug(); return; }
      if (e.key === 'Enter'){ e.preventDefault(); (itens[CADASTRO.idx] || itens[0]).click(); return; }
      e.preventDefault();
      CADASTRO.idx = e.key === 'ArrowDown' ? Math.min(CADASTRO.idx + 1, itens.length - 1) : Math.max(CADASTRO.idx - 1, 0);
      itens.forEach((b,i) => b.setAttribute('aria-selected', String(i === CADASTRO.idx)));
      itens[CADASTRO.idx].scrollIntoView({ block:'nearest' });
      return;
    }
  }
  if (e.key !== 'Enter' || !t.dataset || !['preco','desc','frete','prazo'].includes(t.dataset.k)) return;
  e.preventDefault();
  const s = sol(S.solId), j = t.dataset.j;
  const itens = s.itens.filter(it => famKey(it) === S.fam);
  let prox;
  if (t.dataset.k === 'preco'){
    const i = itens.findIndex(it => it.id === t.dataset.i);
    prox = i < itens.length - 1 ? $(`p-${S.fam}-${itens[i+1].id}-${j}`) : $(`d-${S.fam}-${j}`);
  } else prox = $({ desc:'f', frete:'z', prazo:'c' }[t.dataset.k] + `-${S.fam}-${j}`);
  if (prox){ prox.focus(); if (prox.select) prox.select(); }
});
$('view').addEventListener('click', e => {
  const sug = e.target.closest('[data-sug]');
  if (sug){
    const input = CADASTRO.aberto;
    if (input){
      input.value = sug.dataset.nome;
      const F = sol(S.solId).cot.fams[S.fam]; F.forn[+input.dataset.j].nome = sug.dataset.nome; F.forn[+input.dataset.j].fid = sug.dataset.fid || null;
      fecharSug(); marcarSalvo(); refresh(); input.focus();
    }
    return;
  }
  const fc = e.target.closest('[data-foco]');
  if (fc && S.view === 'mapa'){
    const j = +fc.dataset.foco;
    S.foco = S.foco === j ? null : j;
    refresh();
    if (S.foco !== null){
      const primeiro = document.querySelector(`.map tbody .cj-${j} input`);
      if (primeiro) primeiro.focus();
      toast('Preenchendo só o ' + fc.textContent + '. Clique de novo para sair.');
    }
    return;
  }
  const cel = e.target.closest('td.k');
  if (cel && !e.target.closest('[data-pick]')){ const bt = cel.querySelector('[data-pick]'); if (bt && !bt.disabled) bt.click(); return; }
  const b = e.target.closest('[data-pick],[data-more]'); if (!b || S.view !== 'mapa') return;
  if (b.dataset.more){
    const d = $('dd-' + b.dataset.more), aberto = d.classList.toggle('open');
    b.textContent = aberto ? 'recolher' : 'ver descrição toda'; return;
  }
  const s = sol(S.solId); if (soLeitura(s)) return;
  const F = s.cot.fams[S.fam], i = b.dataset.i, j = +b.dataset.j;
  if (F.escolha[i] === j) delete F.escolha[i]; else F.escolha[i] = j;
  marcarSalvo(); refresh();
});
function escolherMenores(){
  const s = sol(S.solId), fc = calcFam(s, S.fam);
  let n = 0;
  fc.linhas.forEach(l => {
    let j = l.menor.indexOf(true);
    if (j < 0 && l.nPrecos === 1) j = l.valido.indexOf(true);
    if (j >= 0){ fc.F.escolha[l.it.id] = j; n++; }
  });
  if (!n){ toast('Digite os preços primeiro — nenhum item tem preço nesta família'); return; }
  marcarSalvo(); refresh();
  toast(`Menor preço marcado em ${plural(n,'item','itens')}. Confira antes de enviar.`);
}

/* ENVIAR, REPROVAR, SALVAR E ORÇAMENTOS: no script do banco, abaixo. */
async function voltarFila(){
  const s = sol(S.solId);
  if (s && s.sujo && !(await salvarAgora(s))){ toast('Não consegui salvar a última mudança. Tente de novo antes de sair.'); return; }

}

/* =====================================================================
   GERAL

let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) fecharModal(); });
document.addEventListener('keydown', e => {

  if (e.key === 'Escape' && S.view === 'mapa' && S.foco !== null){ S.foco = null; refresh(); return; }
  if (e.key === 'Escape' && !$('pend').hidden){ fecharPend(); if ($('bt-pend')) $('bt-pend').focus(); }

<script>
/* =====================================================================
   MESA LIGADA AO BANCO (etapa 4, 29/09)
   Link pessoal do comprador: mesa-cotacao.html?t=cp-…  O token vai no corpo
   das chamadas (POST), nunca na URL da chamada. Só pedidos do caminho das

     fila_do_comprador · pedido_telas · salvar_mapa · enviar_mapa

   ===================================================================== */
const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
const ANEXO_URL = 'https://grupoleh.app.n8n.cloud/webhook/anexo';
const ORC_MAX = 10 * 1024 * 1024;
const ORC_TIPOS = /^(application\/pdf|image\/(jpeg|png|webp|heic|heif))$/;
const ETAPA_BANCO = { cotacao:'cot', gerencial:'ger', financeiro:'fin', lider:'lid' };
const NOME_ETAPA = { lider:'liderança imediata', gerencial:'aprovação gerencial', financeiro:'aprovação financeira', cotacao:'cotação', edicao:'edição' };

function tamanho(b){ b = Number(b) || 0; if (b < 1024) return b + ' B'; if (b < 1048576) return Math.round(b/1024) + ' KB'; return (b/1048576).toFixed(1).replace('.', ',') + ' MB'; }
const numBR = v => v === null || v === undefined || v === '' ? '' : String(v).replace('.', ',');
const itemDoBanco = i => ({ id:i.id, cod:i.codigo || null, desc:i.descricao || '', un:i.unidade || '', qtd:Number(i.quantidade) || 0, fam:i.familia || 'FORA', fora:!!i.fora_catalogo });

/* ---------- fila ---------- */
let carregandoFila = null;
async function carregarFila(manual, silencioso){
  if (!TOKEN){

}

function deBanco(p, velho){
  const s = {
    uid:p.id, id:p.numero || '—', versao:p.versao,
    empresa:p.empresa_nome || '—', cc:p.centro_custo || '—', ccNome:p.centro_custo_nome || '—',
    setor:[p.setor, p.unidade].filter(Boolean).join(' · ') || '—',
    solicitante:p.solicitante_nome || p.facilitador || '—', facilitador:p.facilitador,
    comprador:p.comprador_responsavel || S.comprador, local:p.local_entrega || null,
    motivo:p.motivo || p.assunto || '',
    criada:new Date(p.aberto_em || p.desde), necessidade:p.data_necessidade ? new Date(String(p.data_necessidade).slice(0,10) + 'T12:00:00') : null,
    tipo:p.tipo_compra || 'normal', urgente:p.tipo_compra === 'urgente',
    defForn:p.definicao_fornecedor === 'unico' ? 'unico' : 'cotacao', justForn:p.justificativa_fornecedor || null,
    status:ETAPA_BANCO[p.etapa_atual] || 'cot', comQuemNome:p.com_quem || null,
    mapaEstado:p.mapa_estado || null, versaoMapa:p.mapa_versao || 0,
    valor:p.total !== null && p.total !== undefined && p.etapa_atual !== 'cotacao' ? Number(p.total) : null,
    devolucao:p.aba === 'devolvidas' && p.devolucao ? { motivo:p.devolucao.motivo || '', por:p.devolucao.por || 'o aprovador', em:new Date(p.devolucao.em), etapa:p.devolucao.etapa } : null,
    itens:(p.itens || []).map(itemDoBanco),
    eventos:[{ data:new Date(p.desde || p.aberto_em), titulo:'Chegou nesta etapa', pessoa:null }],
    orcamentosN:p.orcamentos || 0, anexos:[], cot:null, carregado:false, sujo:false
  };
  // Mudança local ainda não gravada, do mesmo mapa: fica.
  if (velho && velho.cot && velho.sujo && velho.versaoMapa === s.versaoMapa){ s.cot = velho.cot; s.sujo = true; }
  return s;
}

/* ---------- pedido completo (detalhe e mapa) ---------- */
function eventoDoBanco(m){
  const et = NOME_ETAPA[m.etapa] || m.etapa || '';
  const prox = NOME_ETAPA[m.etapa_seguinte] || m.etapa_seguinte || '';
  const t = {
    criado:'Solicitação aberta', aprovado:'Aprovado em ' + et, reprovado:'Reprovado em ' + et,
    devolvido:'Devolvida ao comprador em ' + et, cotacao_enviada:'Cotação enviada para ' + prox + (m.total ? ' · ' + brl(Number(m.total)) : ''),
    cancelado:'Cancelado', edicao_iniciada:'Edição começou', edicao_salva:'Edição salva', edicao_desistida:'Edição abandonada',
    edicao_expirada:'Edição desfeita sem salvar'
  }[m.acao] || m.acao;
  return { data:new Date(m.em), titulo:t, pessoa:m.quem || null, nota:m.motivo || null, bad:m.acao === 'reprovado' || m.acao === 'devolvido' };
}
async function carregarPedido(s){
  let r;
  try { r = await rpc('pedido_telas', { p_token: TOKEN, p_id: s.uid }); }
  catch (e){ throw new Error('A rede falhou. Tente de novo.'); }
  if (!r || r.ok !== true) throw new Error((r && r.mensagem) || 'Não consegui abrir este pedido.');
  const p = r.pedido;
  s.versao = p.versao;
  s.status = ETAPA_BANCO[p.etapa_atual] || s.status;
  s.local = p.local_entrega || s.local;
  s.empresa = p.empresa_nome || s.empresa;
  s.comQuemNome = p.com_quem || s.comQuemNome;
  s.itens = (r.itens || []).map(itemDoBanco);
  s.anexos = r.anexos || [];
  const ev = (r.linha_do_tempo || []).map(eventoDoBanco);
  if (ev.length) s.eventos = ev;
  if (!s.sujo){
    s.cot = mapaParaCot(s, r.mapa);
    s.versaoMapa = r.mapa ? r.mapa.versao : 0;
    s.mapaEstado = r.mapa ? r.mapa.estado : null;
    if (r.mapa && r.mapa.estado === 'enviada') s.valor = r.mapa.resumo ? Number(r.mapa.resumo.total) : s.valor;
  }
  s.carregado = true;
}
function mapaParaCot(s, m){
  const c = novaCot(s);
  if (!m) return c;
  const famDoItem = {}; s.itens.forEach(it => famDoItem[it.id] = famKey(it));
  ((m.resumo && m.resumo.familias) || []).forEach(fa => {
    const F = c.fams[fa.familia]; if (!F) return;
    (fa.fornecedores || []).forEach(f => {
      const j = Number(f.coluna) - 1; if (!(j >= 0 && j <= 2)) return;
      Object.assign(F.forn[j], {
        nome:f.nome || '', fid:f.fornecedor_id || null,
        desc:f.desconto_pct === null || f.desconto_pct === undefined ? '' : numBR(Number(f.desconto_pct)),
        frete:f.frete === null || f.frete === undefined ? '' : n2(Number(f.frete)),
        prazo:f.prazo_dias === null || f.prazo_dias === undefined ? '' : String(f.prazo_dias),
        cond:f.condicao || '' });
    });
  });
  (m.precos || []).forEach(p => { const F = c.fams[famDoItem[p.item_id]]; if (F && F.precos[p.item_id]) F.precos[p.item_id][p.coluna - 1] = n2(Number(p.preco)); });
  (m.escolhas || []).forEach(e => { const F = c.fams[famDoItem[e.item_id]]; if (F) F.escolha[e.item_id] = e.coluna - 1; });
  c.obs = m.observacao || '';
  c.iniciada = true;
  return c;
}
function cotParaMapa(s){
  const c = s.cot, fornecedores = [], precos = [], escolhas = [];
  const cols = colunas(s);
  Object.keys(c.fams).forEach(k => {
    const F = c.fams[k];
    cols.forEach(j => {
      const f = F.forn[j];
      const d = parseBR(f.desc), fr = parseBR(f.frete), pz = parseBR(f.prazo);
      const tem = f.nome.trim() || f.fid || String(f.desc).trim() || String(f.frete).trim() || String(f.prazo).trim() || f.cond.trim();
      if (!tem) return;
      fornecedores.push({ familia:k, coluna:j + 1, fornecedor_id:f.fid || null, fornecedor_nome:f.nome.trim() || null,
        desconto_pct: ok(d) && d >= 0 && d <= 100 ? d : null,
        frete: ok(fr) && fr >= 0 ? fr : null,
        prazo_dias: ok(pz) && pz >= 0 && Number.isInteger(pz) ? pz : null,
        condicao: f.cond.trim() || null });
    });
    Object.keys(F.precos).forEach(iid => F.precos[iid].forEach((v, j) => {
      if (!cols.includes(j)) return;
      const n = parseBR(v); if (ok(n) && n > 0) precos.push({ item_id:iid, coluna:j + 1, preco:n });
    }));
    Object.keys(F.escolha).forEach(iid => { const j = F.escolha[iid]; if (j !== undefined && j !== null && cols.includes(j)) escolhas.push({ item_id:iid, coluna:j + 1 }); });
  });
  return { fornecedores, precos, escolhas, observacao:c.obs || '' };
}

/* ---------- salvar (rascunho no banco) ---------- */
const GRAVA = { timer:null, voando:null, tentar:null };
function textoSalvo(s){
  if (s.erroSalvar) return '⚠ ' + s.erroSalvar;
  if (s.sujo) return 'Salvando…';
  if (s.cot && s.cot.salvoEm) return 'Rascunho salvo às ' + hm(s.cot.salvoEm);
  return s.mapaEstado ? 'Rascunho salvo' : 'Nada preenchido ainda';
}
function mostrarSalvo(s){ const el = $('saved'); if (el && S.solId === s.id){ el.textContent = textoSalvo(s); el.classList.toggle('erro', !!s.erroSalvar); } }
function agendarSalvar(s){
  if (!s || soLeitura(s)) return;
  s.sujo = true; mostrarSalvo(s);
  clearTimeout(GRAVA.timer);
  GRAVA.timer = setTimeout(() => salvarAgora(s), 1200);
}
async function salvarAgora(s){
  clearTimeout(GRAVA.timer); clearTimeout(GRAVA.tentar);
  while (GRAVA.voando) await GRAVA.voando;
  if (!s.sujo) return true;
  if (s.conflito) return false;
  GRAVA.voando = (async () => {
    s.sujo = false;
    const corpo = { p_token: TOKEN, p_id: s.uid, p_versao_mapa: s.versaoMapa || 0, p_mapa: cotParaMapa(s) };
    let r;
    try { r = await rpc('salvar_mapa', corpo); } catch (e){ r = { ok:false, erro:'rede', mensagem:'Sem conexão.' }; }
    if (r && r.ok === true){
      s.versaoMapa = r.versao_mapa; s.mapaEstado = r.estado; s.erroSalvar = null;
      s.cot.salvoEm = new Date(); mostrarSalvo(s); return true;
    }
    s.sujo = true;
    if (r && r.erro === 'versao_mudou'){
      s.conflito = true;
      s.erroSalvar = 'Este mapa foi salvo em outra aba. Atualize para ver a versão de lá.';
      mostrarConflito(s);
    } else if (r && r.erro === 'fora_da_cotacao'){
      s.conflito = true; s.erroSalvar = 'Este pedido saiu da cotação (reprovado ou já enviado). Volte à fila.';
    } else {
      s.erroSalvar = 'Não consegui salvar: ' + ((r && r.mensagem) || 'erro') + ' Tento de novo em instantes.';
      GRAVA.tentar = setTimeout(() => salvarAgora(s), 6000);
    }
    mostrarSalvo(s); return false;
  })();
  const res = await GRAVA.voando; GRAVA.voando = null;
  if (res && s.sujo) return salvarAgora(s);
  return res;
}
function mostrarConflito(s){
  if (S.view !== 'mapa' || S.solId !== s.id) return;
  abrirModal(`<div class="m-head"><div><div class="eyebrow"><span class="mono">${esc(s.id)}</span></div><h2 id="m-title">O mapa mudou em outro lugar</h2></div></div>
    <div class="m-body"><p>Este mapa foi salvo em outra aba ou por outra pessoa depois que você abriu. Para não apagar o que foi feito lá, a última mudança daqui não foi gravada.</p></div>
    <div class="m-foot"><span></span><div class="nav"><button class="btn primary" type="button" id="cf-ok">Abrir a versão salva</button></div></div>`, 'sm');
  S.modalTipo = 'conflito';
  $('cf-ok').onclick = async () => { fecharModal(); s.sujo = false; s.conflito = false; s.erroSalvar = null; S.view = 'fila'; await abrirMapa(s.id); };
}
/* Fechar a aba com mudança pendente: tenta gravar mesmo assim. */
window.addEventListener('pagehide', () => {
  const s = S.solId && sol(S.solId);
  if (!s || !s.sujo || s.conflito || soLeitura(s)) return;
  try {
    fetch(SUPABASE_URL + '/rest/v1/rpc/salvar_mapa', { method:'POST', keepalive:true,
      headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: TOKEN, p_id: s.uid, p_versao_mapa: s.versaoMapa || 0, p_mapa: cotParaMapa(s) }) });
  } catch (e){}
});

/* ---------- enviar para aprovação ---------- */
const proximaEtapa = s => s.tipo === 'mensal' ? 'aprovação financeira' : 'aprovação gerencial';
function tentarEnviar(){
  const s = sol(S.solId);
  S.mostrarErros = true;
  const V = validar(s);
  refresh();
  if (V.erros.length){ abrirPend(V); toast(`Falta resolver ${plural(V.erros.length,'pendência','pendências')} antes de enviar`); return; }
  fecharPend();
  /* 29/09: um fornecedor basta — menos de 3 preços vai como aviso ao aprovador, sem
     obrigar observação. Obrigatória só quando a escolha não é o menor preço, e no reenvio. */
  const C = V.C, precisaObs = V.avisos.some(a => a.tipo === 'nao_menor') || !!s.devolucao;
  const linhas = [];
  C.fams.forEach(f => f.forn.forEach(x => { if (x.n) linhas.push(`<div><span>${esc(f.F.forn[x.j].nome)} <span class="muted">· ${esc(famNome(f.k))} · ${plural(x.n,'item','itens')}</span></span><span class="v">${brl(x.total)}</span></div>`); }));
  const destino = proximaEtapa(s);
  abrirModal(`
    <div class="m-head"><div><div class="eyebrow"><span class="mono">${esc(s.id)}</span></div><h2 id="m-title">${s.devolucao ? 'Reenviar' : 'Enviar'} para ${destino}</h2>
      <div class="sub">Depois de enviar, o mapa fica só para leitura até o aprovador responder.</div></div>
      <button class="x" id="m-close" type="button" aria-label="Fechar">✕</button></div>
    <div class="m-body">
      <div class="sumlines">${linhas.join('')}<div class="grand"><span><strong>Orçamento</strong></span><span class="v">${brl(C.total)}</span></div></div>
      ${s.defForn === 'unico' ? `<div class="holder info unico-envio" style="flex-direction:column;align-items:flex-start"><strong>Fornecedor único</strong><span>O solicitante dispensou a cotação com outros fornecedores. O aprovador vê isso em destaque, com a justificativa.</span></div>` : ''}
      ${V.avisos.length ? `<div class="holder warn" style="flex-direction:column;align-items:flex-start"><strong>O aprovador vai ver estes pontos</strong><ul class="warnlist">${V.avisos.map(a => `<li>${esc(a.msg)}</li>`).join('')}</ul></div>` : ''}
      <div class="obs-box" style="margin:0">
        <label for="dlg-obs">Observação para o aprovador${precisaObs ? '' : ' <span class="muted">(opcional)</span>'}</label>
        ${precisaObs ? `<span class="muted" style="font-size:12.5px">${s.devolucao ? 'Responda ao motivo da devolução.' : 'Explique por que a escolha não é o menor preço — obrigatório nesse caso.'}</span>` : ''}
        <textarea class="inp" id="dlg-obs" rows="3" placeholder="${s.devolucao ? 'ex.: negociei o frete com o Fornecedor 2, caiu para R$ 250,00' : 'ex.: Fornecedor 2 entrega em 2 dias, os outros só na semana que vem'}">${esc(s.devolucao ? '' : s.cot.obs)}</textarea>
        <div class="err" id="e-dlg-obs" hidden></div>
      </div>
      <div class="err" id="e-dlg" hidden></div>
    </div>
    <div class="m-foot"><span></span><div class="nav"><button class="btn" type="button" id="dlg-cancel">Voltar ao mapa</button><button class="btn primary" type="button" id="dlg-ok">${s.devolucao ? 'Reenviar' : 'Enviar'} · ${brl(C.total)}</button></div></div>`, 'sm');
  S.modalTipo = 'enviar';
  $('m-close').onclick = fecharModal; $('dlg-cancel').onclick = fecharModal;
  $('dlg-obs').oninput = () => { $('e-dlg-obs').hidden = true; $('dlg-obs').classList.remove('bad'); };

  $('dlg-ok').onclick = async () => {
    if (enviando) return;

    const falhou = msg => { enviando = false; b.disabled = false; $('dlg-cancel').disabled = false; b.textContent = (s.devolucao ? 'Reenviar' : 'Enviar') + ' · ' + brl(C.total); $('e-dlg').hidden = false; $('e-dlg').innerHTML = msg; };
    if (!s.devolucao){ s.cot.obs = obs; s.sujo = true; }
    if (!(await salvarAgora(s))) return falhou(esc(s.erroSalvar || 'Não consegui salvar o mapa antes de enviar.'));
    let r;
    try { r = await rpc('enviar_mapa', { p_token: TOKEN, p_id: s.uid, p_versao_mapa: s.versaoMapa, p_observacao: obs || null }); }
    catch (e){ r = { ok:false, mensagem:'A rede falhou no meio. Confira na fila se a cotação foi enviada antes de tentar de novo.' }; }
    if (!r || r.ok !== true){
      const lista = (r && r.bloqueios) || [];

      return falhou('<strong>' + esc((r && r.mensagem) || 'O banco recusou o envio.') + '</strong>' + (lista.length ? '<ul class="warnlist">' + lista.map(x => '<li>' + esc(x.msg) + '</li>').join('') + '</ul>' : ''));

/* ---------- reprovar o pedido (motivo obrigatório) ---------- */
function abrirReprovar(s){

  S.modalTipo = 'reprovar';
  $('m-close').onclick = fecharModal; $('rp-cancel').onclick = fecharModal;
  $('rp-mot').oninput = () => { $('e-rp').hidden = true; $('rp-mot').classList.remove('bad'); };
  let indo = false;
  $('rp-ok').onclick = async () => {
    if (indo) return;
    const m = $('rp-mot').value.trim();
    if (m.length < 5){ $('e-rp').hidden = false; $('e-rp').textContent = 'Escreva o motivo (mínimo 5 letras).'; $('rp-mot').classList.add('bad'); $('rp-mot').focus(); return; }
    indo = true; const b = $('rp-ok'); b.disabled = true; b.textContent = 'Reprovando…';
    let r;
    try { r = await rpc('reprovar_na_cotacao', { p_token: TOKEN, p_id: s.uid, p_versao: s.versao, p_motivo: m }); }
    catch (e){ r = { ok:false, mensagem:'A rede falhou. Tente de novo.' }; }
    if (!r || r.ok !== true){ indo = false; b.disabled = false; b.textContent = 'Reprovar o pedido'; $('e-rp').hidden = false; $('e-rp').textContent = (r && r.mensagem) || 'Não deu certo agora.'; return; }
    clearTimeout(GRAVA.timer); s.sujo = false;
    S.flash = { cls:'crit', html:`<strong>${esc(s.id)} reprovado.</strong> ${esc(r.mensagem || '')}` };
    S.view = 'fila'; S.solId = null; S.mostrarErros = false;
    fecharModal(); window.scrollTo(0,0);
    await carregarFila(); render();
  };
  $('rp-mot').focus();
}

/* ---------- orçamentos (PDF ou foto) no espaço privado ---------- */
const orcamentosDe = s => (s.anexos || []).filter(a => /^Orçamento · /.test(a.nome || ''));
function pintarOrcamentos(s){
  const alvo = $('orcamentos'); if (!alvo) return;
  const lista = orcamentosDe(s), ro = soLeitura(s);
  alvo.innerHTML = (lista.length
      ? `<ul class="anexos-lista">${lista.map(a => `<li><a href="${ANEXO_URL}?id=${encodeURIComponent(a.id)}" target="_blank" rel="noopener">${esc(a.nome.replace(/^Orçamento · /, ''))}</a> <span class="muted">· ${tamanho(a.tamanho)}</span></li>`).join('')}</ul>`
      : `<p class="muted" style="margin:0 0 8px">${ro ? 'Nenhum orçamento anexado.' : 'Nenhum orçamento anexado ainda. Anexe o PDF ou a foto que cada fornecedor mandou — o aprovador vê junto com o pedido.'}</p>`)
    + (ro ? '' : `<label class="btn" id="orc-lbl"><input type="file" id="orc-arq" accept="application/pdf,image/*" multiple hidden>Anexar orçamento</label><span class="muted" id="orc-st" style="margin-left:10px;font-size:12.5px">PDF ou foto, até 10 MB cada.</span>`);
  if ($('orc-arq')) $('orc-arq').onchange = e => subirOrcamentos(s, [...e.target.files]);
}
async function subirOrcamentos(s, arquivos){
  if (!arquivos.length) return;
  const st = $('orc-st'), meta = [], falhas = [];
  if (st) st.textContent = 'Enviando ' + plural(arquivos.length, 'arquivo', 'arquivos') + '…';
  for (const f of arquivos){
    if (f.size > ORC_MAX){ falhas.push(f.name + ' (maior que 10 MB)'); continue; }
    if (!ORC_TIPOS.test(f.type || '')){ falhas.push(f.name + ' (só PDF ou foto)'); continue; }
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
    const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    const caminho = s.uid + '/orcamento-' + id + '.' + ext;
    try {
      const r = await fetch(SUPABASE_URL + '/storage/v1/object/anexos/' + encodeURI(caminho), { method:'POST',
        headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':f.type || 'application/octet-stream', 'x-upsert':'false' }, body:f });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      meta.push({ nome:f.name, caminho, mime:f.type, tamanho:f.size });
    } catch (e){ falhas.push(f.name + ' (não subiu)'); }
  }
  if (meta.length){
    let r;
    try { r = await rpc('registrar_orcamentos', { p_token: TOKEN, p_id: s.uid, p_anexos: meta }); } catch (e){ r = null; }
    if (r && r.ok === true){ s.anexos = (s.anexos || []).filter(a => !/^Orçamento · /.test(a.nome || '')).concat(r.orcamentos || []); }
    else falhas.push('os arquivos subiram mas não ficaram ligados ao pedido' + (r && r.mensagem ? ' — ' + r.mensagem : ''));
  }
  pintarOrcamentos(s);
  const st2 = $('orc-st');
  if (st2){ st2.textContent = falhas.length ? 'Não entrou: ' + falhas.join('; ') : plural(meta.length, 'orçamento anexado', 'orçamentos anexados') + '.'; st2.classList.toggle('erro', !!falhas.length); }
}

/* ---------- a fila se atualiza sozinha (29/09) ----------
   O pedido aparece para o comprador assim que a liderança aprova: a Mesa relê
   a fila a cada 60 s enquanto a aba está aberta, e na hora em que ele volta
   para a aba. Não redesenha enquanto ele digita na busca nem com janela aberta. */
const REFRESCO_MS = 60000;
function idsParaCotar(){ return new Set(SOLS.filter(x => x.status === 'cot' && !x.devolucao).map(x => x.uid)); }
async function refrescar(){
  if (document.hidden || !TOKEN || S.erro) return;
  const antes = idsParaCotar();
  await carregarFila(false, true);
  const novos = [...idsParaCotar()].filter(id => !antes.has(id)).length;
  if (novos && antes.size + novos > 0 && S.jaCarregouUmaVez) toast(plural(novos, 'pedido novo', 'pedidos novos') + ' para cotar');
  S.jaCarregouUmaVez = true;
}
setInterval(refrescar, REFRESCO_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });

/* ---------- início ---------- */
render();
carregarFila().then(() => { S.jaCarregouUmaVez = true; });
ligarCadastro();

</script>
